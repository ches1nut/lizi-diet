<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🌰 diet</title>
<style>
  /* ===== 配色主题（三套，均做过对比度校验）=====
     默认主题写在 :root（暖橙食欲 B）—— 这样即使 JS 被禁用也不会闪一下别的颜色。
     A / C 通过 <html data-theme> 覆盖。
     --tint 是「品牌色的 RGB 三元组」，供 rgba(var(--tint), .28) 这类带透明度的
     阴影/光晕使用 —— 否则换主题后阴影还会是紫色的。 */
  :root{
    /* 主题 B 暖橙食欲（默认）：暖色最贴「吃」这件事 */
    --brand:#9A3412;
    --brand-deep:#7C2D12;
    --brand-2:#C2410C;
    --brand-soft:#FDF1E8;
    --brand-mid:#F3C7A6;
    --accent:#D97706;
    --bg:#FBF7F4;
    --card:#ffffff;
    --text:#241C17;
    --sub:#736A64;
    --border:#EFE2D8;
    --tint:154,52,18;
    /* 语义色（与主题无关，三套共用）：此前 --color-background-success 只被引用、从未定义，
       导致「减脂」徽章与 fit-hint.ok 的底色一直是空的 */
    --color-background-success:#E6F4EF;
    --shadow-sm:0 1px 2px rgba(23,25,35,.04), 0 2px 8px rgba(23,25,35,.05);
    --shadow-md:0 4px 12px rgba(23,25,35,.06), 0 12px 32px rgba(var(--tint),.12);
    --radius:18px;
    --tabbar-h:58px;
  }
  /* 主题 A 深紫精炼：冷静克制，偏工具感 */
  :root[data-theme="A"]{
    --brand:#26215C;
    --brand-deep:#1B1747;
    --brand-2:#4A3FA8;
    --brand-soft:#EEEDFE;
    --brand-mid:#CECBF6;
    --accent:#F59E0B;
    --bg:#F6F7FB;
    --card:#ffffff;
    --text:#1f2329;
    --sub:#6b7280;
    --border:#E6E8F0;
    --tint:38,33,92;
  }
  /* 主题 C 健康绿：清爽，偏「轻食/健康」 */
  :root[data-theme="C"]{
    --brand:#14532D;
    --brand-deep:#0B3A1F;
    --brand-2:#15803D;
    --brand-soft:#E9F4EC;
    --brand-mid:#B4DCC2;
    --accent:#CA8A04;
    --bg:#F5F9F6;
    --card:#ffffff;
    --text:#16211A;
    --sub:#5F6B62;
    --border:#DEE9E1;
    --tint:20,83,45;
  }
  /* 品牌色图标：图标 SVG 源码里写死了紫色描边，这里统一交给主题变量。
     用 class + CSS 而不是把属性值改成 var() —— 呈现属性里的 var() 在部分浏览器不生效。 */
  .ic-brand, .ic-brand *{stroke:var(--brand);}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  .page{
    max-width:680px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column;
    padding-bottom:calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px));
  }

  /* ===== 顶部导航（首页用） ===== */
  .navbar{
    padding:22px 28px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{
    width:38px; height:38px; border-radius:12px;
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
    display:flex; align-items:center; justify-content:center; font-size:19px;
    box-shadow:0 4px 12px rgba(var(--tint),.28);
  }
  .brand .name{font-size:17px; font-weight:700; letter-spacing:.2px;}
  .me-btn{
    width:38px; height:38px; border-radius:50%;
    border:1px solid var(--border); background:var(--card);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:.15s; box-shadow:var(--shadow-sm);
  }
  .me-btn:hover{border-color:var(--brand); transform:translateY(-1px);}
  .me-btn svg{width:19px; height:19px;}

  /* ===== 页面切换 ===== */
  .screen{display:none;}
  .screen.active{display:block; animation:fade .18s;}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1}}

  /* ===== 首页 ===== */
  .main{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:36px 28px 48px;
  }
  .hero{text-align:center; margin-bottom:30px;}
  .hero h1{font-size:26px; font-weight:700; line-height:1.3; color:var(--text);}
  .hero p{font-size:13px; color:var(--sub); margin-top:8px;}

  /* 当前选择方案卡片 */
  .current-card{
    border-radius:var(--radius); padding:18px 20px; margin-bottom:20px;
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
    color:#fff; cursor:pointer; position:relative; overflow:hidden;
    box-shadow:var(--shadow-md); transition:.18s;
  }
  .current-card:hover{transform:translateY(-2px);}
  .current-card::after{
    content:""; position:absolute; right:-40px; top:-40px; width:140px; height:140px;
    border-radius:50%; background:rgba(255,255,255,.12);
  }
  .current-card .cc-label{
    font-size:11px; letter-spacing:1px; opacity:.85; margin-bottom:6px;
    display:flex; align-items:center; gap:6px;
  }
  .current-card .cc-label .dot{
    width:7px; height:7px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 3px rgba(245,158,11,.3);
  }
  .current-card .cc-name{font-size:19px; font-weight:700; margin-bottom:3px; position:relative; z-index:1;}
  .current-card .cc-sub{font-size:12px; opacity:.9; position:relative; z-index:1;}
  .current-card .cc-arrow{
    position:absolute; right:18px; top:50%; transform:translateY(-50%); z-index:1;
  }
  .current-card .cc-arrow svg{width:20px; height:20px;}

  .current-empty{
    border:1.5px dashed var(--brand-mid); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:20px; background:var(--card);
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    cursor:pointer; transition:.15s;
  }
  .current-empty:hover{border-color:var(--brand); background:var(--brand-soft);}
  .current-empty .ce-t{font-size:14px; font-weight:600; color:var(--text);}
  .current-empty .ce-d{font-size:12px; color:var(--sub); margin-top:2px;}
  .current-empty .ce-arrow{color:var(--brand); flex-shrink:0;}
  .current-empty .ce-arrow svg{width:18px; height:18px;}

  /* 首页仪表盘：紧凑方案卡 + 食谱卡 + 今日摄入卡 */
  .home-dash{display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}

  .dash-plan{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-radius:14px; padding:12px 16px; cursor:pointer; transition:.15s;
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
    color:#fff; box-shadow:var(--shadow-sm);
  }
  .dash-plan:hover{transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .dash-plan .dp-label{font-size:10.5px; letter-spacing:1px; opacity:.85; display:flex; align-items:center; gap:6px; margin-bottom:2px;}
  .dash-plan .dp-label .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(245,158,11,.3);}
  .dash-plan .dp-name{font-size:15px; font-weight:700;}
  .dash-plan .dp-arrow{flex-shrink:0; display:flex; align-items:center;}
  .dash-plan .dp-arrow svg{width:18px; height:18px;}

  .dash-recipe{
    border:1px solid var(--border); border-radius:14px; padding:14px 16px;
    background:var(--card); cursor:pointer; transition:.15s; box-shadow:var(--shadow-sm);
  }
  .dash-recipe:hover{border-color:var(--brand); transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .dash-recipe .dr-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .dash-recipe .dr-t{font-size:14px; font-weight:700; color:var(--text);}
  .dash-recipe .dr-goal{font-size:10.5px; font-weight:600; color:var(--brand); background:var(--brand-soft); padding:2px 8px; border-radius:20px;}
  .dash-recipe .dr-target{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
  .dash-recipe .dr-target span{font-size:11.5px; color:var(--sub);}
  .dash-recipe .dr-target b{color:var(--text);}
  .dash-recipe .dr-meals{display:flex; flex-direction:column; gap:5px;}
  .dash-recipe .rp-meal{display:flex; align-items:center; gap:8px; font-size:12px;}
  .dash-recipe .rp-m{color:var(--brand); font-weight:600; flex-shrink:0; min-width:30px;}
  .dash-recipe .rp-f{color:var(--sub);}

  .dash-intake{
    border:1px solid var(--border); border-radius:14px; padding:14px 16px;
    background:var(--card); cursor:pointer; transition:.15s; box-shadow:var(--shadow-sm);
  }
  .dash-intake:hover{border-color:var(--brand); transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .dash-intake .di-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .dash-intake .di-t{font-size:14px; font-weight:700; color:var(--text);}
  .dash-intake .di-edit{font-size:11.5px; font-weight:600; color:var(--brand);}
  .dash-intake .di-kcal-row{display:flex; align-items:baseline; gap:6px;}
  .dash-intake .di-kcal-num{font-size:28px; font-weight:800; color:var(--text); line-height:1.1;}
  .dash-intake .di-kcal-unit{font-size:12px; color:var(--sub);}
  .dash-intake .di-bar{height:8px; border-radius:6px; background:var(--brand-soft); overflow:hidden; margin:8px 0 6px;}
  .dash-intake .di-bar-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--brand),var(--brand-2)); transition:width .4s;}
  .dash-intake .di-macros{display:flex; gap:12px; font-size:11.5px; color:var(--sub); margin-bottom:8px;}
  .dash-intake .di-macros b{color:var(--text);}
  .dash-intake .di-macros .di-pct{margin-left:auto; font-weight:700; color:var(--brand);}
  .dash-intake .di-list{border-top:0.5px solid var(--border); padding-top:8px; display:flex; flex-direction:column; gap:5px;}
  .dash-intake .di-item{display:flex; align-items:center; gap:8px; font-size:12px;}
  .dash-intake .di-item .di-name{flex:1; color:var(--text);}
  .dash-intake .di-item .di-meta{color:var(--sub); font-size:11px;}
  .dash-intake .di-item .di-kcal{color:var(--sub); font-weight:600;}
  .dash-intake .di-empty{font-size:12px; color:var(--sub); padding:4px 0;}
  .dash-intake .di-more{font-size:11px; color:var(--sub);}

  /* 不知道吃什么 → 推荐食谱 引导卡 */
  .dash-what{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border:1px solid var(--border); border-radius:14px; padding:14px 16px;
    background:var(--card); box-shadow:var(--shadow-sm);
  }
  .dash-what .dw-main{display:flex; align-items:center; gap:12px; flex:1; min-width:0;}
  .dash-what .dw-emoji{font-size:30px; flex-shrink:0;}
  .dash-what .dw-t{font-size:15px; font-weight:700; color:var(--text);}
  .dash-what .dw-d{font-size:12px; color:var(--sub); margin-top:2px;}
  .dash-what .dw-btn{
    flex-shrink:0; padding:10px 16px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
    font-size:13px; font-weight:700; box-shadow:var(--shadow-sm); transition:.15s;
  }
  .dash-what .dw-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-md);}

  .entries{display:grid; gap:14px;}
  .entry{
    border-radius:var(--radius); padding:22px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    cursor:pointer; text-align:left; transition:.16s;
  }
  .entry .t{font-size:17px; font-weight:700; margin-bottom:6px;}
  .entry .d{font-size:13px; line-height:1.6;}
  .entry .arrow{
    width:48px; height:48px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .entry .arrow svg{width:22px; height:22px;}

  .entry.recommend{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%); color:#fff; border:none;
    box-shadow:var(--shadow-md);}
  .entry.recommend:hover{transform:translateY(-2px);}
  .entry.recommend .d{color:var(--brand-mid);}
  .entry.recommend .arrow{background:rgba(255,255,255,.16);}

  .entry.browse{background:var(--card); border:1px solid var(--border); color:var(--text);
    box-shadow:var(--shadow-sm);}
  .entry.browse:hover{border-color:var(--brand); transform:translateY(-2px);}
  .entry.browse .d{color:var(--sub);}
  .entry.browse .arrow{background:var(--brand-soft);}

  .foot{text-align:center; color:#a6acb8; font-size:12px; padding:0 28px 28px;}

  /* 轻量 toast 提示 */
  .toast{
    position:fixed; left:50%; bottom:calc(var(--tabbar-h) + 26px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%) translateY(20px);
    background:rgba(31,35,41,.92); color:#fff; font-size:13px; padding:10px 18px;
    border-radius:22px; opacity:0; pointer-events:none; transition:.25s; z-index:9999;
    box-shadow:0 8px 24px rgba(0,0,0,.2); white-space:nowrap; max-width:82vw;
    text-overflow:ellipsis; overflow:hidden;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ===== 列表页 ===== */
  .list-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .back-btn{
    width:34px; height:34px; border-radius:10px;
    border:1px solid var(--border); background:var(--card);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition:.15s; box-shadow:var(--shadow-sm);
  }
  .back-btn:hover{border-color:var(--brand);}
  .back-btn svg{width:18px; height:18px;}
  .list-head .title{font-size:16px; font-weight:700;}

  .filters{padding:16px 28px 6px; display:flex; gap:8px; flex-wrap:wrap;}
  .filter{
    font-size:13px; padding:7px 16px; border-radius:18px; cursor:pointer;
    border:1px solid var(--border); background:var(--card); color:var(--sub);
    transition:.15s; font-weight:500;
  }
  .filter.on{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; border-color:transparent; font-weight:600;
    box-shadow:0 4px 10px rgba(var(--tint),.25);}

  .plan-list{padding:14px 28px 100px; display:grid; gap:14px;}
  .plan-card{
    border:1px solid var(--border); border-radius:var(--radius); padding:20px;
    background:var(--card); cursor:pointer; transition:.16s; box-shadow:var(--shadow-sm); position:relative;
  }
  .plan-card:hover{border-color:var(--brand); transform:translateY(-2px); box-shadow:var(--shadow-md);}
  .plan-card .top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px;}
  .plan-card .name{font-size:17px; font-weight:700;}
  .plan-card.sel{border-color:var(--brand); background:var(--brand-soft);}
  .plan-card .chk{
    position:absolute; right:16px; top:16px; width:22px; height:22px; border-radius:7px;
    border:1.5px solid var(--border); background:var(--card); display:flex; align-items:center;
    justify-content:center; transition:.15s; flex-shrink:0; cursor:pointer;
  }
  .plan-card .chk.on{background:var(--brand); border-color:var(--brand);}
  .plan-card .chk svg{width:13px; height:13px; opacity:0; transition:.1s;}
  .plan-card .chk.on svg{opacity:1;}

  /* 底部对比栏 */
  .compare-bar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--tabbar-h) + 18px); z-index:40;
    width:calc(100% - 56px); max-width:624px; border-radius:16px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    box-shadow:0 8px 24px rgba(var(--tint),.32);
  }
  .compare-bar .info{font-size:13px; font-weight:500;}
  .compare-bar .info .cnt{font-weight:800; font-size:15px;}
  .compare-bar button{
    padding:9px 20px; border-radius:11px; border:none; background:#fff; color:var(--brand);
    font-size:14px; font-weight:700; cursor:pointer; flex-shrink:0; transition:.15s;
  }
  .compare-bar button:disabled{opacity:.45; cursor:not-allowed;}
  .compare-bar button:not(:disabled):hover{transform:translateY(-1px);}
  .plan-card .desc{font-size:13px; color:var(--sub); line-height:1.6; margin-bottom:12px;}
  .plan-pick-btn{
    width:100%; margin-top:12px; padding:11px; border-radius:11px; border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
    font-size:14px; font-weight:700; cursor:pointer; transition:.15s;
    box-shadow:var(--shadow-sm);
  }
  .plan-pick-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .plan-current-tag{
    width:100%; margin-top:12px; padding:11px; border-radius:11px; border:none;
    background:var(--brand-soft); color:var(--brand); font-size:14px; font-weight:700;
    text-align:center; cursor:default;
  }
  .plan-card .tags{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{font-size:11px; padding:3px 9px; border-radius:7px; background:var(--brand-soft); color:var(--brand); font-weight:500;}
  .tag{font-size:11px; padding:3px 9px; border-radius:7px; background:#f3f4f6; color:var(--sub); border:1px solid var(--border);}
  .badge{font-size:11px; padding:3px 10px; border-radius:7px; white-space:nowrap; margin-left:10px; flex-shrink:0; font-weight:600;}
  .source{font-size:11px; color:var(--sub); display:inline-flex; align-items:center; gap:4px;}

  /* ===== 方案详情页 ===== */
  .detail-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .detail-chosen-badge{
    margin-left:auto; font-size:12px; font-weight:600;
    color:var(--brand); background:var(--brand-soft);
    padding:5px 11px; border-radius:20px; white-space:nowrap; flex-shrink:0;
  }
  .detail-body{padding:24px 28px 40px;}
  .detail-hero{margin-bottom:24px;}
  .detail-hero .name{font-size:23px; font-weight:800; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
  .detail-hero .target{
    font-size:13px; color:var(--brand-deep); background:var(--brand-soft);
    padding:7px 14px; border-radius:10px; display:inline-block; margin-top:8px; font-weight:500;
  }
  .detail-sec{margin-bottom:26px;}
  .detail-sec .h{
    font-size:15px; font-weight:700; margin-bottom:12px;
    display:flex; align-items:center; gap:8px;
  }
  .detail-sec .h::before{
    content:""; width:4px; height:15px; border-radius:2px;
    background:linear-gradient(180deg,var(--brand),var(--brand-2)); display:inline-block;
  }
  .detail-sec .p{font-size:14px; line-height:1.8; color:var(--text);}
  .detail-sec ul{list-style:none; padding:0;}
  .detail-sec li{
    font-size:14px; line-height:1.7; color:var(--text);
    padding:7px 0 7px 20px; position:relative;
  }
  .detail-sec li::before{
    content:""; position:absolute; left:2px; top:16px;
    width:7px; height:7px; border-radius:50%;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
  }
  .param-row{
    display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--border);
  }
  .param-row:last-child{border-bottom:none;}
  .param-row .k{font-size:13px; color:var(--sub); width:84px; flex-shrink:0; font-weight:500;}
  .param-row .v{font-size:14px; color:var(--text); line-height:1.6;}
  .detail-cta{
    position:sticky; bottom:var(--tabbar-h); padding:14px 28px;
    background:linear-gradient(to top, var(--bg) 70%, rgba(246,247,251,0));
  }
  .detail-cta button{
    width:100%; padding:15px; border-radius:14px; border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
    transition:.15s; box-shadow:var(--shadow-md);
  }
  .detail-cta button:hover{transform:translateY(-1px);}
  .detail-cta .detail-switch-btn{
    width:100%; padding:15px; border-radius:14px; border:1px solid var(--brand);
    background:var(--card); color:var(--brand); font-size:15px; font-weight:700; cursor:pointer;
    transition:.15s; box-shadow:var(--shadow-sm); margin-top:10px;
  }
  .detail-cta .detail-switch-btn:hover{transform:translateY(-1px); background:var(--brand-soft);}
  .detail-cta .cta-sub{
    display:block; text-align:center; margin-top:10px; font-size:13px; color:var(--brand);
    cursor:pointer; font-weight:600;
  }
  .detail-cta .cta-sub:hover{opacity:.7;}

  /* 适合人群判断提示 */
  .fit-hint{
    display:flex; align-items:flex-start; gap:10px; border-radius:14px;
    padding:14px 16px; margin-bottom:6px; font-size:13px; line-height:1.6;
  }
  .fit-hint .fh-ic{font-size:16px; flex-shrink:0; line-height:1.4;}
  .fit-hint.ok{background:var(--color-background-success); color:#0F6E56;}
  .fit-hint.warn{background:#FFF7E6; color:#A16207;}
  .fit-hint.none{background:var(--brand-soft); color:var(--brand-deep);}
  .fit-hint b{font-weight:700;}
  .compare-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .compare-body{padding:20px 28px 40px; overflow-x:auto;}
  .compare-table{
    width:100%; border-collapse:separate; border-spacing:0; min-width:440px;
    font-size:13px;
  }
  .compare-table th, .compare-table td{
    padding:12px 14px; text-align:left; vertical-align:top;
    border-bottom:1px solid var(--border);
  }
  .compare-table thead th{
    position:sticky; top:0; background:var(--card); z-index:1; font-size:14px;
  }
  .compare-table thead th .pname{font-weight:700; font-size:14px; color:var(--text);}
  .compare-table thead th .psrc{font-size:11px; color:var(--sub); font-weight:400; margin-top:2px;}
  .compare-table tbody th{
    color:var(--sub); font-weight:600; white-space:nowrap; width:92px;
    background:var(--bg); position:sticky; left:0;
  }
  .compare-table td{color:var(--text); line-height:1.6;}
  .compare-table tr:last-child th, .compare-table tr:last-child td{border-bottom:none;}
  .compare-goal-badges{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px;}
  .compare-goal-badges .badge{margin-left:0;}
  .compare-cta{
    position:sticky; bottom:var(--tabbar-h); padding:14px 28px;
    background:linear-gradient(to top, var(--bg) 70%, rgba(246,247,251,0));
  }
  .compare-cta .btn-row{display:flex; gap:12px;}
  .compare-cta button{
    flex:1; padding:14px; border-radius:14px; border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
    transition:.15s; box-shadow:var(--shadow-md);
  }
  .compare-cta button:hover{transform:translateY(-1px);}

  /* ===== 计算页 ===== */
  .calc-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .calc-body{padding:24px 28px 40px;}
  .calc-plan-name{font-size:22px; font-weight:800; margin-bottom:4px;}
  .calc-plan-source{font-size:12px; color:var(--sub); margin-bottom:20px;}

  .form-group{margin-bottom:18px;}
  .form-group label{font-size:13px; color:var(--sub); display:block; margin-bottom:8px;}
  .form-group label b{color:var(--text); font-weight:600;}
  .form-input{
    width:100%; padding:13px 15px; border-radius:12px;
    border:1px solid var(--border); background:var(--card);
    font-size:15px; color:var(--text); outline:none; transition:.15s;
  }
  .form-input:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(var(--tint),.12);}
  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .seg{display:flex; gap:8px; flex-wrap:wrap;}
  .seg-item{
    padding:10px 16px; border-radius:11px; cursor:pointer;
    border:1px solid var(--border); background:var(--card); color:var(--sub);
    font-size:13px; transition:.15s; font-weight:500;
  }
  .seg-item.on{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; border-color:transparent; font-weight:600;
    box-shadow:0 4px 10px rgba(var(--tint),.25);}

  .profile-tip{
    background:var(--brand-soft); border-radius:14px; padding:14px 18px;
    font-size:13px; color:var(--text); margin-bottom:20px; line-height:1.6;
    border:1px solid var(--brand-mid);
  }
  .profile-tip a{color:var(--brand); font-weight:600; cursor:pointer; text-decoration:none;}

  .result-card{
    border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:14px;
    background:var(--card); box-shadow:var(--shadow-sm);
  }
  .result-card .rc-title{font-size:13px; color:var(--sub); margin-bottom:14px; font-weight:600;}
  .result-macro{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:10px;}
  .macro-item{
    text-align:center; padding:16px 8px; border-radius:14px;
    background:linear-gradient(180deg,var(--brand-soft) 0%,#fff 100%);
    border:1px solid var(--brand-mid);
  }
  .macro-item .num{font-size:26px; font-weight:800; color:var(--brand-deep);}
  .macro-item .unit{font-size:11px; color:var(--sub);}
  .macro-item .lbl{font-size:12px; color:var(--text); margin-top:3px; font-weight:500;}

  /* ===== 问卷页 ===== */
  .quiz-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .quiz-body{padding:24px 28px 40px;}
  .quiz-progress{
    height:6px; border-radius:3px; background:var(--border); margin-bottom:28px; overflow:hidden;
  }
  .quiz-progress .bar{height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-2)); border-radius:3px; transition:.3s;}
  .quiz-q{font-size:21px; font-weight:700; line-height:1.4; margin-bottom:24px;}
  .quiz-opts{display:grid; gap:12px;}
  .quiz-opt{
    border:1px solid var(--border); border-radius:15px; padding:17px 20px;
    cursor:pointer; transition:.15s; font-size:15px; line-height:1.5;
    background:var(--card); box-shadow:var(--shadow-sm);
  }
  .quiz-opt:hover{border-color:var(--brand); background:var(--brand-soft); transform:translateY(-1px);}
  .quiz-skip{
    display:block; width:100%; margin-top:12px; padding:12px; background:transparent;
    border:none; color:var(--sub); font-size:13px; cursor:pointer; text-align:center;
  }
  .quiz-skip:hover{color:var(--brand);}

  .quiz-result{text-align:center; padding:20px 0;}
  .quiz-result .big{font-size:24px; font-weight:800; margin-bottom:12px;}
  .quiz-result .why{font-size:13px; color:var(--sub); line-height:1.7; margin-bottom:28px; text-align:left;
    background:var(--brand-soft); border-radius:14px; padding:16px 18px; border:1px solid var(--brand-mid);}
  .quiz-result .why b{color:var(--text);}

  /* 备选方案 */
  .quiz-alt{margin:18px 0 24px; text-align:left;}
  .quiz-alt .alt-title{font-size:13px; color:var(--sub); font-weight:600; margin-bottom:10px;}
  .alt-card{
    border:1px solid var(--border); border-radius:13px; padding:13px 15px;
    margin-bottom:8px; cursor:pointer; transition:.15s; background:var(--card);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .alt-card:hover{border-color:var(--brand);}
  .alt-card .ac-name{font-size:14px; font-weight:600; color:var(--text);}
  .alt-card .ac-desc{font-size:12px; color:var(--sub); margin-top:2px; line-height:1.5;}
  .alt-card .ac-arrow{color:var(--brand); flex-shrink:0; font-weight:600;}

  /* ===== 我的面板 ===== */
  .me-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .me-body{padding:24px 28px 40px; max-width:560px; margin:0 auto;}

  .me-section{margin-bottom:26px;}
  .me-section .st{font-size:13px; font-weight:600; color:var(--sub); margin-bottom:10px; padding-left:2px;}
  .me-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden;
  }
  .me-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:15px 18px; font-size:15px;
  }
  .me-row + .me-row{border-top:1px solid var(--border);}
  .me-row .ic{
    width:32px; height:32px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--brand-soft);
  }
  .me-row .ic svg{width:18px; height:18px;}
  .me-row .lbl{color:var(--text); flex:1; text-align:left; display:flex; align-items:center; gap:11px;}
  .me-row .val{color:var(--sub); font-size:14px; max-width:60%; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .me-row .act{color:var(--brand); font-size:14px; cursor:pointer; flex-shrink:0; font-weight:500;}
  .me-row .act:hover{opacity:.7;}
  .me-tip{font-size:12px; color:var(--sub); line-height:1.6; margin-top:8px; padding:0 4px;}
  /* 配色主题选择器 */
  .theme-opt{
    display:flex; align-items:center; gap:12px; padding:13px 18px; cursor:pointer; transition:.15s;
    -webkit-tap-highlight-color:transparent;
  }
  .theme-opt + .theme-opt{border-top:1px solid var(--border);}
  .theme-opt:hover{background:var(--bg);}
  .theme-opt .theme-swatch{width:30px; height:30px; border-radius:10px; flex-shrink:0; box-shadow:var(--shadow-sm);}
  .theme-opt .theme-txt{flex:1; display:flex; flex-direction:column; min-width:0;}
  .theme-opt .theme-txt b{font-size:14px; font-weight:600; color:var(--text); line-height:1.5;}
  .theme-opt .theme-txt i{font-size:11px; color:var(--sub); font-style:normal; line-height:1.5;}
  .theme-opt .theme-check{font-size:14px; font-weight:800; color:var(--brand); width:16px; text-align:center;}
  .theme-opt.on{background:var(--brand-soft);}
  .theme-opt.on .theme-txt b{color:var(--brand);}
  .me-danger{color:#DC2626;}

  .btn-primary{
    width:100%; padding:14px; border-radius:13px; border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
    font-size:15px; font-weight:700; cursor:pointer; transition:.15s;
    box-shadow:var(--shadow-md);
  }
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-primary svg{width:16px; height:16px;}
  .recipe-actions{display:flex; gap:10px; margin-top:16px;}
  .recipe-actions .btn-primary{flex:1; display:flex; align-items:center; justify-content:center; gap:6px;}
  .btn-intake{background:linear-gradient(135deg,#0F6E56,#2AA37F) !important;}

  /* ===== 推荐食谱页 ===== */
  .quick-entry{
    border:1px solid var(--border); border-radius:16px; padding:16px 16px;
    background:var(--card); cursor:pointer; transition:.16s; box-shadow:var(--shadow-sm);
  }
  .quick-entry:hover{border-color:var(--brand); transform:translateY(-2px); box-shadow:var(--shadow-md);}
  .quick-entry .qe-ic{font-size:24px; margin-bottom:8px;}
  .quick-entry .qe-t{font-size:14px; font-weight:700; color:var(--text); margin-bottom:2px;}
  .quick-entry .qe-d{font-size:12px; color:var(--sub); line-height:1.5;}

  /* 身体数据记录页 */
  .bodylog-body{padding:16px 28px 40px;}
  .bl-form{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:18px 18px; margin-bottom:18px; box-shadow:var(--shadow-sm);
  }
  .bl-form-t{font-size:15px; font-weight:800; margin-bottom:14px;}
  .bl-row{margin-bottom:12px;}
  .bl-row label{display:block; font-size:12.5px; color:var(--sub); margin-bottom:6px; font-weight:600;}
  .bl-row label .opt{color:#B45309; font-weight:500; font-size:11px; margin-left:4px;}
  .bl-row input{
    width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--border);
    font-size:15px; background:var(--bg); color:var(--text); box-sizing:border-box;
  }
  .bl-row input:focus{outline:none; border-color:var(--brand);}
  .bl-trend{display:flex; gap:12px; margin-bottom:18px;}
  .bl-trend-item{
    flex:1; background:var(--brand-soft); border-radius:14px; padding:14px 16px;
  }
  .bl-trend-item .lbl{font-size:12px; color:var(--sub); margin-bottom:4px;}
  .bl-trend-item .val{font-size:20px; font-weight:800;}
  .bl-trend-item .val.down{color:#0F6E56;}
  .bl-trend-item .val.up{color:#DC2626;}
  .bl-trend-item .val.flat{color:var(--sub);}
  .bl-list{display:flex; flex-direction:column; gap:8px;}
  .bl-item{
    display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--border); border-radius:14px; padding:13px 15px;
  }
  .bl-date{font-size:12px; color:var(--sub); flex-shrink:0; min-width:82px;}
  .bl-vals{flex:1; display:flex; flex-direction:column; gap:2px; min-width:0;}
  .bl-w{font-size:15px; font-weight:700; color:var(--text);}
  .bl-bf{font-size:12px; color:var(--sub);}
  .bl-delta{font-size:11.5px; font-weight:700; margin-left:6px;}
  .bl-delta.down{color:#0F6E56;}
  .bl-delta.up{color:#DC2626;}
  .bl-del{
    flex-shrink:0; border:none; background:transparent; color:#9CA3AF; font-size:12px;
    cursor:pointer; padding:4px 8px;
  }
  .bl-del:hover{color:#DC2626;}
  .bl-empty{text-align:center; color:var(--sub); font-size:13px; padding:30px 0;}
  .recipe-body{padding:16px 28px 40px;}
  .recipe-target-card{
    border-radius:var(--radius); padding:18px 20px; margin-bottom:18px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
    box-shadow:var(--shadow-md);
  }
  .recipe-target-card .rt-label{font-size:11px; letter-spacing:1px; opacity:.85; margin-bottom:6px;}
  .recipe-target-card .rt-name{font-size:18px; font-weight:700; margin-bottom:10px;}
  .recipe-target-card .rt-macro{display:flex; gap:18px; flex-wrap:wrap;}
  .recipe-target-card .rt-macro .m{font-size:12px; opacity:.95;}
  .recipe-target-card .rt-macro .m b{font-size:16px; font-weight:800; display:block;}
  .recipe-combo-box{margin-bottom:16px; padding:14px 16px; border:1px solid var(--border); border-radius:14px; background:var(--card); box-shadow:var(--shadow-sm);}
  .rcb-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;}
  .rcb-title{font-size:14px; font-weight:700; color:var(--text);}
  .rcb-row{display:flex; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .rcb-row:last-child{margin-bottom:0;}
  .rcb-label{font-size:12px; color:var(--sub); flex-shrink:0; padding-top:6px; width:52px; text-align:right;}
  .rcb-chips{display:flex; flex-wrap:wrap; gap:6px; flex:1;}
  .pref-chip{
    font-size:12px; padding:5px 12px; border-radius:14px; cursor:pointer; user-select:none;
    border:1px solid var(--border); background:var(--card); color:var(--sub); transition:.15s;
  }
  .pref-chip.on{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; border-color:transparent; font-weight:600;}

  /* ── 偏好卡「更多设置」（忌口 / 训练日 / 自定义热量）默认收起，避免页面一开始就繁杂 ── */
  .rcb-more{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    color:var(--brand); cursor:pointer; flex-shrink:0; user-select:none;}
  .rcb-more #prefMoreCount:not(:empty){background:var(--brand-soft); padding:2px 8px; border-radius:20px;}
  .rcb-more b{font-size:11px; color:var(--sub); font-weight:600;}
  .pref-more{display:none; margin-top:10px; padding-top:12px; border-top:0.5px solid var(--border);}
  .pref-more.open{display:block;}
  .pref-more .rcb-row{margin-bottom:10px;}
  .pref-more .rcb-row:last-of-type{margin-bottom:0;}
  .rcb-kcal-row{align-items:center;}
  .pref-kcal{width:130px; padding:6px 10px; border-radius:11px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:12.5px; font-family:inherit;}
  .pref-kcal:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft);}
  .pref-more-note{font-size:11px; color:var(--sub); line-height:1.6; margin:10px 0 0; padding-left:62px;}
  /* 忌口项过多导致候选池被剔空、忌口被自动放宽时的告警（不能静默失效） */
  .pref-relax-warn{margin:8px 0 0; padding:8px 10px; border-radius:10px; font-size:11.5px; line-height:1.6;
    background:#FFF4E5; color:#8A4B00; border:0.5px solid #F0C48A;}
  /* 餐次标题行内的「换一换」紧凑按钮（与「早餐」同一行，右对齐） */
  .regen-inline{
    margin-left:auto; flex-shrink:0;
    display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border-radius:999px; cursor:pointer; line-height:1;
    border:1px solid var(--brand-mid); background:var(--brand-soft);
    font-size:12px; font-weight:600; color:var(--brand); transition:.15s;
    -webkit-tap-highlight-color:transparent;
  }
  .regen-inline:hover{border-color:var(--brand);}
  .regen-inline:active{transform:scale(.95);}
  .regen-inline svg{width:13px; height:13px;}
  .meal-tabs{display:flex; gap:8px; margin-bottom:14px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:5px; box-shadow:var(--shadow-sm);}
  .meal-tab{flex:1; text-align:center; padding:9px 0; border-radius:10px; font-size:14px; font-weight:600; color:var(--sub); cursor:pointer; user-select:none; transition:.15s;}
  .meal-tab.on{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; font-weight:700; box-shadow:var(--shadow-sm);}
  .rs-hint{font-size:11px; color:var(--sub); letter-spacing:.3px;}
  .meal-block{margin-bottom:16px;}
  .meal-block .meal-title{font-size:14px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .meal-block .meal-title .mt-dot{width:8px; height:8px; border-radius:50%;}
  /* 餐次「未完成 / ✓ 已完成」状态（生成→执行闭环）。放在餐次名之后、
     「换一换」之前 —— 换一换有 margin-left:auto 负责右对齐，不要再包一层容器 */
  .meal-done{
    display:inline-flex; align-items:center; flex-shrink:0;
    padding:3px 10px; border-radius:999px; cursor:pointer; line-height:1.5;
    border:1px solid var(--border); background:var(--card);
    font-size:11px; font-weight:600; color:var(--sub); transition:.15s;
    -webkit-tap-highlight-color:transparent;
  }
  .meal-done:hover{border-color:var(--brand-mid); color:var(--brand);}
  .meal-done.on{background:var(--brand); border-color:transparent; color:#fff;}
  .meal-done:active{transform:scale(.95);}
  /* 每餐营养汇总行 */
  .meal-sum{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;
    margin:0 0 8px; padding:9px 14px; border-radius:12px;
    background:var(--brand-soft); font-size:11px; color:var(--brand); font-weight:600;
  }
  .meal-sum b{font-size:14px; font-weight:800; margin-right:2px;}
  .meal-sum .ms-macros{color:var(--sub); font-weight:600;}
  /* 加餐为空时的说明（加餐不参与三餐分配，不显示 0 kcal 汇总行） */
  .meal-empty-hint{
    margin:0 0 8px; padding:11px 14px; border-radius:12px; font-size:11.5px; line-height:1.7;
    background:var(--bg); border:1px dashed var(--border); color:var(--sub);
  }
  /* 「今日执行」进度条（生成→执行闭环 + 剩余额度语言） */
  .exec-bar{
    margin-bottom:14px; padding:13px 15px; border-radius:16px;
    background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow-sm);
  }
  .exec-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:9px;}
  .exec-title{font-size:12.5px; font-weight:600; color:var(--sub);}
  .exec-title b{color:var(--text); font-weight:800;}
  .exec-remain{font-size:12px; font-weight:600; color:var(--sub);}
  .exec-remain b{font-size:17px; font-weight:800; color:var(--brand); margin:0 1px;}
  .exec-remain.over b{color:#C93E0F;}
  .exec-track{height:7px; border-radius:99px; background:var(--brand-soft); overflow:hidden;}
  .exec-track i{display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--brand),var(--brand-2)); transition:width .3s;}
  .exec-track i.over{background:#C93E0F;}
  .exec-chips{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .exec-chip{
    font-size:11px; font-weight:600; padding:3px 10px; border-radius:999px;
    background:var(--bg); color:var(--sub); border:1px solid var(--border);
  }
  .exec-chip.on{background:var(--brand); color:#fff; border-color:transparent;}
  .food-row{
    display:flex; align-items:center; gap:12px; padding:13px 16px; margin-bottom:8px;
    border:1px solid var(--border); border-radius:14px; background:var(--card);
    box-shadow:var(--shadow-sm); transition:.15s;
  }
  .food-row .fr-name{flex:1; font-size:14px; font-weight:600; color:var(--text);}
  .food-row .fr-meta{font-size:12px; color:var(--sub); margin-top:2px;}
  .food-row .fr-kcal{font-size:14px; font-weight:700; color:var(--brand); white-space:nowrap;}
  .food-row .fr-del{color:#c4c9d4; cursor:pointer; flex-shrink:0; width:24px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:7px; transition:.15s;}
  .food-row .fr-del:hover{color:#DC2626; background:#FEE2E2;}
  .food-row .fr-del svg{width:16px; height:16px;}
  .recipe-sum{
    display:flex; flex-wrap:wrap; gap:10px; padding:14px 16px; margin-top:16px;
    border-radius:14px; background:var(--brand-soft); text-align:center;
  }
  /* .rs-hint 是标题行，必须独占一行 —— 容器是 flex，不加 flex-basis 会被当成
     第 5 个格子挤在左侧窄列里（整句话竖着断行），四项数据也被压到右边 */
  .recipe-sum .rs-hint{flex:0 0 100%; text-align:left;}
  .recipe-sum .rs-item{flex:1;}
  .recipe-sum .rs-item .n{font-size:17px; font-weight:800; color:var(--brand-deep);}
  .recipe-sum .rs-item .u{font-size:11px; color:var(--sub); margin-top:2px;}
  .recipe-sum .rs-item .bar{height:5px; border-radius:3px; background:var(--brand-mid); margin-top:8px; overflow:hidden;}
  .recipe-sum .rs-item .bar i{display:block; height:100%; border-radius:3px; background:linear-gradient(90deg,var(--brand),var(--brand-2));}

  /* ===== 食物计算器页 ===== */
  .food-body{padding:16px 28px 40px;}
  /* 今日摄入详情页 */
  .intake-body{padding:16px 20px 40px; max-width:560px; margin:0 auto;}
  .intake-target{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color:var(--sub); padding:12px 14px; margin-bottom:12px;
    background:var(--brand-soft); border-radius:12px;
  }
  .intake-target b{color:var(--text); font-weight:700;}
  /* 超出目标时的额度提示（剩余额度语言的负向态） */
  .intake-target .it-over b{color:#C93E0F;}
  .intake-target .it-remain b{color:var(--brand); font-weight:800;}
  .intake-progress{
    height:7px; border-radius:99px; background:var(--brand-soft);
    overflow:hidden; margin:-6px 0 12px;
  }
  .intake-progress i{display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--brand),var(--brand-2)); transition:width .3s;}
  .intake-progress i.over{background:#C93E0F;}
  .intake-sum{
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center;
    padding:14px; border-radius:14px; background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
    margin-bottom:16px;
  }
  .intake-sum .is-item .n{font-size:20px; font-weight:800; line-height:1.2;}
  .intake-sum .is-item .u{font-size:11px; opacity:.85; margin-top:3px;}
  .intake-sum .is-kcal{border-left:0.5px solid rgba(255,255,255,.3);}
  .intake-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
    font-size:14px; color:var(--text);
  }
  .intake-head b{font-weight:700;}
  .intake-head a{color:var(--brand); font-weight:600; cursor:pointer;}
  .intake-empty{font-size:14px; color:var(--sub); text-align:center; padding:30px 0;}
  .intake-list{display:flex; flex-direction:column; gap:0;}
  .intake-row{
    display:flex; align-items:center; gap:12px; padding:14px 12px;
    border-bottom:0.5px solid var(--border); background:var(--card);
  }
  .intake-row .ir-info{flex:1; display:flex; flex-direction:column; gap:6px; min-width:0;}
  .intake-row .ir-name{font-size:15px; font-weight:600; color:var(--text); line-height:1.3;}
  .intake-row .ir-meta{font-size:12px; color:var(--sub);}
  .intake-row .ir-edit{display:flex; align-items:center; gap:6px;}
  .intake-row .ir-edit .fls-qty{
    width:72px; padding:7px 8px; font-size:14px; text-align:center;
    border:0.5px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text);
  }
  .intake-row .ir-edit .fls-unit{font-size:13px; color:var(--sub);}
  .intake-row .ir-kcal{font-size:16px; font-weight:700; color:var(--brand); white-space:nowrap;}
  .intake-row .ir-kcal span{font-size:11px; font-weight:400; color:var(--sub);}
  .intake-row .ir-del{
    color:#DC2626; cursor:pointer; font-size:13px; padding:7px 12px; border-radius:8px;
    background:#FEE2E2; flex-shrink:0; transition:.15s;
  }
  .intake-row .ir-del:hover{background:#FECACA;}

  .food-mode-tabs{
    display:flex; gap:6px; background:var(--bg); padding:4px; border-radius:14px; margin-bottom:14px;
    border:1px solid var(--border);
  }
  .food-mode-tabs .fseg{
    flex:1; padding:10px 0; border:none; border-radius:10px; cursor:pointer;
    background:transparent; font-size:14px; font-weight:600; color:var(--sub); transition:.15s;
  }
  .food-mode-tabs .fseg.on{
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; box-shadow:var(--shadow-sm);
  }
  .food-cat-more{
    border-style:dashed !important; color:var(--brand) !important; font-weight:600;
  }
  .food-summary-bar{
    position:sticky; bottom:0; z-index:5;
    background:var(--bg); padding-top:10px;
  }

  .food-search{
    display:flex; gap:10px; margin-bottom:14px;
  }
  .food-search input{
    flex:1; padding:12px 16px; border-radius:12px; border:1px solid var(--border);
    background:var(--card); font-size:14px; outline:none; color:var(--text); transition:.15s;
  }
  .food-search input:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft);}
  .food-cats{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .food-cat{
    font-size:12px; padding:6px 14px; border-radius:16px; cursor:pointer;
    border:1px solid var(--border); background:var(--card); color:var(--sub); transition:.15s;
  }
  .food-cat.on{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; border-color:transparent; font-weight:600;}
  .food-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; max-height:360px; overflow-y:auto;}
  .food-item{
    border:1px solid var(--border); border-radius:13px; padding:12px 14px;
    background:var(--card); cursor:pointer; transition:.15s; box-shadow:var(--shadow-sm);
  }
  .food-item:hover{border-color:var(--brand); transform:translateY(-1px);}
  .food-item .fi-name{font-size:13px; font-weight:600; color:var(--text);}
  .food-item .fi-kcal{font-size:12px; color:var(--sub); margin-top:3px;}
  .food-item .fi-kcal b{color:var(--brand);}
  .food-item.sel{border-color:var(--brand); background:var(--brand-soft);}
  .combo-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .combo-item{
    border:1px solid var(--border); border-radius:13px; padding:12px 14px;
    background:linear-gradient(135deg,var(--brand-soft),var(--card)); cursor:pointer; transition:.15s;
    box-shadow:var(--shadow-sm);
  }
  .combo-item:hover{border-color:var(--brand); transform:translateY(-1px);}
  .combo-item .ci-name{font-size:13px; font-weight:700; color:var(--text);}
  .combo-item .ci-sub{font-size:11.5px; color:var(--sub); margin-top:3px; line-height:1.5;}
  .combo-item .ci-kcal{font-size:12px; color:var(--brand); font-weight:700; margin-top:5px;}
  /* 食物份量选择弹层（bottom sheet） */
  #foodPickerBox{position:fixed; inset:0; z-index:110; pointer-events:none;}
  .fp-mask{
    position:absolute; inset:0; background:rgba(23,25,35,.45); backdrop-filter:blur(2px);
    pointer-events:auto; animation:fpFade .2s;
  }
  .fp-sheet{
    position:absolute; left:50%; transform:translateX(-50%); bottom:0;
    width:100%; max-width:680px; background:var(--card); border-radius:20px 20px 0 0;
    padding:6px 20px 22px; pointer-events:auto; box-shadow:0 -8px 30px rgba(0,0,0,.15);
    animation:fpUp .22s ease;
  }
  @keyframes fpUp{from{transform:translate(-50%,100%);} to{transform:translate(-50%,0);}}
  @keyframes fpFade{from{opacity:0;} to{opacity:1;}}
  .fp-sheet .sheet-grab{width:40px; height:4px; border-radius:2px; background:var(--border); margin:8px auto 14px;}
  .fp-sheet .fp-name{font-size:16px; font-weight:700; color:var(--brand-deep); margin-bottom:14px;}
  .fp-sheet .fp-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .fp-sheet .fp-row input{
    flex:1; padding:12px 14px; border-radius:11px; border:1px solid var(--border);
    background:var(--bg); font-size:16px; outline:none; color:var(--text);
  }
  .fp-sheet .fp-row input:focus{border-color:var(--brand);}
  .fp-sheet .fp-unit{font-size:14px; color:var(--sub); white-space:nowrap;}
  .fp-sheet .fp-btns{display:flex; gap:10px; margin-top:16px;}
  .fp-sheet .fp-btns button{
    flex:1; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:600; cursor:pointer; transition:.15s;
  }
  .fp-add{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;}
  .fp-cancel{background:var(--bg); color:var(--sub); border:1px solid var(--border)!important;}
  .fp-add:hover{transform:translateY(-1px);}
  /* 食谱页内联食物选择器（添加食物到某餐） */
  .food-picker{
    border:1px solid var(--brand); border-radius:14px; padding:16px;
    background:var(--brand-soft); margin-bottom:16px;
  }
  .food-picker .fp-name{font-size:15px; font-weight:700; color:var(--brand-deep); margin-bottom:12px;}
  .food-picker .fp-row{display:flex; align-items:center; gap:10px;}
  .food-picker .fp-row input{
    flex:1; padding:11px 14px; border-radius:11px; border:1px solid var(--border);
    background:var(--card); font-size:15px; outline:none; color:var(--text);
  }
  .food-picker .fp-unit{font-size:13px; color:var(--sub); white-space:nowrap;}
  .food-photo-btn{
    width:100%; padding:13px; border-radius:12px; border:1.5px dashed var(--brand-mid);
    background:var(--card); color:var(--brand); font-size:14px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px; transition:.15s; margin-bottom:14px;
  }
  .food-photo-btn:hover{border-color:var(--brand); background:var(--brand-soft);}
  .food-photo-btn svg{width:18px; height:18px;}
  .photo-previews{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .photo-previews .pp{
    position:relative; width:72px; height:72px; border-radius:12px; overflow:hidden;
    border:1px solid var(--border);
  }
  .photo-previews .pp img{width:100%; height:100%; object-fit:cover;}
  .photo-previews .pp .pp-x{
    position:absolute; right:3px; top:3px; width:20px; height:20px; border-radius:50%;
    background:rgba(0,0,0,.55); color:#fff; font-size:12px; line-height:20px; text-align:center; cursor:pointer;
  }
  .food-list-summary{
    border-radius:14px; background:var(--brand-soft); padding:14px 16px; margin-bottom:16px;
  }
  .food-list-summary .fls-t{font-size:13px; font-weight:700; color:var(--brand-deep); margin-bottom:8px;}
  .food-list-summary .fls-empty{font-size:13px; color:var(--sub);}
  .fls-qty-row{display:flex; align-items:center; gap:4px; margin-top:4px;}
  .fls-qty{width:64px; padding:4px 6px; font-size:13px; text-align:center; border:0.5px solid var(--border); border-radius:7px; background:var(--bg); color:var(--text);}
  .fls-unit{font-size:12px; color:var(--sub);}
  .food-total{
    display:flex; gap:10px; text-align:center; padding:16px;
    border-radius:16px; background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
    box-shadow:var(--shadow-md); margin-bottom:18px;
  }
  .food-total .ft-item{flex:1;}
  .food-total .ft-item .n{font-size:20px; font-weight:800;}
  .food-total .ft-item .u{font-size:11px; opacity:.85; margin-top:2px;}
  .food-total .ft-kcal{flex:1; display:flex; flex-direction:column; justify-content:center;}
  .food-total .ft-kcal .n{font-size:26px;}
  .add-custom{
    width:100%; padding:13px; border-radius:12px; border:none;
    background:var(--card); color:var(--brand); font-size:14px; font-weight:600; cursor:pointer;
    border:1.5px solid var(--border); transition:.15s;
  }
  .add-custom:hover{border-color:var(--brand); background:var(--brand-soft);}
  .custom-form{
    border:1px solid var(--brand); border-radius:14px; padding:16px; background:var(--brand-soft); margin-top:12px;
  }
  .custom-form .cf-t{font-size:14px; font-weight:700; color:var(--brand-deep); margin-bottom:12px;}
  .custom-form .cf-row{margin-bottom:10px;}
  .custom-form .cf-row label{font-size:12px; color:var(--sub); display:block; margin-bottom:4px;}
  .custom-form .cf-row input{
    width:100%; padding:11px 14px; border-radius:11px; border:1px solid var(--border);
    background:var(--card); font-size:14px; outline:none; color:var(--text);
  }
  .custom-form .cf-row input:focus{border-color:var(--brand);}
  .cf-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* ===== 切换方案底部面板 ===== */
  .sheet-mask{
    position:fixed; inset:0; background:rgba(23,25,35,.45);
    z-index:100; opacity:0; pointer-events:none; transition:opacity .2s;
    backdrop-filter:blur(2px);
  }
  .sheet-mask.show{opacity:1; pointer-events:auto;}
  .plan-sheet{
    position:fixed; left:50%; transform:translate(-50%,100%); bottom:0;
    width:100%; max-width:680px; z-index:101;
    background:var(--card); border-radius:20px 20px 0 0;
    padding:10px 0 0; transition:transform .25s ease;
    max-height:72vh; display:flex; flex-direction:column;
  }
  .plan-sheet.show{transform:translate(-50%,0);}
  .sheet-grab{width:40px; height:4px; border-radius:2px; background:var(--border); margin:6px auto 4px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:10px 22px 12px; border-bottom:0.5px solid var(--border);}
  .sheet-head .t{font-size:16px; font-weight:700;}
  .sheet-head .x{width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--sub); cursor:pointer; font-size:18px;}
  .sheet-list{overflow-y:auto; padding:10px 16px 20px;}
  .sheet-item{
    display:flex; align-items:flex-start; gap:12px; padding:14px 12px; border-radius:14px; cursor:pointer;
    border:1px solid transparent; transition:.12s;
  }
  .sheet-item:active{background:var(--brand-soft);}
  .sheet-item.cur{background:var(--brand-soft); border-color:var(--brand-mid);}
  .sheet-item .si-main{flex:1; min-width:0;}
  .sheet-item .si-name{font-size:15px; font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .sheet-item .si-desc{font-size:12.5px; color:var(--sub); margin-top:3px; line-height:1.5;}
  .sheet-item .si-macro{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px;}
  .sheet-item .si-macro .m-chip{
    display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--text);
    background:rgba(255,255,255,.65); border:1px solid var(--border); border-radius:7px; padding:3px 8px;
  }
  .sheet-item .si-macro .m-chip i{
    font-style:normal; font-size:10px; color:var(--brand); font-weight:700; margin-right:1px;
  }
  .sheet-item .si-meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:7px;}
  .sheet-item .si-meta .mt-chip{font-size:11.5px; color:var(--sub); line-height:1.5;}
  .sheet-item .si-check{
    width:22px; height:22px; border-radius:50%; flex-shrink:0; margin-top:2px;
    background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
  }

  /* 切换方案入口按钮（头部） */
  .switch-plan-btn{
    margin-left:auto; font-size:13px; font-weight:600; color:var(--brand);
    background:var(--brand-soft); padding:7px 13px; border-radius:9px; cursor:pointer;
    border:none; white-space:nowrap;
  }
  .switch-plan-btn:active{opacity:.7;}

  /* 切换方案确认弹层 */
  .switch-confirm{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(.9);
    width:calc(100% - 48px); max-width:400px; z-index:102;
    background:var(--card); border-radius:20px; padding:20px;
    opacity:0; pointer-events:none; transition:.18s ease;
    box-shadow:var(--shadow-lg, 0 20px 60px rgba(0,0,0,.2));
  }
  .switch-confirm.show{opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1);}
  .sc-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sc-title{font-size:17px; font-weight:800;}
  .sc-head .x{width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--sub); cursor:pointer; font-size:16px;}
  .sc-body{font-size:13.5px; line-height:1.65; color:var(--text);}
  .sc-tip{margin-bottom:12px;}
  .sc-block{background:var(--brand-soft); border-radius:12px; padding:12px 14px; margin-bottom:12px;}
  .sc-block-t{font-size:12px; color:var(--sub); font-weight:600; margin-bottom:8px;}
  .sc-diff{display:flex; align-items:center; gap:8px; font-size:13px; margin-top:6px; flex-wrap:wrap;}
  .sc-diff span{color:var(--sub); width:60px; flex-shrink:0;}
  .sc-diff b{color:var(--brand); font-weight:700;}
  .sc-goal-hint{font-size:12.5px; color:var(--brand-deep); line-height:1.6;}
  .sc-warn{
    font-size:12.5px; color:#A16207; background:#FFF7E6; border-radius:12px;
    padding:12px 14px; line-height:1.6;
  }
  .sc-actions{display:flex; gap:10px; margin-top:18px;}
  .sc-actions button{flex:1; padding:13px; border-radius:12px; border:none; font-size:14px; font-weight:700; cursor:pointer;}
  .sc-cancel{background:var(--bg); color:var(--sub); border:1px solid var(--border) !important;}
  .sc-ok{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; box-shadow:var(--shadow-md);}

  /* ===== 底部固定 TabBar ===== */
  .tabbar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0;
    width:100%; max-width:680px; z-index:60;
    display:flex; align-items:stretch;
    background:var(--card); border-top:0.5px solid var(--border);
    box-shadow:0 -4px 16px rgba(23,25,35,.07);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .tabbar .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:7px 0 6px; background:none; border:none; cursor:pointer;
    color:var(--sub); font-size:11px; font-weight:500; transition:color .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .tabbar .tab svg{width:22px; height:22px;}
  .tabbar .tab.on{color:var(--brand); font-weight:600;}

  /* ===== 首页三层结构 ===== */
  .home-main{justify-content:flex-start;}
  .intake-ring-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 20px 16px; margin-bottom:16px; box-shadow:var(--shadow-sm);
    display:flex; flex-direction:column; align-items:center;
  }
  .intake-ring-card .ring-title{font-size:13px; color:var(--sub); font-weight:600; margin-bottom:12px;}
  .intake-ring-card .ring-wrap{position:relative; width:150px; height:150px; margin-bottom:4px; cursor:pointer;}
  .intake-ring-card .ring-wrap svg{width:150px; height:150px; transform:rotate(-90deg);}
  .intake-ring-card .ring-track{fill:none; stroke:var(--brand-soft); stroke-width:11;}
  .intake-ring-card .ring-fill{fill:none; stroke:url(#ringGrad); stroke-width:11; stroke-linecap:round; transition:stroke-dashoffset .5s ease;}
  .intake-ring-card .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .intake-ring-card .ring-center .rc-kcal{font-size:30px; font-weight:800; line-height:1; color:var(--text);}
  .intake-ring-card .ring-center .rc-unit{font-size:11px; color:var(--sub); margin-top:5px;}
  /* 超出目标：主角数字与单位一起转为告警色，避免「还能吃 -120」这种负号读法 */

/* ===== 页面切换 ===== */
let curScreen = "home";
function go(name){
  curScreen = name;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-"+name).classList.add("active");
  window.scrollTo(0,0);
  // 离开列表页时退出对比模式
  if(name!=="list" && compareMode){
    compareMode = false;
    compareSel = [];
  }
  if(name==="list") renderFilters();
  if(name==="home") renderCurrentPlan();
  renderTab();
}

/* ===== 底部固定 TabBar ===== */
const TAB_MAP = { home:"home", food:"record", recipe:"recipe", me:"me" };

function renderTab(){
  const cur = TAB_MAP[curScreen];
  document.querySelectorAll(".tabbar .tab").forEach(t=>{
    t.classList.toggle("on", t.getAttribute("data-tab") === cur);
  });
}

function goTab(name){
  if(name === "home"){ go("home"); return; }
  if(name === "record"){ openFoodCalc(); return; }
  if(name === "recipe"){ goRecipe(); return; }
  if(name === "me"){ showMe(); return; }
}

/* 进入食谱页：已有当日食谱则直接切换保留；否则走 openRecipe 完整守卫并生成 */
function goRecipe(){
  if(!recipeMeals || !recipeMeals.meals || recipePlanId !== getCurrentPlanId()){
    openRecipe();
  } else {
    go("recipe");
  }
}

/* ===== 当前选择方案 ===== */
const CURRENT_PLAN_KEY = "lizi_current_plan";
function getCurrentPlanId(){
  try{ return localStorage.getItem(CURRENT_PLAN_KEY) || ""; }catch(e){ return ""; }
}
function setCurrentPlan(id){
  try{ localStorage.setItem(CURRENT_PLAN_KEY, id); }catch(e){}
}

// 计算「今天」已记录食物的摄入总和
function dailyIntakeSummary(){
  const items = loadTodayItems();
  let kcal=0, p=0, c=0, f=0;
  items.forEach(it=>{
    const fd = findFood(it.name);
    if(!fd) return;
    const qty = (it.servings !== undefined) ? it.servings : it.grams;
    const v = foodKcal(fd, qty);
    if(it.kcalAdj) v.kcal += it.kcalAdj;
    kcal+=v.kcal; p+=v.protein; c+=v.carb; f+=v.fat;
  });
  return {kcal, protein:p, carb:c, fat:f, count:items.length};
}

// 生成「今日推荐食谱」紧凑预览（取模板第一套，按体重缩放）
function recipePreview(planId){
  const profile = loadProfile();
  const target = computeTarget(planId, profile);
  const goal = planGoal(planId);
  const tpls = MEAL_TEMPLATES.filter(t=>t.goal===goal);
  const tpl = tpls[0];
  if(!tpl) return {target, goal, meals:null};
  const scaled = scaleTemplate(tpl, profile.weight);
  const totals = ["早餐","午餐","晚餐"].reduce((acc,m)=>{
    const t = mealTotal(scaled.meals[m]);
    acc.kcal+=t.kcal; acc.protein+=t.protein; acc.carb+=t.carb; acc.fat+=t.fat;
    return acc;
  }, {kcal:0,protein:0,carb:0,fat:0});
  return {target, goal, totals, meals:scaled.meals, tplName:tpl.name};
}

function renderCurrentPlan(){
  const profile = loadProfile();
  const hasProfile = profile.gender && profile.age && profile.height && profile.weight;
  const id = getCurrentPlanId();
  // 无完整信息时若残留当前方案，一并清理，保证「清空 = 全部重来」（沿用旧逻辑）
  if(!hasProfile && id){
    setCurrentPlan("");
  }
  renderIntakeRing();
}

  const el = document.getElementById("homeRecoEntry");

  if(id){
    const plan = PLANS.find(x=>x.id===id);
    el.innerHTML = `当前方案：<b>${plan ? plan.name : "已选择"}</b> · <a onclick="go('list')">换个方案 →</a>`;
  } else {
    el.innerHTML = `还没想好选哪个方案？<a onclick="goRecommend()">帮我推荐 →</a>`;
  }
}

  if(!box) return;

  const id = getCurrentPlanId();
  const plan = PLANS.find(x=>x.id===id);

  // 空态：未选方案 / 信息不完整，无法计算目标

    const tip = !plan
      ? `<div class="ring-empty">还没有选择饮食方案<br><a onclick="go('list')">去选方案</a> · <a onclick="goRecommend()">帮我推荐</a></div>`
      : `<div class="ring-empty">先完善个人信息，才能计算每日目标<br><a onclick="go('me')">去「我的」填写</a></div>`;
    box.innerHTML = `<div class="ring-title">今日摄入</div>${tip}`;
    return;
  }

  const target = computeTarget(id, profile);
  const intake = dailyIntakeSummary();
  const kcal = Math.round(intake.kcal);
  const tKcal = Math.round(target.kcal) || 0;
  const pct = tKcal > 0 ? Math.min(100, Math.round(kcal / tKcal * 100)) : 0;
  // 剩余额度口径：进度环的主角数字是「还能吃」而不是「已吃」——
  // 用户真正关心的是「我还能吃多少」，已吃是过程量
  const r = remainingOf(tKcal, kcal);

  const R = 52;
  const C = 2 * Math.PI * R;
  const offset = C * (1 - pct / 100);

  const items = loadTodayItems();
  const detailHtml = homeIntakeOpen ? `
    <div class="ring-detail">
      ${items.length===0 ? `<div class="ring-detail-empty">今天还没有记录，去「记录食物」添加</div>` : items.map((it,i)=>{
        const fd = findFood(it.name);
        if(!fd) return "";
        const qty = (it.servings !== undefined) ? it.servings : it.grams;
        const isSrv = isServingFood(fd);
        const v = foodKcal(fd, qty);
        if(it.kcalAdj) v.kcal += it.kcalAdj;
        const qtyInput = (()=>{
          const pt = (!isSrv && typeof PORTIONS!=="undefined") ? (PORTIONS[it.name] || null) : null;
          if(isSrv){
            return `<input class="fls-qty" type="number" value="${qty}" min="0.5" step="0.5" onchange="updateHomeIntakeQty(${i}, this.value)" /><span class="fls-unit">${fd.unit||"份"}</span>`;
          }
          if(pt && pt.unit !== "克"){
            return `<input class="fls-qty" type="number" value="${Math.round(qty/pt.g*10)/10}" min="0.5" step="0.5" onchange="updateHomeIntakePortion(${i}, this.value)" /><span class="fls-unit">${pt.unit}</span>`;
          }
          return `<input class="fls-qty" type="number" value="${Math.round(qty)}" min="1" step="5" onchange="updateHomeIntakeQty(${i}, this.value)" /><span class="fls-unit">克</span>`;
        })();
        return `
        <div class="ring-detail-row">

  const cssVar = n => (getComputedStyle(document.documentElement).getPropertyValue(n) || "").trim();

            <stop offset="100%" stop-color="${gradTo}"/>

        </defs>
        <circle class="ring-track" cx="60" cy="60" r="${R}"/>
        <circle class="ring-fill" cx="60" cy="60" r="${R}"
          stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"/>
      </svg>
      <div class="ring-center">
        <div class="rc-kcal ${r.over?"over":""}">${r.abs}</div>
        <div class="rc-unit ${r.over?"over":""}">${r.over?"已超 kcal":"还能吃 kcal"}</div>
        <div class="rc-hint">已吃 ${kcal} / ${tKcal} ›</div>
      </div>
    </div>
    <div class="ring-macros">
      <span>碳 <b>${Math.round(intake.carb)}</b>g</span>
      <span>蛋 <b>${Math.round(intake.protein)}</b>g</span>
      <span>脂 <b>${Math.round(intake.fat)}</b>g</span>
      <span>已吃 <b>${pct}</b>%</span>
    </div>
    <div class="ring-toggle" onclick="toggleHomeIntake()">
      今日已吃 <b>${items.length}</b> 项
      <span class="rt-arrow">${homeIntakeOpen ? "收起 ▲" : "管理 ▼"}</span>
    </div>
    ${detailHtml}`;
}

function openIntake(){
  renderIntakeDetail();
  go("intake");
}
function renderIntakeDetail(){
  const box = document.getElementById("intakeBody");
  if(!box) return;

  const id = getCurrentPlanId();
  const plan = PLANS.find(x=>x.id===id);
  const profile = loadProfile();
  const hasProfile = profile.gender && profile.age && profile.height && profile.weight;
  const target = (plan && hasProfile) ? computeTarget(id, profile) : null;

  const items = loadTodayItems();
  let kcal=0, p=0, c=0, f=0;
  const rows = items.map((it,i)=>{
    const fd = findFood(it.name);
    if(!fd) return "";
    const qty = (it.servings !== undefined) ? it.servings : it.grams;
    const isSrv = isServingFood(fd);
    const v = foodKcal(fd, qty);
    if(it.kcalAdj) v.kcal += it.kcalAdj;
    kcal+=v.kcal; p+=v.protein; c+=v.carb; f+=v.fat;
    const qtyInput = (()=>{
      const pt = (!isSrv && typeof PORTIONS!=="undefined") ? (PORTIONS[it.name] || null) : null;
      const usePortion = pt && pt.unit !== "克";
      if(isSrv){
        return `<input class="fls-qty" type="number" value="${qty}" min="0.5" step="0.5" onchange="updateIntakeDetailQty(${i}, this.value)" /><span class="fls-unit">${fd.unit||"份"}</span>`;
      }
      if(usePortion){
        return `<input class="fls-qty" type="number" value="${Math.round(qty/pt.g*10)/10}" min="0.5" step="0.5" onchange="updateIntakeDetailPortion(${i}, this.value)" /><span class="fls-unit">${pt.unit}</span>`;
      }
      return `<input class="fls-qty" type="number" value="${Math.round(qty)}" min="1" step="5" onchange="updateIntakeDetailQty(${i}, this.value)" /><span class="fls-unit">克</span>`;
    })();
    const ptInfo = (!isSrv && typeof PORTIONS!=="undefined") ? (PORTIONS[it.name] || null) : null;
    const meta = isSrv
      ? `${it.note ? it.note+" · " : ""}${it.kcalAdj ? (it.kcalAdj>0?"+":"")+it.kcalAdj+" kcal" : ""}`
      : (ptInfo && ptInfo.unit !== "克") ? `约 ${Math.round(qty)}g` : humanizeGrams(it.name, qty);
    return `
      <div class="intake-row">
        <div class="ir-info">
          <div class="ir-name">${it.name}</div>
          <div class="ir-meta">${meta}</div>
          <div class="ir-edit">${qtyInput}</div>
        </div>
        <div class="ir-kcal">${Math.round(v.kcal)}<span> kcal</span></div>
        <div class="ir-del" onclick="removeIntakeDetail(${i})">删除</div>
      </div>`;
  }).join("");

  const summary = `
    <div class="intake-sum">
      <div class="is-item"><div class="n">${Math.round(c)}</div><div class="u">碳水 g</div></div>
      <div class="is-item"><div class="n">${Math.round(p)}</div><div class="u">蛋白 g</div></div>
      <div class="is-item"><div class="n">${Math.round(f)}</div><div class="u">脂肪 g</div></div>
      <div class="is-item is-kcal"><div class="n">${Math.round(kcal)}</div><div class="u">总热量 kcal</div></div>
    </div>`;

  // 剩余额度语言：默认说「还能吃」，超出时才说「已超」——
  // 「已摄入 1033 kcal（56%）」只描述过程，用户要的是「我还能吃多少」
  const rem = target ? remainingOf(target.kcal, kcal) : null;
  const targetBar = target ? `
    <div class="intake-target">
      <span>今日目标 <b>${Math.round(target.kcal)} kcal</b></span>
      ${rem.over
        ? `<span class="it-over">已超 <b>${rem.abs} kcal</b></span>`
        : `<span class="it-remain">还能吃 <b>${rem.abs} kcal</b></span>`}
    </div>
    <div class="intake-progress"><i class="${rem.over?"over":""}" style="width:${target.kcal>0?Math.min(100, Math.round(kcal/target.kcal*100)):0}%;"></i></div>` : "";

  box.innerHTML = `
    ${targetBar}
    ${summary}
    <div class="intake-head">
      <span>今天吃了 <b>${items.length}</b> 项</span>
      <a onclick="openFoodCalc()">＋ 添加食物</a>
    </div>
    ${items.length===0
      ? `<div class="intake-empty">今天还没有记录，点右上角「＋ 添加食物」开始</div>`
      : `<div class="intake-list">${rows}</div>`}`;
}

/* ===== 方案对比选择状态 ===== */
let compareSel = [];        // 当前勾选对比的方案 id（最多 3 个）
let compareMode = false;    // 列表页是否处于「对比模式」
const COMPARE_MAX = 3;

function toggleCompare(id, e){
  if(e) e.stopPropagation();
  const idx = compareSel.indexOf(id);
  if(idx>=0){
    compareSel.splice(idx,1);
  } else {
    if(compareSel.length>=COMPARE_MAX){
      alert(`最多对比 ${COMPARE_MAX} 个方案`);
      return;
    }
    compareSel.push(id);
  }
  renderPlans();
  renderCompareBar();
}

function renderCompareBar(){
  const bar = document.getElementById("compareBar");
  const cnt = document.getElementById("compareCnt");
  const btn = document.getElementById("compareBtn");
  if(!bar) return;
  if(!compareMode){ bar.style.display = "none"; return; }
  cnt.textContent = compareSel.length;
  bar.style.display = "flex";
  btn.disabled = compareSel.length<2;
}

/* ===== 渲染方案卡片 ===== */
function renderPlans(){
  const box = document.getElementById("planList");
  const list = PLANS.filter(p=>{
    if(curFilter==="全部") return true;
    const goals = p.goals || [p.goal];
    return goals.includes(curFilter);
  });
  const curId = getCurrentPlanId();
  if(list.length===0){
    box.innerHTML = `<div style="text-align:center;color:#9aa0a6;font-size:13px;padding:40px 0;">暂无「${curFilter}」方案，敬请期待</div>`;
    return;
  }
  box.innerHTML = list.map(p=>{
    const g = GOAL_STYLE[p.goal] || GOAL_STYLE["减脂"];
    const badges = (p.goals || [p.goal]).map(gk=>{
      const gs = GOAL_STYLE[gk] || GOAL_STYLE["减脂"];
      return `<span class="badge" style="color:${gs.color};background:${gs.bg};margin-left:4px;">${gk}</span>`;
    }).join("");
    const isSel = compareSel.includes(p.id);
    const isCurrent = p.id === curId;
    // 对比模式：卡片右上角勾选框，点击卡片整体切换勾选
    const chk = compareMode
      ? `<div class="chk ${isSel?'on':''}" onclick="toggleCompare('${p.id}',event)"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`
      : "";
    // 选方案按钮：对比模式下隐藏；已是当前方案则不显示按钮
    const pickBtn = compareMode ? "" : (isCurrent
      ? `<div class="plan-current-tag">✓ 已选择</div>`
      : `<button class="plan-pick-btn" onclick="event.stopPropagation();pickPlan('${p.id}')">选这个方案</button>`);
    return `
    <div class="plan-card ${isSel?'sel':''}" onclick="${compareMode ? `toggleCompare('${p.id}')` : `openPlan('${p.id}')`}">
      ${chk}
      <div class="top">
        <div class="name">${p.name}</div>
        <span style="display:flex;flex-shrink:0;${compareMode?'padding-right:28px;':''}">${badges}</span>
      </div>
      <div class="source" style="margin-bottom:6px;">参考来源：${p.source}</div>
      <div class="desc">${p.desc}</div>
      <div class="tags" style="margin-top:8px;">${p.chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div>
      ${pickBtn}
    </div>`;
  }).join("");
}

/* ===== 方案对比页 ===== */
function openCompare(){
  const plans = compareSel.map(id=>PLANS.find(x=>x.id===id)).filter(Boolean);

    alert("请至少勾选 2 个方案进行对比");

}

function renderCompare(plans){

  const rows = [
    {k:"目标",       get:p=>p.detail.target},
    {k:"碳水",       get:p=>p.compare.carb},
    {k:"蛋白质",     get:p=>p.compare.protein},
    {k:"脂肪",       get:p=>p.compare.fat},
    {k:"训练要求",   get:p=>p.compare.training},
    {k:"执行节奏",   get:p=>p.compare.duration},
    {k:"适合人群",   get:p=>p.detail.who},
  ];

  const thead = `<tr><th></th>${plans.map(p=>`
    <th>
      <div class="pname">${p.name}</div>
      <div class="psrc">参考来源：${p.source}</div>
      <div class="compare-goal-badges" style="margin-top:6px;">${(p.goals||[p.goal]).map(gk=>{
        const gs=GOAL_STYLE[gk]||GOAL_STYLE["减脂"];
        return `<span class="badge" style="color:${gs.color};background:${gs.bg};">${gk}</span>`;
      }).join("")}</div>
    </th>`).join("")}</tr>`;

  const tbody = rows.map(r=>`

    <table class="compare-table">
      <thead>${thead}</thead>
      <tbody>${tbody}</tbody>

  // 底部：选中某方案开始计算（默认第一个高亮）
  document.getElementById("compareCta").innerHTML = plans.map((p,i)=>`
    <button onclick="compareStart('${p.id}')">${i===0?'✓ ':''}选「${p.name}」</button>
  `).join("");
}

}

/* 适合人群判断：方案训练要求 vs 用户活动水平 */
function buildFitHint(p){
  const profile = loadProfile();
  const act = profile.actLevel;
  const train = (p.compare && p.compare.training) || "";

  // 训练要求 → 建议最低活动水平
  const trainMap = {
    "无门槛": "sed",
    "低": "light",
    "低–中": "light",
    "需配合训练": "mod",
    "高": "high"
  };
  const needLevel = trainMap[train];

  if(!act){
    return `<div class="fit-hint none"><span class="fh-ic">💡</span><div>还没填写你的活动水平。<a onclick="go('me')" style="color:var(--brand);font-weight:600;">去「我的」完善个人信息</a>，我会帮你判断这个方案适不适合你。</div></div>`;
  }

  const lv = {sed:0, light:1, mod:2, high:3};
  const cur = lv[act] ?? 0;
  const need = lv[needLevel] ?? 0;

  if(cur >= need){
    return `<div class="fit-hint ok"><span class="fh-ic">✓</span><div><b>适合你。</b>你的活动水平「${ACT_DESC[act]}」达到这个方案的训练要求（${train}）。</div></div>`;
  } else {
    return `<div class="fit-hint warn"><span class="fh-ic">⚠️</span><div><b>训练要求可能偏高。</b>这个方案需要「${train}」训练量，你目前是「${ACT_DESC[act]}」。若训练跟不上，效果会打折。</div></div>`;
  }
}

  ]},

];

// 减脂专属扩展字段（目标体重 / 预计时长，仅在减脂目标下出现）
const GOAL_EXTRA_FIELDS = [
  {key:"targetWeight", label:"目标体重", type:"num", unit:"kg"},
  {key:"targetWeeks",   label:"预计减脂时长", type:"num", unit:"周", hint:"（WHO 建议健康减重速度为每周 0.5–1kg）"}
];

// 权威减脂速度标准（来源：世界卫生组织 WHO 建议）
const WEIGHT_LOSS = {
  minKgPerWeek: 0.5,   // 最低健康速度（kg/周）
  maxKgPerWeek: 1.0,   // 最高健康速度（kg/周）
  minKgPerWeekSoft: 0.3  // 过低阈值（低于此值提示目标偏保守）
};

// 校验「当前体重 → 目标体重」与「预计时长」是否现实
// 返回 {ok, speed, weeksMin, weeksMax, msg, level}
function validateWeightLoss(curWeight, targetWeight, weeks){
  const diff = curWeight - targetWeight;
  if(diff <= 0){
    return {ok:false, level:"invalid", speed:0, weeksMin:0, weeksMax:0,
      msg:"目标体重应低于当前体重（减脂目标下）。若想维持或增重，请切换目标。"};
  }
  if(weeks && weeks > 0){
    const speed = diff / weeks;  // kg/周
    const weeksMin = Math.ceil(diff / WEIGHT_LOSS.maxKgPerWeek);
    const weeksMax = Math.round(diff / WEIGHT_LOSS.minKgPerWeek);
    if(speed > WEIGHT_LOSS.maxKgPerWeek){
      return {ok:false, level:"warn-fast", speed, weeksMin, weeksMax,
        msg:`按这个时长，你需要每周减 ${speed.toFixed(2)}kg，超过 WHO 建议的安全上限（0.5–1kg/周）。建议延长到 ${weeksMin} 周以上，或把目标体重调高一些。`};
    }
    if(speed < WEIGHT_LOSS.minKgPerWeekSoft){
      return {ok:true, level:"warn-slow", speed, weeksMin, weeksMax,
        msg:`这个时长偏宽松，每周只需减 ${speed.toFixed(2)}kg，可能动力不足。合理时长约 ${weeksMin}–${weeksMax} 周。`};
    }
    return {ok:true, level:"ok", speed, weeksMin, weeksMax,
      msg:`合理。预计每周减约 ${speed.toFixed(2)}kg，处于 WHO 建议的 0.5–1kg/周安全区间内。`};
  }
  // 未填时长，仅给出建议区间
  const weeksMin = Math.ceil(diff / WEIGHT_LOSS.maxKgPerWeek);
  const weeksMax = Math.round(diff / WEIGHT_LOSS.minKgPerWeek);
  return {ok:true, level:"hint", speed:0, weeksMin, weeksMax,
    msg:`共需减 ${diff.toFixed(1)}kg。按 WHO 建议（0.5–1kg/周），合理时长约 ${weeksMin}–${weeksMax} 周。`};
}

// 活动水平 → 各方案碳水系数映射（三个月/碳水渐降/三倍碳水）
const ACT_CARB = {
  "month3":       { sed:2.2, light:2.5, mod:2.8, high:3.0 },
  "carb-descend": { sed:2.5, light:2.6, mod:2.8, high:3.0 },
  "triple-carb":  { sed:2.5, light:2.7, mod:2.8, high:3.0 },  // 三倍碳水：新手2.5→练高3.0
  "zengji-yingyu": { sed:4.0, light:4.5, mod:5.0, high:6.0 }  // 增肌盈余：碳水 4–6g/kg，供能比 60–65%
};
// 活动水平 → 活动系数（算 TDEE，532/膳食指南用）
const ACT_FACTOR = { sed:1.2, light:1.375, mod:1.55, high:1.725 };
const ACT_DESC = { sed:"久坐·几乎不练", light:"轻度·每周1–2练", mod:"中度·每周3–4练", high:"高强度·每周5练以上" };

// 依据体脂率（选填）确定增肌热量盈余
// 返回 {surplus, note}：体脂偏高→300；偏瘦→500；未填/正常→400
function surplusForBodyFat(profile){
  const bf = profile.bodyFat;
  const g = profile.gender;
  if(bf === undefined || bf === null || bf === "" || isNaN(parseFloat(bf))){
    return {surplus:400, note:"（未填体脂率，盈余取中间值 400）"};
  }
  const v = parseFloat(bf);
  // 参考区间：男 10–20%、女 18–28% 为正常
  const low = g === "female" ? 18 : 10;
  const high = g === "female" ? 28 : 20;
  if(v > high){
    return {surplus:300, note:`（体脂率 ${v}% 偏高，盈余下调到 300，避免增肌期脂肪堆积过多）`};
  }
  if(v < low){
    return {surplus:500, note:`（体脂率 ${v}% 偏低，盈余上调到 500，偏瘦体质可放心多吃）`};
  }
  return {surplus:400, note:`（体脂率 ${v}% 处于正常区间，盈余取中间值 400）`};
}

function confirmSwitchPlan(id){
  const p = PLANS.find(x=>x.id===id);
  if(!p || id === getCurrentPlanId()){
    closePlanSheet();
    return;
  }
  const cur = PLANS.find(x=>x.id===getCurrentPlanId());
  const newDur = (p.compare && p.compare.duration) || "未标注";
  const curDur = (cur && cur.compare && cur.compare.duration) || "未标注";
  const newTrain = (p.compare && p.compare.training) || "未标注";
  const curTrain = (cur && cur.compare && cur.compare.training) || "未标注";

  // 节奏差异：新旧方案的周期/训练门槛不同时，给出醒目提示
  let diffHtml = "";
  let goalHintHtml = "";
  if(cur && cur.id !== id){
    const diffs = [];
    if(curDur !== newDur) diffs.push(`<div class="sc-diff"><span>节奏</span><b>${curDur}</b> → <b>${newDur}</b></div>`);
    if(curTrain !== newTrain) diffs.push(`<div class="sc-diff"><span>训练门槛</span><b>${curTrain}</b> → <b>${newTrain}</b></div>`);
    if(diffs.length){
      diffHtml = `
        <div class="sc-block">
          <div class="sc-block-t">计划差异</div>
          ${diffs.join("")}
        </div>`;
    }

    // 目标一致性提示：同目标减脂方案之间切换 → 提示「碳水能衔接，但需改复盘方式」；
    // 不同目标（如减脂↔增肌）→ 更醒目的警告
    const curGoal = cur.goal, newGoal = p.goal;
    if(curGoal === newGoal && newGoal === "减脂"){
      goalHintHtml = `
        <div class="sc-block">
          <div class="sc-block-t">切换说明</div>
          <div class="sc-goal-hint">这两个都是减脂方案、同为「吃 10 天→复盘→微调」节奏，碳水克数能衔接，但切换后需改用新方案的复盘方式（如主动降碳 / 穿插高碳日）。</div>
        </div>`;
    } else if(curGoal !== newGoal){
      goalHintHtml = `
        <div class="sc-block" style="background:#FFF7E6;">
          <div class="sc-block-t" style="color:#A16207;">⚠️ 目标改变</div>
          <div class="sc-goal-hint" style="color:#A16207;">从「${curGoal}」切到「${newGoal}」，营养策略方向完全相反，请确认这是你当前真正想要的目标。</div>
        </div>`;
    }
  }

  pendingSwitchId = id;
  document.getElementById("switchConfirmBody").innerHTML = `
    <div class="sc-tip">切换后，会按「${p.name}」重新规划饮食与训练节奏。</div>
    ${goalHintHtml}
    ${diffHtml}
    <div class="sc-warn">⚠️ 不同方案的周期和饮食结构差异较大，切换后旧方案的执行进度不会保留，相当于重新开始一个周期。</div>
  `;
  document.getElementById("switchConfirmMask").classList.add("show");
  document.getElementById("switchConfirm").classList.add("show");
}

  PROFILE_FIELDS.forEach(f=>{

function renderProfileForm(profile){
  const base = PROFILE_FIELDS.map(f=>{
    if(f.type==="seg"){
      return `
        <div class="form-group">
          <label><b>${f.label}</b></label>
          <div class="seg">

          </div>
        </div>`;
    }
    // 优先用草稿值（未提交输入），其次用已保存值

    // 体重字段需联动减脂时长建议；其他 num 字段不需 oninput

      <div id="weightHint" style="margin-top:8px;"></div>`;

  return base + extra;
}

  const box = document.getElementById("weightHint");
