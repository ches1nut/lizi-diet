<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🌰饮食</title>
<style>
  :root{
    --brand:#26215C;
    --brand-deep:#1B1747;
    --brand-2:#4A3FA8;
    --brand-soft:#EEEDFE;
    --brand-mid:#CECBF6;
    --accent:#F59E0B;
    --bg:#F6F7FB;
    --card:#ffffff;
    --text:#1f2329;
    --sub:#6b7280;
    --border:#E6E8F0;
    --shadow-sm:0 1px 2px rgba(23,25,35,.04), 0 2px 8px rgba(23,25,35,.05);
    --shadow-md:0 4px 12px rgba(23,25,35,.06), 0 12px 32px rgba(38,33,92,.12);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  .page{
    max-width:680px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column;
  }

  /* ===== 顶部导航（首页用） ===== */
  .navbar{
    padding:22px 28px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{
    width:38px; height:38px; border-radius:12px;
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
    display:flex; align-items:center; justify-content:center; font-size:19px;
    box-shadow:0 4px 12px rgba(38,33,92,.28);
  }
  .brand .name{font-size:17px; font-weight:700; letter-spacing:.2px;}
  .me-btn{
    width:38px; height:38px; border-radius:50%;
    border:1px solid var(--border); background:var(--card);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:.15s; box-shadow:var(--shadow-sm);
  }
  .me-btn:hover{border-color:var(--brand); transform:translateY(-1px);}
  .me-btn svg{width:19px; height:19px;}

  /* ===== 页面切换 ===== */
  .screen{display:none;}
  .screen.active{display:block; animation:fade .18s;}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1}}

  /* ===== 首页 ===== */
  .main{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:36px 28px 48px;
  }
  .hero{text-align:center; margin-bottom:30px;}
  .hero h1{font-size:26px; font-weight:700; line-height:1.3; color:var(--text);}
  .hero p{font-size:13px; color:var(--sub); margin-top:8px;}

  /* 当前选择方案卡片 */
  .current-card{
    border-radius:var(--radius); padding:18px 20px; margin-bottom:20px;
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
    color:#fff; cursor:pointer; position:relative; overflow:hidden;
    box-shadow:var(--shadow-md); transition:.18s;
  }
  .current-card:hover{transform:translateY(-2px);}
  .current-card::after{
    content:""; position:absolute; right:-40px; top:-40px; width:140px; height:140px;
    border-radius:50%; background:rgba(255,255,255,.12);
  }
  .current-card .cc-label{
    font-size:11px; letter-spacing:1px; opacity:.85; margin-bottom:6px;
    display:flex; align-items:center; gap:6px;
  }
  .current-card .cc-label .dot{
    width:7px; height:7px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 3px rgba(245,158,11,.3);
  }
  .current-card .cc-name{font-size:19px; font-weight:700; margin-bottom:3px; position:relative; z-index:1;}
  .current-card .cc-sub{font-size:12px; opacity:.9; position:relative; z-index:1;}
  .current-card .cc-arrow{
    position:absolute; right:18px; top:50%; transform:translateY(-50%); z-index:1;
  }
  .current-card .cc-arrow svg{width:20px; height:20px;}

  .current-empty{
    border:1.5px dashed var(--brand-mid); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:20px; background:var(--card);
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    cursor:pointer; transition:.15s;
  }
  .current-empty:hover{border-color:var(--brand); background:var(--brand-soft);}
  .current-empty .ce-t{font-size:14px; font-weight:600; color:var(--text);}
  .current-empty .ce-d{font-size:12px; color:var(--sub); margin-top:2px;}
  .current-empty .ce-arrow{color:var(--brand); flex-shrink:0;}
  .current-empty .ce-arrow svg{width:18px; height:18px;}

  .entries{display:grid; gap:14px;}
  .entry{
    border-radius:var(--radius); padding:22px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    cursor:pointer; text-align:left; transition:.16s;
  }
  .entry .t{font-size:17px; font-weight:700; margin-bottom:6px;}
  .entry .d{font-size:13px; line-height:1.6;}
  .entry .arrow{
    width:48px; height:48px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .entry .arrow svg{width:22px; height:22px;}

  .entry.recommend{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%); color:#fff; border:none;
    box-shadow:var(--shadow-md);}
  .entry.recommend:hover{transform:translateY(-2px);}
  .entry.recommend .d{color:var(--brand-mid);}
  .entry.recommend .arrow{background:rgba(255,255,255,.16);}

  .entry.browse{background:var(--card); border:1px solid var(--border); color:var(--text);
    box-shadow:var(--shadow-sm);}
  .entry.browse:hover{border-color:var(--brand); transform:translateY(-2px);}
  .entry.browse .d{color:var(--sub);}
  .entry.browse .arrow{background:var(--brand-soft);}

  .foot{text-align:center; color:#a6acb8; font-size:12px; padding:0 28px 28px;}

  /* ===== 列表页 ===== */
  .list-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .back-btn{
    width:34px; height:34px; border-radius:10px;
    border:1px solid var(--border); background:var(--card);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition:.15s; box-shadow:var(--shadow-sm);
  }
  .back-btn:hover{border-color:var(--brand);}
  .back-btn svg{width:18px; height:18px;}
  .list-head .title{font-size:16px; font-weight:700;}

  .filters{padding:16px 28px 6px; display:flex; gap:8px; flex-wrap:wrap;}
  .filter{
    font-size:13px; padding:7px 16px; border-radius:18px; cursor:pointer;
    border:1px solid var(--border); background:var(--card); color:var(--sub);
    transition:.15s; font-weight:500;
  }
  .filter.on{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; border-color:transparent; font-weight:600;
    box-shadow:0 4px 10px rgba(38,33,92,.25);}

  .plan-list{padding:14px 28px 100px; display:grid; gap:14px;}
  .plan-card{
    border:1px solid var(--border); border-radius:var(--radius); padding:20px;
    background:var(--card); cursor:pointer; transition:.16s; box-shadow:var(--shadow-sm); position:relative;
  }
  .plan-card:hover{border-color:var(--brand); transform:translateY(-2px); box-shadow:var(--shadow-md);}
  .plan-card .top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px;}
  .plan-card .name{font-size:17px; font-weight:700;}
  .plan-card.sel{border-color:var(--brand); background:var(--brand-soft);}
  .plan-card .chk{
    position:absolute; right:16px; top:16px; width:22px; height:22px; border-radius:7px;
    border:1.5px solid var(--border); background:var(--card); display:flex; align-items:center;
    justify-content:center; transition:.15s; flex-shrink:0; cursor:pointer;
  }
  .plan-card .chk.on{background:var(--brand); border-color:var(--brand);}
  .plan-card .chk svg{width:13px; height:13px; opacity:0; transition:.1s;}
  .plan-card .chk.on svg{opacity:1;}

  /* 底部对比栏 */
  .compare-bar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:40;
    width:calc(100% - 56px); max-width:624px; border-radius:16px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    box-shadow:0 8px 24px rgba(38,33,92,.32);
  }
  .compare-bar .info{font-size:13px; font-weight:500;}
  .compare-bar .info .cnt{font-weight:800; font-size:15px;}
  .compare-bar button{
    padding:9px 20px; border-radius:11px; border:none; background:#fff; color:var(--brand);
    font-size:14px; font-weight:700; cursor:pointer; flex-shrink:0; transition:.15s;
  }
  .compare-bar button:disabled{opacity:.45; cursor:not-allowed;}
  .compare-bar button:not(:disabled):hover{transform:translateY(-1px);}
  .plan-card .desc{font-size:13px; color:var(--sub); line-height:1.6; margin-bottom:12px;}
  .plan-pick-btn{
    width:100%; margin-top:12px; padding:11px; border-radius:11px; border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
    font-size:14px; font-weight:700; cursor:pointer; transition:.15s;
    box-shadow:var(--shadow-sm);
  }
  .plan-pick-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .plan-current-tag{
    width:100%; margin-top:12px; padding:11px; border-radius:11px; border:none;
    background:var(--brand-soft); color:var(--brand); font-size:14px; font-weight:700;
    text-align:center; cursor:default;
  }
  .plan-card .tags{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{font-size:11px; padding:3px 9px; border-radius:7px; background:var(--brand-soft); color:var(--brand); font-weight:500;}
  .tag{font-size:11px; padding:3px 9px; border-radius:7px; background:#f3f4f6; color:var(--sub); border:1px solid var(--border);}
  .badge{font-size:11px; padding:3px 10px; border-radius:7px; white-space:nowrap; margin-left:10px; flex-shrink:0; font-weight:600;}
  .source{font-size:11px; color:var(--sub); display:inline-flex; align-items:center; gap:4px;}

  /* ===== 方案详情页 ===== */
  .detail-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .detail-body{padding:24px 28px 40px;}
  .detail-hero{margin-bottom:24px;}
  .detail-hero .name{font-size:23px; font-weight:800; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
  .detail-hero .target{
    font-size:13px; color:var(--brand-deep); background:var(--brand-soft);
    padding:7px 14px; border-radius:10px; display:inline-block; margin-top:8px; font-weight:500;
  }
  .detail-sec{margin-bottom:26px;}
  .detail-sec .h{
    font-size:15px; font-weight:700; margin-bottom:12px;
    display:flex; align-items:center; gap:8px;
  }
  .detail-sec .h::before{
    content:""; width:4px; height:15px; border-radius:2px;
    background:linear-gradient(180deg,var(--brand),var(--brand-2)); display:inline-block;
  }
  .detail-sec .p{font-size:14px; line-height:1.8; color:var(--text);}
  .detail-sec ul{list-style:none; padding:0;}
  .detail-sec li{
    font-size:14px; line-height:1.7; color:var(--text);
    padding:7px 0 7px 20px; position:relative;
  }
  .detail-sec li::before{
    content:""; position:absolute; left:2px; top:16px;
    width:7px; height:7px; border-radius:50%;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
  }
  .param-row{
    display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--border);
  }
  .param-row:last-child{border-bottom:none;}
  .param-row .k{font-size:13px; color:var(--sub); width:84px; flex-shrink:0; font-weight:500;}
  .param-row .v{font-size:14px; color:var(--text); line-height:1.6;}
  .detail-cta{
    position:sticky; bottom:0; padding:14px 28px;
    background:linear-gradient(to top, var(--bg) 70%, rgba(246,247,251,0));
  }
  .detail-cta button{
    width:100%; padding:15px; border-radius:14px; border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
    transition:.15s; box-shadow:var(--shadow-md);
  }
  .detail-cta button:hover{transform:translateY(-1px);}
  .detail-cta .cta-sub{
    display:block; text-align:center; margin-top:10px; font-size:13px; color:var(--brand);
    cursor:pointer; font-weight:600;
  }
  .detail-cta .cta-sub:hover{opacity:.7;}

  /* 适合人群判断提示 */
  .fit-hint{
    display:flex; align-items:flex-start; gap:10px; border-radius:14px;
    padding:14px 16px; margin-bottom:6px; font-size:13px; line-height:1.6;
  }
  .fit-hint .fh-ic{font-size:16px; flex-shrink:0; line-height:1.4;}
  .fit-hint.ok{background:var(--color-background-success); color:#0F6E56;}
  .fit-hint.warn{background:#FFF7E6; color:#A16207;}
  .fit-hint.none{background:var(--brand-soft); color:var(--brand-deep);}
  .fit-hint b{font-weight:700;}
  .compare-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .compare-body{padding:20px 28px 40px; overflow-x:auto;}
  .compare-table{
    width:100%; border-collapse:separate; border-spacing:0; min-width:440px;
    font-size:13px;
  }
  .compare-table th, .compare-table td{
    padding:12px 14px; text-align:left; vertical-align:top;
    border-bottom:1px solid var(--border);
  }
  .compare-table thead th{
    position:sticky; top:0; background:var(--card); z-index:1; font-size:14px;
  }
  .compare-table thead th .pname{font-weight:700; font-size:14px; color:var(--text);}
  .compare-table thead th .psrc{font-size:11px; color:var(--sub); font-weight:400; margin-top:2px;}
  .compare-table tbody th{
    color:var(--sub); font-weight:600; white-space:nowrap; width:92px;
    background:var(--bg); position:sticky; left:0;
  }
  .compare-table td{color:var(--text); line-height:1.6;}
  .compare-table tr:last-child th, .compare-table tr:last-child td{border-bottom:none;}
  .compare-goal-badges{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px;}
  .compare-goal-badges .badge{margin-left:0;}
  .compare-cta{
    position:sticky; bottom:0; padding:14px 28px;
    background:linear-gradient(to top, var(--bg) 70%, rgba(246,247,251,0));
  }
  .compare-cta .btn-row{display:flex; gap:12px;}
  .compare-cta button{
    flex:1; padding:14px; border-radius:14px; border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
    transition:.15s; box-shadow:var(--shadow-md);
  }
  .compare-cta button:hover{transform:translateY(-1px);}

  /* ===== 计算页 ===== */
  .calc-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .calc-body{padding:24px 28px 40px;}
  .calc-plan-name{font-size:22px; font-weight:800; margin-bottom:4px;}
  .calc-plan-source{font-size:12px; color:var(--sub); margin-bottom:20px;}

  .form-group{margin-bottom:18px;}
  .form-group label{font-size:13px; color:var(--sub); display:block; margin-bottom:8px;}
  .form-group label b{color:var(--text); font-weight:600;}
  .form-input{
    width:100%; padding:13px 15px; border-radius:12px;
    border:1px solid var(--border); background:var(--card);
    font-size:15px; color:var(--text); outline:none; transition:.15s;
  }
  .form-input:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(38,33,92,.12);}
  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .seg{display:flex; gap:8px; flex-wrap:wrap;}
  .seg-item{
    padding:10px 16px; border-radius:11px; cursor:pointer;
    border:1px solid var(--border); background:var(--card); color:var(--sub);
    font-size:13px; transition:.15s; font-weight:500;
  }
  .seg-item.on{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; border-color:transparent; font-weight:600;
    box-shadow:0 4px 10px rgba(38,33,92,.25);}

  .profile-tip{
    background:var(--brand-soft); border-radius:14px; padding:14px 18px;
    font-size:13px; color:var(--text); margin-bottom:20px; line-height:1.6;
    border:1px solid var(--brand-mid);
  }
  .profile-tip a{color:var(--brand); font-weight:600; cursor:pointer; text-decoration:none;}

  .result-card{
    border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:14px;
    background:var(--card); box-shadow:var(--shadow-sm);
  }
  .result-card .rc-title{font-size:13px; color:var(--sub); margin-bottom:14px; font-weight:600;}
  .result-macro{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:10px;}
  .macro-item{
    text-align:center; padding:16px 8px; border-radius:14px;
    background:linear-gradient(180deg,var(--brand-soft) 0%,#fff 100%);
    border:1px solid var(--brand-mid);
  }
  .macro-item .num{font-size:26px; font-weight:800; color:var(--brand-deep);}
  .macro-item .unit{font-size:11px; color:var(--sub);}
  .macro-item .lbl{font-size:12px; color:var(--text); margin-top:3px; font-weight:500;}

  /* ===== 问卷页 ===== */
  .quiz-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .quiz-body{padding:24px 28px 40px;}
  .quiz-progress{
    height:6px; border-radius:3px; background:var(--border); margin-bottom:28px; overflow:hidden;
  }
  .quiz-progress .bar{height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-2)); border-radius:3px; transition:.3s;}
  .quiz-q{font-size:21px; font-weight:700; line-height:1.4; margin-bottom:24px;}
  .quiz-opts{display:grid; gap:12px;}
  .quiz-opt{
    border:1px solid var(--border); border-radius:15px; padding:17px 20px;
    cursor:pointer; transition:.15s; font-size:15px; line-height:1.5;
    background:var(--card); box-shadow:var(--shadow-sm);
  }
  .quiz-opt:hover{border-color:var(--brand); background:var(--brand-soft); transform:translateY(-1px);}

  .quiz-result{text-align:center; padding:20px 0;}
  .quiz-result .big{font-size:24px; font-weight:800; margin-bottom:12px;}
  .quiz-result .why{font-size:13px; color:var(--sub); line-height:1.7; margin-bottom:28px; text-align:left;
    background:var(--brand-soft); border-radius:14px; padding:16px 18px; border:1px solid var(--brand-mid);}
  .quiz-result .why b{color:var(--text);}

  /* 备选方案 */
  .quiz-alt{margin:18px 0 24px; text-align:left;}
  .quiz-alt .alt-title{font-size:13px; color:var(--sub); font-weight:600; margin-bottom:10px;}
  .alt-card{
    border:1px solid var(--border); border-radius:13px; padding:13px 15px;
    margin-bottom:8px; cursor:pointer; transition:.15s; background:var(--card);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .alt-card:hover{border-color:var(--brand);}
  .alt-card .ac-name{font-size:14px; font-weight:600; color:var(--text);}
  .alt-card .ac-desc{font-size:12px; color:var(--sub); margin-top:2px; line-height:1.5;}
  .alt-card .ac-arrow{color:var(--brand); flex-shrink:0; font-weight:600;}

  /* ===== 我的面板 ===== */
  .me-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .me-body{padding:24px 28px 40px; max-width:560px; margin:0 auto;}

  .me-section{margin-bottom:26px;}
  .me-section .st{font-size:13px; font-weight:600; color:var(--sub); margin-bottom:10px; padding-left:2px;}
  .me-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden;
  }
  .me-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:15px 18px; font-size:15px;
  }
  .me-row + .me-row{border-top:1px solid var(--border);}
  .me-row .ic{
    width:32px; height:32px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--brand-soft);
  }
  .me-row .ic svg{width:18px; height:18px;}
  .me-row .lbl{color:var(--text); flex:1; text-align:left; display:flex; align-items:center; gap:11px;}
  .me-row .val{color:var(--sub); font-size:14px; max-width:60%; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .me-row .act{color:var(--brand); font-size:14px; cursor:pointer; flex-shrink:0; font-weight:500;}
  .me-row .act:hover{opacity:.7;}
  .me-tip{font-size:12px; color:var(--sub); line-height:1.6; margin-top:8px; padding:0 4px;}
  .me-danger{color:#DC2626;}

  .btn-primary{
    width:100%; padding:14px; border-radius:13px; border:none;

const PLANS = [
  {
    id:"month3",
    name:"三个月减脂计划",
    source:"谭成义",
    desc:"训练要求低，照着模板吃，每 10 天调一次碳水，稳稳掉秤。",

      logic:"从当前体重出发，算出每日碳水、蛋白质、脂肪的克数，吃够 10 天看体重和腰围变化，每次只调整碳水，蛋白质和脂肪基本不动。用 10 天为一个周期逐步逼近适合自己的饮食量。",

        "脂肪":"0.6–0.8 g/kg（含蛋黄、坚果、食用油）",

      meals:[

/* ===== 页面切换 ===== */
let curScreen = "home";
function go(name){
  curScreen = name;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-"+name).classList.add("active");
  window.scrollTo(0,0);
  // 离开列表页时退出对比模式
  if(name!=="list" && compareMode){
    compareMode = false;
    compareSel = [];
  }
  if(name==="list") renderFilters();
  if(name==="home") renderCurrentPlan();
}

/* ===== 当前选择方案 ===== */
const CURRENT_PLAN_KEY = "lizi_current_plan";
function getCurrentPlanId(){
  try{ return localStorage.getItem(CURRENT_PLAN_KEY) || ""; }catch(e){ return ""; }
}
function setCurrentPlan(id){
  try{ localStorage.setItem(CURRENT_PLAN_KEY, id); }catch(e){}
}

  const box = document.getElementById("currentPlanBox");
  const homeEntries = document.getElementById("homeEntries");
  const id = getCurrentPlanId();
  const p = PLANS.find(x=>x.id===id);
  const profile = loadProfile();
  const hasProfile = profile.gender && profile.age && profile.height && profile.weight;

  // 首页状态规则：个人信息完整 + 已选方案 → 方案/食谱态；否则一律回到「问卷+方案选择」初始态
  if(p && hasProfile){
    // 已选方案：隐藏「帮我推荐/我有想执行的方案」引导入口，只显示当前方案 + 食谱/热量快捷入口

    box.innerHTML = `
      <div class="current-card" onclick="openPlan('${p.id}','home')">
        <div class="cc-label"><span class="dot"></span>当前选择方案</div>

          <svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

        </div>
      </div>`;
  } else {
    // 初始态：无个人信息（含清空后）= 全新用户，一律回到「问卷 + 方案选择」，不显示任何方案名
    if(homeEntries) homeEntries.style.display = "grid";

/* ===== 筛选 ===== */
let curFilter = "全部";
const FILTERS = ["全部","增肌","减脂","日常健康"];

function renderFilters(){
  const box = document.getElementById("filters");
  box.innerHTML = FILTERS.map(f=>
    `<span class="filter ${f===curFilter?'on':''}" onclick="setFilter('${f}')">${f}</span>`
  ).join("");
  renderPlans();
  renderCompareBar();
}
function setFilter(f){ curFilter = f; renderFilters(); }

/* ===== 方案对比选择状态 ===== */
let compareSel = [];        // 当前勾选对比的方案 id（最多 3 个）
let compareMode = false;    // 列表页是否处于「对比模式」
const COMPARE_MAX = 3;

function toggleCompare(id, e){
  if(e) e.stopPropagation();
  const idx = compareSel.indexOf(id);
  if(idx>=0){
    compareSel.splice(idx,1);
  } else {
    if(compareSel.length>=COMPARE_MAX){
      alert(`最多对比 ${COMPARE_MAX} 个方案`);
      return;
    }
    compareSel.push(id);
  }
  renderPlans();
  renderCompareBar();
}

function renderCompareBar(){
  const bar = document.getElementById("compareBar");
  const cnt = document.getElementById("compareCnt");
  const btn = document.getElementById("compareBtn");
  if(!bar) return;
  if(!compareMode){ bar.style.display = "none"; return; }
  cnt.textContent = compareSel.length;
  bar.style.display = "flex";
  btn.disabled = compareSel.length<2;
}

/* ===== 渲染方案卡片 ===== */
function renderPlans(){
  const box = document.getElementById("planList");
  const list = PLANS.filter(p=>{
    if(curFilter==="全部") return true;
    const goals = p.goals || [p.goal];
    return goals.includes(curFilter);
  });
  const curId = getCurrentPlanId();
  if(list.length===0){
    box.innerHTML = `<div style="text-align:center;color:#9aa0a6;font-size:13px;padding:40px 0;">暂无「${curFilter}」方案，敬请期待</div>`;
    return;
  }
  box.innerHTML = list.map(p=>{
    const g = GOAL_STYLE[p.goal] || GOAL_STYLE["减脂"];
    const badges = (p.goals || [p.goal]).map(gk=>{
      const gs = GOAL_STYLE[gk] || GOAL_STYLE["减脂"];
      return `<span class="badge" style="color:${gs.color};background:${gs.bg};margin-left:4px;">${gk}</span>`;
    }).join("");
    const isSel = compareSel.includes(p.id);
    const isCurrent = p.id === curId;
    // 对比模式：卡片右上角勾选框，点击卡片整体切换勾选
    const chk = compareMode

/* 适合人群判断：方案训练要求 vs 用户活动水平 */
function buildFitHint(p){
  const profile = loadProfile();
  const act = profile.actLevel;
  const train = (p.compare && p.compare.training) || "";

  // 训练要求 → 建议最低活动水平
  const trainMap = {
    "无门槛": "sed",
    "低": "light",
    "低–中": "light",
    "需配合训练": "mod",
    "高": "high"
  };
  const needLevel = trainMap[train];

  if(!act){
    return `<div class="fit-hint none"><span class="fh-ic">💡</span><div>还没填写你的活动水平。<a onclick="go('me')" style="color:var(--brand);font-weight:600;">去「我的」完善个人信息</a>，我会帮你判断这个方案适不适合你。</div></div>`;
  }

  const lv = {sed:0, light:1, mod:2, high:3};
  const cur = lv[act] ?? 0;
  const need = lv[needLevel] ?? 0;

  if(cur >= need){
    return `<div class="fit-hint ok"><span class="fh-ic">✓</span><div><b>适合你。</b>你的活动水平「${ACT_DESC[act]}」达到这个方案的训练要求（${train}）。</div></div>`;
  } else {
    return `<div class="fit-hint warn"><span class="fh-ic">⚠️</span><div><b>训练要求可能偏高。</b>这个方案需要「${train}」训练量，你目前是「${ACT_DESC[act]}」。若训练跟不上，效果会打折。</div></div>`;
  }
}

const GOAL_EXTRA_FIELDS = [
  {key:"targetWeight", label:"目标体重", type:"num", unit:"kg"},
  {key:"targetWeeks",   label:"预计减脂时长", type:"num", unit:"周", hint:"（WHO 建议健康减重速度为每周 0.5–1kg）"}
];

// 权威减脂速度标准（来源：世界卫生组织 WHO 建议）
const WEIGHT_LOSS = {
  minKgPerWeek: 0.5,   // 最低健康速度（kg/周）
  maxKgPerWeek: 1.0,   // 最高健康速度（kg/周）
  minKgPerWeekSoft: 0.3  // 过低阈值（低于此值提示目标偏保守）
};

// 校验「当前体重 → 目标体重」与「预计时长」是否现实
// 返回 {ok, speed, weeksMin, weeksMax, msg, level}
function validateWeightLoss(curWeight, targetWeight, weeks){
  const diff = curWeight - targetWeight;
  if(diff <= 0){
    return {ok:false, level:"invalid", speed:0, weeksMin:0, weeksMax:0,
      msg:"目标体重应低于当前体重（减脂目标下）。若想维持或增重，请切换目标。"};
  }
  if(weeks && weeks > 0){
    const speed = diff / weeks;  // kg/周
    const weeksMin = Math.ceil(diff / WEIGHT_LOSS.maxKgPerWeek);
    const weeksMax = Math.round(diff / WEIGHT_LOSS.minKgPerWeek);
    if(speed > WEIGHT_LOSS.maxKgPerWeek){
      return {ok:false, level:"warn-fast", speed, weeksMin, weeksMax,
        msg:`按这个时长，你需要每周减 ${speed.toFixed(2)}kg，超过 WHO 建议的安全上限（0.5–1kg/周）。建议延长到 ${weeksMin} 周以上，或把目标体重调高一些。`};
    }
    if(speed < WEIGHT_LOSS.minKgPerWeekSoft){
      return {ok:true, level:"warn-slow", speed, weeksMin, weeksMax,
        msg:`这个时长偏宽松，每周只需减 ${speed.toFixed(2)}kg，可能动力不足。合理时长约 ${weeksMin}–${weeksMax} 周。`};
    }
    return {ok:true, level:"ok", speed, weeksMin, weeksMax,
      msg:`合理。预计每周减约 ${speed.toFixed(2)}kg，处于 WHO 建议的 0.5–1kg/周安全区间内。`};
  }
  // 未填时长，仅给出建议区间
  const weeksMin = Math.ceil(diff / WEIGHT_LOSS.maxKgPerWeek);
  const weeksMax = Math.round(diff / WEIGHT_LOSS.minKgPerWeek);
  return {ok:true, level:"hint", speed:0, weeksMin, weeksMax,
    msg:`共需减 ${diff.toFixed(1)}kg。按 WHO 建议（0.5–1kg/周），合理时长约 ${weeksMin}–${weeksMax} 周。`};
}

// 未提交输入暂存：切换 segment 重渲染时，保留用户已输入但未保存的数字值
let profileDraft = {};

// 从当前 DOM 表单收集未提交的输入值（num 字段 + 减脂专属字段）
function collectProfileDraft(){
  PROFILE_FIELDS.forEach(f=>{
    if(f.type==="num"){
      const el = document.getElementById("profile_"+f.key);
      if(el && el.value !== "") profileDraft[f.key] = el.value;
    }
  });
  ["targetWeight","targetWeeks"].forEach(k=>{
    const el = document.getElementById("profile_"+k);
    if(el && el.value !== "") profileDraft[k] = el.value;
  });
}

function renderProfileForm(profile){
  const base = PROFILE_FIELDS.map(f=>{
    if(f.type==="seg"){
      return `
        <div class="form-group">
          <label><b>${f.label}</b></label>
          <div class="seg">
            ${f.options.map(o=>`<div class="seg-item ${profile[f.key]===o.v?"on":""}" onclick="pickProfileSeg('${f.key}','${o.v}')">${o.label}</div>`).join("")}
          </div>
        </div>`;
    }
    // 优先用草稿值（未提交输入），其次用已保存值
    const val = (profileDraft[f.key] !== undefined) ? profileDraft[f.key] : (profile[f.key]||"");
    return `
      <div class="form-group">
        <label><b>${f.label}</b></label>
        <input class="form-input" type="number" id="profile_${f.key}" value="${val}" placeholder="${f.unit}" />
      </div>`;
  }).join("");

  // 减脂目标：追加目标体重 + 预计时长
  let extra = "";
  if(profile.goal === "lose"){
    const tw = (profileDraft.targetWeight !== undefined) ? profileDraft.targetWeight : (profile.targetWeight||"");
    const tww = (profileDraft.targetWeeks !== undefined) ? profileDraft.targetWeeks : (profile.targetWeeks||"");
    extra = `
      <div class="form-group">
        <label><b>目标体重</b></label>
        <input class="form-input" type="number" id="profile_targetWeight" value="${tw}" placeholder="kg" oninput="renderWeightHint()" />
      </div>
      <div class="form-group">
        <label><b>预计减脂时长</b></label>
        <input class="form-input" type="number" id="profile_targetWeeks" value="${tww}" placeholder="周" oninput="renderWeightHint()" />
      </div>
      <div id="weightHint" style="margin-top:8px;"></div>`;
  }
  return base + extra;
}

// 实时显示减脂合理性提示（目标体重 / 时长联动）
function renderWeightHint(){
  const box = document.getElementById("weightHint");
  if(!box) return;
  const p = loadProfile();
  const curW = parseFloat(document.getElementById("profile_weight")?.value) || p.weight;
  const tgtW = parseFloat(document.getElementById("profile_targetWeight")?.value);
  const weeks = parseFloat(document.getElementById("profile_targetWeeks")?.value);
  if(!curW || !tgtW){
    box.innerHTML = "";
    return;
  }
  const r = validateWeightLoss(curW, tgtW, weeks);
  const colorMap = {invalid:"#DC2626", "warn-fast":"#DC2626", "warn-slow":"#B45309", "ok":"#0F6E56", "hint":"#185FA5"};
  const iconMap = {invalid:"⚠️", "warn-fast":"⚠️", "warn-slow":"💡", "ok":"✓", "hint":"💡"};
  box.innerHTML = `<div class="weight-hint" style="color:${colorMap[r.level]};background:${r.level==="ok"?"rgba(15,110,86,.08)":r.level==="warn-fast"||r.level==="invalid"?"rgba(220,38,38,.08)":"rgba(24,95,165,.08)"};font-size:12.5px;line-height:1.6;padding:10px 12px;border-radius:10px;">${iconMap[r.level]} ${r.msg}</div>`;
}

function pickProfileSeg(key, v){
  // 重渲染前，先收集当前表单里未提交的输入，避免丢失
  collectProfileDraft();
  const p = loadProfile();
  p[key] = v;
  saveProfile(p);
  if(pendingRecipeAfterInfo){
    const hasProfile = p.gender && p.age && p.height && p.weight;
    if(hasProfile){ openRecipe(); return; }
  }
  // 根据当前页面重渲染对应表单：我的面板 vs 计算页
  if(curScreen === "me"){
    editMeProfile();
  } else {
    renderCalc(PLANS.find(x=>x.id===curPlanId));
  }
}

function saveProfileForm(){
  const p = loadProfile();
  PROFILE_FIELDS.forEach(f=>{
    if(f.type==="num"){
      const v = document.getElementById("profile_"+f.key).value;
      if(v) p[f.key] = parseFloat(v);
    }
  });
  // 减脂专属字段
  if(p.goal === "lose"){
    const tw = document.getElementById("profile_targetWeight");
    const tww = document.getElementById("profile_targetWeeks");
    if(tw && tw.value) p.targetWeight = parseFloat(tw.value);
    if(tww && tww.value) p.targetWeeks = parseFloat(tww.value);
  }
  // 减脂合理性校验：超安全速度时警告
  if(p.goal === "lose" && p.weight && p.targetWeight && p.targetWeeks){
    const r = validateWeightLoss(p.weight, p.targetWeight, p.targetWeeks);
    if(r.level === "warn-fast" || r.level === "invalid"){
      if(!confirm(r.msg + "\n\n仍要按当前设置保存吗？（建议调整目标体重或时长）")){
        return;
      }
    }
  }
  saveProfile(p);
  profileDraft = {};
  if(pendingRecipeAfterInfo){
    const hasProfile = p.gender && p.age && p.height && p.weight;
    if(hasProfile){ openRecipe(); return; }
  }

}

/* ===== 计算逻辑 ===== */
function calcResult(id){
  const p = PLANS.find(x=>x.id===id);
  const profile = loadProfile();
  const hasProfile = profile.gender && profile.age && profile.height && profile.weight;

  if(!hasProfile){
    alert("请先完善个人信息");
    return;
  }

  const w = profile.weight; // 体重 kg
  let carb=0, protein=0, fat=0, kcal=0;
  let extra = ""; // 额外说明

  const g = profile.gender;
  const age = profile.age;
  const h = profile.height;

  // 基础代谢 Mifflin-St Jeor
  let bmr = 10*w + 6.25*h - 5*age + (g==="male"?5:-161);

  switch(id){
    case "month3":{
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB["month3"]||{})[tl] || 2.8;
      carb = w * carbK;
      protein = w * 1.5;
      fat = w * 0.7;
      kcal = carb*4 + protein*4 + fat*9;
      extra = `活动水平「${ACT_DESC[tl]}」→ 碳水 ${carbK}g/kg，蛋白 1.5g/kg、脂肪 0.7g/kg 起步，每 10 天只调碳水。`;
      break;
    }
    case "triple-carb":{
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB["triple-carb"]||{})[tl] || 3.0;
      carb = w * carbK;
      protein = w * 1.6;
      fat = w * 0.8;
      kcal = carb*4 + protein*4 + fat*9;
      extra = `活动水平「${ACT_DESC[tl]}」→ 碳水 ${carbK}g/kg，蛋白 1.6g/kg、脂肪 0.8g/kg 固定。`;
      break;
    }
    case "carb-descend":{
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB["carb-descend"]||{})[tl] || 2.8;
      carb = w * carbK;
      protein = w * 1.5;
      fat = w * 0.7;
      kcal = carb*4 + protein*4 + fat*9;
      const ver = segState.version || "dyn";
      extra = `活动水平「${ACT_DESC[tl]}」→ 起始碳水 ${carbK}g/kg，蛋白 1.5g/kg 渐升、脂肪 0.7g/kg。版本：${ver==="dyn"?"三个月动态版（90天）":"40天冲刺版"}。每 10 天复盘渐降。`;
      break;
    }
    case "five32":{
      const base = segState.base || "big";
      const act = profile.actLevel || "sed";
      const defOpt = p.inputs[0].options.find(o=>o.v===base);
      const deficit = defOpt ? defOpt.deficit : 500;
      const actK = ACT_FACTOR[act] || 1.2;
      const tdee = bmr * actK;
      const intake = tdee - deficit;
      carb = intake * 0.5 / 4;
      protein = intake * 0.3 / 4;
      fat = intake * 0.2 / 9;
      kcal = intake;
      extra = `总消耗≈${Math.round(tdee)} 大卡（BMR ${Math.round(bmr)}×活动系数 ${actK}），${base==="big"?"大基数":"小基数"}减 ${deficit} 大卡缺口，按 5:3:2 分配。`;
      break;
    }
    case "kai-carb-cycle":{
      const bt = segState.bodyType || "endo";
      const opt = p.inputs[0].options.find(o=>o.v===bt);
      const carbK = opt.carb, fatK = opt.fat;
      carb = w * carbK;
      fat = w * fatK;
      protein = w * 1.0;
      kcal = carb*4 + protein*4 + fat*9;
      extra = `${opt.label}：碳水 ${carbK}g/kg、脂肪 ${fatK}g/kg、蛋白按 1g/kg 起步。一周 = 2 高碳 + 3 中碳 + 2 低碳（蛋白每天不变）。`;
      break;
    }
    case "dietary-guideline":{
      const act = profile.actLevel || "sed";
      const actK = ACT_FACTOR[act] || 1.2;
      const tdee = bmr * actK;
      kcal = tdee;
      carb = tdee * 0.575 / 4;  // 碳水取中值 57.5%
      protein = tdee * 0.125 / 4; // 蛋白取中值 12.5%
      fat = tdee * 0.25 / 9;    // 脂肪取中值 25%
      extra = `按总能量 ${Math.round(tdee)} 大卡，供能比取中值：碳水 57.5%、蛋白 12.5%、脂肪 25%（官方区间 50–65%/10–15%/20–30%）。`;
      break;
    }
    case "zengji-yingyu":{
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB["zengji-yingyu"]||{})[tl] || 5.0;
      const actK = ACT_FACTOR[tl] || 1.55;
      const tdee = bmr * actK;
      const surplus = 400;  // 300–500 取中值
      const intake = tdee + surplus;
      carb = w * carbK;
      protein = w * 1.8;      // 1.6–2.0 取中值
      fat = w * 0.8;          // 0.6–1.0 取中值
      kcal = intake;
      extra = `活动水平「${ACT_DESC[tl]}」→ 碳水 ${carbK}g/kg。总消耗≈${Math.round(tdee)} 大卡（BMR ${Math.round(bmr)}×活动系数 ${actK}），加 300–500 盈余后摄入≈${Math.round(intake)} 大卡，蛋白 1.8g/kg、脂肪 0.8g/kg 起步。核心：热量盈余 + 足量蛋白碳水，配合渐进超负荷力量训练稳步增肌。`;
      break;
    }
  }

  document.getElementById("calcResult").innerHTML = `
    <div class="result-card">
      <div class="rc-title">每日营养素目标</div>
      <div class="result-macro">
        <div class="macro-item"><div class="num">${Math.round(carb)}</div><div class="unit">克/天</div><div class="lbl">碳水化合物</div></div>
        <div class="macro-item"><div class="num">${Math.round(protein)}</div><div class="unit">克/天</div><div class="lbl">蛋白质</div></div>
        <div class="macro-item"><div class="num">${Math.round(fat)}</div><div class="unit">克/天</div><div class="lbl">脂肪</div></div>
      </div>
      <div style="text-align:center;font-size:13px;color:var(--sub);">总热量 ≈ ${Math.round(kcal)} 大卡/天</div>
    </div>
    <div class="result-card" style="background:var(--brand-soft);border-color:transparent;">
      <div class="rc-title">说明</div>
      <div style="font-size:13px;color:var(--text);line-height:1.7;">${extra}</div>
    </div>
  `;
}

function goRecommend(){
  quizIdx = 0;
  quizGoal = null;
  quizList = [];
  Object.keys(quizAns).forEach(k=>delete quizAns[k]);
  // 预填已有个人信息：已填过的字段不再重复询问（目标题始终保留，用户可重选）
  const p = loadProfile();
  QUIZ_INFO.forEach(f=>{ if(p[f.key] !== undefined && p[f.key] !== "") quizAns[f.key] = p[f.key]; });
  QUIZ_INFO_LOSE.forEach(f=>{ if(p[f.key] !== undefined && p[f.key] !== "") quizAns[f.key] = p[f.key]; });
  renderQuiz();
  go('quiz');

// 生成完整问卷题目序列：目标题 + 未填的通用信息题 + (未填的减脂专属信息题) + 分支题
function getQuizItems(){
  const items = [QUIZ_ENTRY, ...QUIZ_INFO.filter(f=>!(f.key in quizAns))];
  if(quizGoal === "lose"){
    // 减脂：追加未填的目标体重/时长
    const loseExtra = QUIZ_INFO_LOSE.filter(f=>!(f.key in quizAns));
    items.push(...loseExtra);
  }
  items.push(...quizList);
  return items;
}

function renderQuiz(){
  const items = getQuizItems();
  const total = items.length;
  if(quizIdx >= total){
    renderQuizResult();
    return;
  }
  const item = items[quizIdx];
  const progress = Math.round((quizIdx/total)*100);

  if(item.type === "num"){
    // 数字输入题
    const hint = item.hint ? `<div class="quiz-hint" id="quizNumHint" style="font-size:12.5px;color:#185FA5;margin-top:10px;line-height:1.6;"></div>` : "";
    document.getElementById("quizBody").innerHTML = `
      <div class="quiz-progress"><div class="bar" style="width:${progress}%"></div></div>
      <div class="quiz-q">${item.q}</div>
      <input class="form-input" type="number" id="quizNum" inputmode="decimal" placeholder="${item.unit}" style="font-size:18px;padding:14px;" oninput="onQuizNumInput('${item.key}')" />
      ${hint}
      <button class="btn-primary" style="margin-top:16px;" onclick="submitQuizNum('${item.key}')">下一步</button>
    `;
    // 渲染减脂时长提示
    if(item.hint) onQuizNumInput(item.key);
  } else {
    // 选择题
    document.getElementById("quizBody").innerHTML = `
      <div class="quiz-progress"><div class="bar" style="width:${progress}%"></div></div>
      <div class="quiz-q">${item.q}</div>
      <div class="quiz-opts">
        ${item.opts.map(o=>`<div class="quiz-opt" onclick="pickQuiz('${o.v}')">${o.label}</div>`).join("")}
      </div>
    `;
  }
}

// 数字题输入时的实时提示（减脂时长题给出权威建议）
function onQuizNumInput(key){
  const hintBox = document.getElementById("quizNumHint");
  if(!hintBox) return;
  if(key === "targetWeeks"){
    const p = loadProfile();
    const curW = p.weight;
    const tgtW = quizAns["targetWeight"];
    if(curW && tgtW){
      const r = validateWeightLoss(curW, tgtW, null);
      hintBox.innerHTML = `💡 ${r.msg}`;
    } else {
      hintBox.innerHTML = "";
    }
    return;
  }
  if(key === "targetWeight"){
    const p = loadProfile();
    const curW = p.weight;
    const v = parseFloat(document.getElementById("quizNum").value);
    if(curW && v && v < curW){
      const diff = curW - v;
      const wMin = Math.ceil(diff / WEIGHT_LOSS.maxKgPerWeek);
      const wMax = Math.round(diff / WEIGHT_LOSS.minKgPerWeek);
      hintBox.innerHTML = `💡 需减 ${diff.toFixed(1)}kg，按 WHO 建议（0.5–1kg/周），合理时长约 ${wMin}–${wMax} 周。`;
    } else if(curW && v && v >= curW){
      hintBox.innerHTML = `⚠️ 目标体重应低于当前体重 ${curW}kg（减脂目标下）。`;
    } else {
      hintBox.innerHTML = "";
    }
  }
}

function pickQuiz(v){
  if(quizIdx === 0){
    // 第 1 题：目标，切换分支
    quizGoal = v;
    quizList = QUIZ_FLOW[v] || [];
    quizAns["goal"] = v;
    // 记录目标到个人信息
    const p = loadProfile();
    p.goal = v;
    saveProfile(p);
  } else {
    const items = getQuizItems();
    const item = items[quizIdx];
    if(item.key){
      // 个人信息题（含减脂专属）：记录并写入个人信息
      quizAns[item.key] = v;
      const p = loadProfile();
      p[item.key] = v;
      saveProfile(p);
    } else {
      quizAns[item.q] = v;
    }
  }
  quizIdx++;
  renderQuiz();
}

function submitQuizNum(key){
  const v = document.getElementById("quizNum").value;
  if(v === "" || v === null){
    return; // 未填不跳转
  }
  const num = parseFloat(v);
  quizAns[key] = num;
  const p = loadProfile();
  p[key] = num;
  saveProfile(p);

  // 减脂时长校验：超出安全速度时给警告并阻断
  if(key === "targetWeeks" && quizGoal === "lose"){
    const curW = p.weight;
    const tgtW = p.targetWeight;
    if(curW && tgtW){
      const r = validateWeightLoss(curW, tgtW, num);
      if(r.level === "warn-fast" || r.level === "invalid"){
        if(!confirm(r.msg + "\n\n仍要按这个时长继续吗？")){
          return;
        }
      }
    }
  }
  quizIdx++;
  renderQuiz();
}

function recommendPlan(){
  const goal = quizAns["goal"];

  // 日常健康 → 膳食指南（直接出结果）
  if(goal==="health"){
    return {id:"dietary-guideline", reason:"你想吃得均衡健康，中国居民膳食指南是最通用的营养基线，无需训练门槛，所有人都适用。"};
  }
  // 增肌 → 增肌盈余法
  if(goal==="muscle"){
    return {id:"zengji-yingyu", reason:"你想增肌，增肌盈余法采用 ISSN 与卫健委的权威标准：热量盈余 300–500 大卡、蛋白 1.6–2g/kg、碳水供能比 60–65%，配合渐进超负荷力量训练，把盈余转化为肌肉。"};
  }
  // 减脂分支
  if(goal==="lose"){
    const act = quizAns["actLevel"];
    const stuck = quizAns["你现在减脂遇到什么情况？"];
    const style = quizAns["你更想要哪种执行方式？"];
    const curW = quizAns["weight"];
    const tgtW = quizAns["targetWeight"];
    const needLose = (curW && tgtW && tgtW < curW) ? (curW - tgtW) : null;

    // 大基数（需减 >15kg）优先精确控制的 532
    if(needLose && needLose > 15){
      return {id:"five32", reason:`你需要减约 ${needLose.toFixed(0)}kg，属于较大基数。532 碳水渐降法计算步骤清晰、每周复盘调碳水，更适合大基数稳步减脂、避免反弹。`};
    }
    // 训练强度高 + 之前低碳反弹 → 三倍碳水
    if(act==="high" && stuck==="rebound"){
      return {id:"triple-carb", reason:"你训练强度高、但之前低碳减脂状态差易反弹，三倍碳水法靠高碳水支撑高强度训练，用训练消耗制造缺口，适合你。"};
    }
    // 训练强度高 → 三倍碳水
    if(act==="high"){
      return {id:"triple-carb", reason:"你训练强度高，三倍碳水法用高碳水提状态、靠训练消耗制造缺口，正好发挥你的训练能力。"};
    }
    // 平台期 → 碳水渐降
    if(stuck==="stuck"){
      return {id:"carb-descend", reason:"你卡在平台期，碳水渐降法从较高碳水逐步降低、穿插高碳日，给身体适应时间，长期可持续、不易反弹。"};
    }
    // 第一次减脂 + 想要简单 → 三个月减脂计划
    if(stuck==="first" || style==="simple"){
      return {id:"month3", reason:"你有完整模板照着吃，每 10 天只调碳水，简单直接，最适合减脂新手稳稳掉秤。"};
    }
    // 大基数/想要精确 → 532
    if(style==="precise"){
      return {id:"five32", reason:"你喜欢按数字精确执行，532 碳水渐降法计算步骤清晰、每周复盘调碳水，大基数也友好。"};
    }
    // 想长期坚持 → 碳水渐降
    if(style==="flexible"){
      return {id:"carb-descend", reason:"你想灵活调整、长期坚持，碳水渐降法循序渐进、穿插高碳日，可持续性强、不易反弹。"};
    }
    // 默认
    return {id:"month3", reason:"你有完整模板照着吃，每 10 天只调碳水，简单直接，适合减脂稳稳掉秤。"};
  }
  return {id:"month3", reason:"推荐你从三个月减脂计划开始，有完整模板照着吃，简单直接。"};
}

function editMeProfile(){
  const p = loadProfile();
  // 兜底：goal 缺失时根据当前方案推断（老用户兼容）
  if(!p.goal){
    const cp = PLANS.find(x=>x.id===getCurrentPlanId());
    if(cp) p.goal = cp.goal === "减脂" ? "lose" : (cp.goal === "增肌" ? "muscle" : "health");
  }
  document.getElementById("meProfileSection").innerHTML = `
    <div class="st">编辑个人信息</div>
    <div class="me-card">
      <div style="padding:15px 18px;">${renderProfileForm(p)}</div>
      <div class="me-row">
        <span class="lbl"></span>
        <span class="act" onclick="saveMeProfile()">保存</span>
      </div>
    </div>
  `;
}

function saveMeProfile(){
  const p = loadProfile();
  PROFILE_FIELDS.forEach(f=>{
    if(f.type==="num"){
      const v = document.getElementById("profile_"+f.key).value;
      if(v) p[f.key] = parseFloat(v);
    }
  });
  if(p.goal === "lose"){
    const tw = document.getElementById("profile_targetWeight");
    const tww = document.getElementById("profile_targetWeeks");
    if(tw && tw.value) p.targetWeight = parseFloat(tw.value);
    if(tww && tww.value) p.targetWeeks = parseFloat(tww.value);
  }
  saveProfile(p);
  profileDraft = {};
  renderMe();
}

function exportData(){
  const data = {
    app:"lizi-diet",
    version:1,
    exportedAt:new Date().toISOString(),
    profile:loadProfile()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "lizi-diet-数据备份.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      const profile = data.profile || data;
      if(profile && typeof profile === "object"){
        // 只导入合法的个人信息字段
        const p = loadProfile();
        PROFILE_FIELDS.forEach(f=>{
          if(profile[f.key] !== undefined) p[f.key] = profile[f.key];
        });
        // 减脂专属字段 + 目标
        ["goal","targetWeight","targetWeeks"].forEach(k=>{
          if(profile[k] !== undefined) p[k] = profile[k];
        });
        saveProfile(p);
        renderMe();
        alert("导入成功，个人信息已更新。");
      } else {
        alert("文件格式不正确，未能导入。");
      }
    }catch(err){
      alert("文件解析失败，请确认是有效的 JSON 备份文件。");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

/* ---- 食物数据（内置 FOODS + 用户自定义） ---- */
const CUSTOM_FOOD_KEY = "lizi_custom_foods";
function loadCustomFoods(){
  try{ return JSON.parse(localStorage.getItem(CUSTOM_FOOD_KEY)) || []; }
  catch(e){ return []; }
}
function saveCustomFoods(list){ localStorage.setItem(CUSTOM_FOOD_KEY, JSON.stringify(list)); }
function allFoods(){
  return FOODS.concat(loadCustomFoods());
}
function findFood(name){
  return allFoods().find(f=>f.name===name);
}
function foodKcal(f, grams){
  // 按每 100g 营养值，换算成实际克数的热量与三大营养素
  return {
    kcal: f.kcal * grams / 100,
    protein: f.protein * grams / 100,
    carb: f.carb * grams / 100,
    fat: f.fat * grams / 100
  };
}

/* ---- 计算目标营养素（复用一个纯净函数，供食谱匹配用） ---- */
function computeTarget(planId, profile){
  const w = profile.weight;
  const g = profile.gender, age = profile.age, h = profile.height;
  const bmr = 10*w + 6.25*h - 5*age + (g==="male"?5:-161);
  let carb=0, protein=0, fat=0, kcal=0;
  switch(planId){
    case "month3": case "carb-descend": {
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB[planId]||{})[tl] || 2.8;
      carb = w*carbK; protein = w*1.5; fat = w*0.7; kcal = carb*4+protein*4+fat*9; break;
    }
    case "triple-carb": {
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB[planId]||{})[tl] || 3.0;
      carb = w*carbK; protein = w*1.6; fat = w*0.8; kcal = carb*4+protein*4+fat*9; break;
    }
    case "five32": {
      const base = segState.base || "big";
      const act = profile.actLevel || "sed";
      const def = base==="big"?500:300;
      const actK = ACT_FACTOR[act] || 1.2;
      const tdee = bmr*actK; const intake = tdee-def;
      carb = intake*0.5/4; protein = intake*0.3/4; fat = intake*0.2/9; kcal = intake; break;
    }
    case "kai-carb-cycle": {
      const bt = segState.bodyType || "endo";
      const p = PLANS.find(x=>x.id==="kai-carb-cycle");
      const opt = p.inputs[0].options.find(o=>o.v===bt);
      carb = w*opt.carb; fat = w*opt.fat; protein = w*1.0; kcal = carb*4+protein*4+fat*9; break;
    }
    case "dietary-guideline": {
      const act = profile.actLevel || "sed";
      const actK = ACT_FACTOR[act] || 1.2; const tdee = bmr*actK;
      kcal = tdee; carb = tdee*0.575/4; protein = tdee*0.125/4; fat = tdee*0.25/9; break;
    }
    case "zengji-yingyu": {
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB[planId]||{})[tl] || 5.0;
      const actK = ACT_FACTOR[tl] || 1.55; const tdee = bmr*actK;
      const intake = tdee+400;
      carb = w*carbK; protein = w*1.8; fat = w*0.8; kcal = intake; break;
    }
  }
  return { carb, protein, fat, kcal };
}

/* ---- 推荐食谱页 ---- */
let recipeTplIdx = 0;
let recipePlanId = "";
let recipeMeals = null;   // 当前展示的一日三餐（已缩放）
let recipeCustom = null;  // 用户手动替换后的三餐

function planGoal(planId){
  const p = PLANS.find(x=>x.id===planId);
  return p ? p.goal : "减脂";
}

/* 按用户体重（70kg 基准）缩放模板 */
function scaleTemplate(tpl, weight){
  const ratio = (weight || 70) / 70;
  const out = {goal:tpl.goal, name:tpl.name, meals:{}};
  Object.keys(tpl.meals).forEach(m=>{
    out.meals[m] = tpl.meals[m].map(it=>({n:it.n, g:Math.round(it.g*ratio)}));
  });
  return out;
}

function mealTotal(items){
  let kcal=0, p=0, c=0, f=0;
  items.forEach(it=>{
    const fd = findFood(it.n);
    if(fd){
      const v = foodKcal(fd, it.g);
      kcal+=v.kcal; p+=v.protein; c+=v.carb; f+=v.fat;
    }
  });
  return {kcal, protein:p, carb:c, fat:f};
}

function openRecipe(){
  const id = getCurrentPlanId();
  const profile = loadProfile();
  const hasProfile = profile.gender && profile.age && profile.height && profile.weight;
  if(!id){
    alert("请先选择一个饮食方案");
    go('list');
    return;
  }
  if(!hasProfile){
    alert("请先完善个人信息，才能为你推荐食谱");
    go('calc');
    return;
  }
  recipePlanId = id;
  recipeTplIdx = 0;
  recipeCustom = null;
  buildRecipe();
  go('recipe');
}

function buildRecipe(){
  const profile = loadProfile();
  const target = computeTarget(recipePlanId, profile);
  const goal = planGoal(recipePlanId);
  const tpls = MEAL_TEMPLATES.filter(t=>t.goal===goal);
  const tpl = tpls[recipeTplIdx % tpls.length];

  // 若用户已手动替换，用替换后的；否则用模板
  recipeMeals = recipeCustom ? recipeCustom : scaleTemplate(tpl, profile.weight);

  const plan = PLANS.find(x=>x.id===recipePlanId);
  const totals = ["早餐","午餐","晚餐"].reduce((acc,m)=>{
    const t = mealTotal(recipeMeals.meals[m]);
    acc.kcal+=t.kcal; acc.protein+=t.protein; acc.carb+=t.carb; acc.fat+=t.fat;
    return acc;
  }, {kcal:0,protein:0,carb:0,fat:0});

  const pct = (val, tgt)=> Math.min(100, Math.round(val/tgt*100));

  document.getElementById("recipeBody").innerHTML = `
    <div class="recipe-target-card">
      <div class="rt-label">今日营养目标 · ${plan.name}</div>
      <div class="rt-name">${planGoal(recipePlanId)==="增肌"?"增肌期":"减脂期"}推荐食谱</div>
      <div class="rt-macro">
        <div class="m">碳水<b>${Math.round(target.carb)}g</b></div>
        <div class="m">蛋白<b>${Math.round(target.protein)}g</b></div>
        <div class="m">脂肪<b>${Math.round(target.fat)}g</b></div>
        <div class="m">热量<b>${Math.round(target.kcal)}kcal</b></div>
      </div>
    </div>

    ${tpls.length>1 ? `
    <div class="recipe-tpl-switch" id="recipeTplSwitch">
      ${tpls.map((t,i)=>`<span class="tpl-chip ${i===recipeTplIdx?"on":""}" onclick="switchRecipeTpl(${i})">${t.name}</span>`).join("")}
    </div>` : ""}

    <div id="recipeMeals"></div>

    <div class="recipe-sum" id="recipeSum"></div>

    <button class="btn-primary" style="margin-top:16px;" onclick="openFoodCalc()">用计算器精确核对 / 添加食物</button>
    <button class="add-custom" style="margin-top:10px;" onclick="resetRecipe()">恢复模板推荐</button>
  `;
  renderRecipeMeals();
}

function switchRecipeTpl(i){
  recipeTplIdx = i;
  recipeCustom = null;  // 切换模板时清除手动替换
  buildRecipe();
}

function renderRecipeMeals(){
  const box = document.getElementById("recipeMeals");
  const mealColors = {"早餐":"#F59E0B","午餐":"#4A3FA8","晚餐":"#0F6E56"};
  box.innerHTML = Object.keys(recipeMeals.meals).map(m=>`
    <div class="meal-block">
      <div class="meal-title"><span class="mt-dot" style="background:${mealColors[m]||"#4A3FA8"};"></span>${m}</div>
      ${recipeMeals.meals[m].map(it=>{
        const fd = findFood(it.n);
        const v = fd ? foodKcal(fd, it.g) : {kcal:0,protein:0,carb:0,fat:0};
        return `
        <div class="food-row">
          <div style="flex:1;">
            <div class="fr-name">${it.n}</div>
            <div class="fr-meta">${it.g}g · 蛋白${Math.round(v.protein)}g · 碳水${Math.round(v.carb)}g · 脂肪${Math.round(v.fat)}g</div>
          </div>
          <div class="fr-kcal">${Math.round(v.kcal)} kcal</div>
          <div class="fr-del" onclick="removeMealItem('${m}','${it.n}')" title="移除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </div>
        </div>`;
      }).join("")}
      <div class="food-row" style="border-style:dashed;justify-content:center;color:var(--brand);cursor:pointer;" onclick="addMealItem('${m}')">
        <span style="font-size:13px;font-weight:600;">＋ 添加食物到${m}</span>
      </div>
    </div>`).join("");
  renderRecipeSum();
}

function renderRecipeSum(){
  const target = computeTarget(recipePlanId, loadProfile());
  const totals = ["早餐","午餐","晚餐"].reduce((acc,m)=>{
    const t = mealTotal(recipeMeals.meals[m]);
    acc.kcal+=t.kcal; acc.protein+=t.protein; acc.carb+=t.carb; acc.fat+=t.fat;
    return acc;
  }, {kcal:0,protein:0,carb:0,fat:0});
  const pct = v=>Math.min(100, Math.round(v*100));
  document.getElementById("recipeSum").innerHTML = `
    <div class="rs-item"><div class="n">${Math.round(totals.kcal)}</div><div class="u">热量 kcal</div><div class="bar"><i style="width:${pct(totals.kcal/target.kcal)}%;"></i></div></div>
    <div class="rs-item"><div class="n">${Math.round(totals.carb)}/${Math.round(target.carb)}</div><div class="u">碳水 g</div><div class="bar"><i style="width:${pct(totals.carb/target.carb)}%;"></i></div></div>
    <div class="rs-item"><div class="n">${Math.round(totals.protein)}/${Math.round(target.protein)}</div><div class="u">蛋白 g</div><div class="bar"><i style="width:${pct(totals.protein/target.protein)}%;"></i></div></div>
    <div class="rs-item"><div class="n">${Math.round(totals.fat)}/${Math.round(target.fat)}</div><div class="u">脂肪 g</div><div class="bar"><i style="width:${pct(totals.fat/target.fat)}%;"></i></div></div>
  `;
}

function removeMealItem(meal, name){
  recipeMeals.meals[meal] = recipeMeals.meals[meal].filter(it=>it.n!==name);
  recipeCustom = recipeMeals;
  renderRecipeMeals();
}

function resetRecipe(){
  recipeCustom = null;
  buildRecipe();
}

  const pickerHtml = `
    <div class="food-picker" style="margin-top:6px;">
      <div class="fp-name">添加到「${meal}」</div>
      <div style="margin-bottom:10px;">
        <input id="mealFoodSearch" style="width:100%;padding:10px 14px;border-radius:11px;border:1px solid var(--border);background:var(--card);font-size:14px;outline:none;" placeholder="搜索食物..." oninput="renderMealFoodOptions('${meal}')" />
      </div>
      <div id="mealFoodOptions" style="max-height:200px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        ${foods.slice(0,40).map(f=>`
          <div class="food-item" onclick="pickMealFood('${meal}','${f.name}')">
            <div class="fi-name">${f.name}</div>
            <div class="fi-kcal"><b>${f.kcal}</b> kcal/100g</div>
          </div>`).join("")}
      </div>
      <div class="fp-row" style="margin-top:12px;">
        <input id="mealFoodGrams" type="number" placeholder="克数" value="100" />
        <span class="fp-unit">克</span>
      </div>
      <div class="fp-btns">
        <button class="fp-add" onclick="confirmAddMealFood()">添加</button>
        <button class="fp-cancel" onclick="renderRecipeMeals()">取消</button>
      </div>
    </div>`;
  // 把 picker 插到「添加食物」按钮位置（替换该按钮）
  box.innerHTML = box.innerHTML.replace(
    new RegExp(`(<div class="food-row" style="border-style:dashed;justify-content:center;color:var\\(--brand\\);cursor:pointer;" onclick="addMealItem\\('${meal}'\\)">[\\s\\S]*?<\\/div>)`),
    pickerHtml
  );
  window.pickedMealFood = "";
}

let pickedMealFood = "";
function pickMealFood(meal, name){
  pickedMealFood = name;
  document.querySelectorAll("#mealFoodOptions .food-item").forEach(el=>el.classList.remove("sel"));
  // 简单高亮
}
function renderMealFoodOptions(meal){
  const kw = document.getElementById("mealFoodSearch").value.trim();
  const foods = allFoods().filter(f=>!kw || f.name.includes(kw));
  document.getElementById("mealFoodOptions").innerHTML = foods.slice(0,40).map(f=>`
    <div class="food-item ${pickedMealFood===f.name?"sel":""}" onclick="pickMealFood('${meal}','${f.name}')">
      <div class="fi-name">${f.name}</div>
      <div class="fi-kcal"><b>${f.kcal}</b> kcal/100g</div>
    </div>`).join("");
}
function confirmAddMealFood(){
  const name = pickedMealFood || (document.getElementById("mealFoodSearch") && document.getElementById("mealFoodSearch").value.trim());
  const grams = parseFloat(document.getElementById("mealFoodGrams").value) || 100;
  const fd = findFood(name);
  if(!fd){ alert("请先选择一个食物"); return; }
  recipeMeals.meals[addMealTarget].push({n:name, g:grams});
  recipeCustom = recipeMeals;
  renderRecipeMeals();
}

/* ---- 食物计算器页 ---- */
let foodCat = "全部";
let foodKw = "";
let pickedFood = null;
let foodList = [];        // {name, grams}
let foodPhotos = [];      // 拍照存档（dataURL）

function openFoodCalc(){
  renderFoodCalc();
  go('food');
}

function renderFoodCalc(){
  const cats = ["全部"].concat(Array.from(new Set(allFoods().map(f=>f.category))));
  const foods = allFoods().filter(f=>{
    const okCat = foodCat==="全部" || f.category===foodCat;
    const okKw = !foodKw || f.name.includes(foodKw);
    return okCat && okKw;
  });

  document.getElementById("foodBody").innerHTML = `
    <div class="food-search">
      <input id="foodSearchInput" placeholder="搜索食物名称..." value="${foodKw}" oninput="foodKw=this.value;renderFoodCalc()" />
    </div>
    <div class="food-cats">
      ${cats.map(c=>`<span class="food-cat ${c===foodCat?"on":""}" onclick="setFoodCat('${c}')">${c}</span>`).join("")}
    </div>
    <div class="food-grid" id="foodGrid">
      ${foods.map(f=>`
        <div class="food-item ${pickedFood===f.name?"sel":""}" onclick="pickFoodItem('${f.name}')">
          <div class="fi-name">${f.name}</div>
          <div class="fi-kcal"><b>${f.kcal}</b> kcal/100g</div>
          <div class="fi-kcal" style="font-size:11px;">蛋白${f.protein} · 碳水${f.carb} · 脂肪${f.fat}</div>
        </div>`).join("")}
    </div>

    <div id="foodPickerBox"></div>

    <button class="food-photo-btn" onclick="document.getElementById('photoInput').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#26215C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      拍照 / 上传食物图片（存档，暂不自动识别）
    </button>
    <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="addFoodPhotos(this)" />
    <div class="photo-previews" id="photoPreviews"></div>

    <div class="food-list-summary" id="foodListSummary"></div>

    <div class="food-total" id="foodTotal"></div>

    <button class="add-custom" onclick="toggleCustomForm()">＋ 添加自定义食物</button>
    <div id="customFormBox"></div>
  `;

  renderFoodPickerBox();
  renderFoodListSummary();
  renderFoodTotal();
  renderPhotoPreviews();
  renderCustomForm();
}

function setFoodCat(c){ foodCat = c; pickedFood = null; renderFoodCalc(); }

function pickFoodItem(name){
  pickedFood = name;
  renderFoodPickerBox();
  // 更新高亮
  document.querySelectorAll("#foodGrid .food-item").forEach(el=>el.classList.remove("sel"));
  const items = document.querySelectorAll("#foodGrid .food-item");
  items.forEach(el=>{ if(el.querySelector(".fi-name") && el.querySelector(".fi-name").textContent===name) el.classList.add("sel"); });
}

function renderFoodPickerBox(){
  const box = document.getElementById("foodPickerBox");
  if(!box) return;
  if(!pickedFood){
    box.innerHTML = `<div style="font-size:13px;color:var(--sub);text-align:center;padding:8px 0 14px;">点上方食物，输入克数添加到清单</div>`;
    return;
  }
  const fd = findFood(pickedFood);
  box.innerHTML = `
    <div class="food-picker">
      <div class="fp-name">${fd.name} <span style="font-size:12px;color:var(--sub);font-weight:400;">（${fd.kcal} kcal / 100g）</span></div>
      <div class="fp-row">
        <input id="foodGramsInput" type="number" placeholder="克数" value="100" />
        <span class="fp-unit">克</span>
      </div>
      <div class="fp-btns">
        <button class="fp-add" onclick="addFoodToList()">加入清单</button>
        <button class="fp-cancel" onclick="pickedFood=null;renderFoodCalc()">取消</button>
      </div>
    </div>`;
}

function addFoodToList(){
  const grams = parseFloat(document.getElementById("foodGramsInput").value) || 100;
  const fd = findFood(pickedFood);
  if(!fd || grams<=0) return;
  foodList.push({name:fd.name, grams});
  pickedFood = null;
  renderFoodCalc();
}

function removeFoodFromList(i){
  foodList.splice(i,1);
  renderFoodCalc();
}

function renderFoodListSummary(){
  const box = document.getElementById("foodListSummary");
  if(!box) return;
  if(foodList.length===0){
    box.innerHTML = `<div class="fls-t">已选食物</div><div class="fls-empty">还没有添加食物，点上方食物加入清单</div>`;
    return;
  }
  box.innerHTML = `
    <div class="fls-t">已选食物（${foodList.length} 项）</div>
    ${foodList.map((it,i)=>{
      const fd = findFood(it.name);
      const v = foodKcal(fd, it.grams);
      return `
      <div class="food-row" style="padding:10px 14px;">
        <div style="flex:1;">
          <div class="fr-name" style="font-size:13px;">${it.name}</div>
          <div class="fr-meta">${it.grams}g</div>
        </div>
        <div class="fr-kcal" style="font-size:13px;">${Math.round(v.kcal)} kcal</div>
        <div class="fr-del" onclick="removeFoodFromList(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
      </div>`;
    }).join("")}
  `;
}

function renderFoodTotal(){
  const box = document.getElementById("foodTotal");
  if(!box) return;
  let kcal=0, p=0, c=0, f=0;
  foodList.forEach(it=>{
    const fd = findFood(it.name);
    const v = foodKcal(fd, it.grams);
    kcal+=v.kcal; p+=v.protein; c+=v.carb; f+=v.fat;
  });
  box.innerHTML = `
    <div class="ft-item"><div class="n">${Math.round(c)}</div><div class="u">碳水 g</div></div>
    <div class="ft-item"><div class="n">${Math.round(p)}</div><div class="u">蛋白 g</div></div>
    <div class="ft-item"><div class="n">${Math.round(f)}</div><div class="u">脂肪 g</div></div>
    <div class="ft-kcal"><div class="n">${Math.round(kcal)}</div><div class="u">总热量 kcal</div></div>
  `;
}

/* 拍照存档 */
function addFoodPhotos(input){
  const files = Array.from(input.files || []);
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = function(e){
      foodPhotos.push(e.target.result);
      renderPhotoPreviews();
    };
    reader.readAsDataURL(file);
  });
  input.value = "";
}
function renderPhotoPreviews(){
  const box = document.getElementById("photoPreviews");
  if(!box) return;
  box.innerHTML = foodPhotos.map((src,i)=>`
    <div class="pp">
      <img src="${src}" />
      <span class="pp-x" onclick="removePhoto(${i})">×</span>
    </div>`).join("");
}
function removePhoto(i){ foodPhotos.splice(i,1); renderPhotoPreviews(); }

/* 自定义食物 */
let customFormOpen = false;
function toggleCustomForm(){
  customFormOpen = !customFormOpen;
  renderFoodCalc();
}
function renderCustomForm(){
  const box = document.getElementById("customFormBox");
  if(!box) return;
  if(!customFormOpen){ box.innerHTML = ""; return; }
  box.innerHTML = `
    <div class="custom-form">
      <div class="cf-t">添加自定义食物（每 100g）</div>
      <div class="cf-row"><label>食物名称</label><input id="cfName" placeholder="如：红烧鸡腿" /></div>
      <div class="cf-row"><label>分类</label><input id="cfCat" placeholder="如：蛋白质" value="自定义" /></div>
      <div class="cf-grid">
        <div class="cf-row"><label>热量 kcal</label><input id="cfKcal" type="number" placeholder="0" /></div>
        <div class="cf-row"><label>蛋白质 g</label><input id="cfProtein" type="number" placeholder="0" /></div>
        <div class="cf-row"><label>碳水 g</label><input id="cfCarb" type="number" placeholder="0" /></div>
        <div class="cf-row"><label>脂肪 g</label><input id="cfFat" type="number" placeholder="0" /></div>
      </div>
      <div class="fp-btns" style="margin-top:14px;">
        <button class="fp-add" onclick="saveCustomFood()">保存</button>
        <button class="fp-cancel" onclick="toggleCustomForm()">取消</button>
      </div>
    </div>`;
}
function saveCustomFood(){
  const name = document.getElementById("cfName").value.trim();
  const cat = document.getElementById("cfCat").value.trim() || "自定义";
  const kcal = parseFloat(document.getElementById("cfKcal").value) || 0;
  const protein = parseFloat(document.getElementById("cfProtein").value) || 0;
  const carb = parseFloat(document.getElementById("cfCarb").value) || 0;
  const fat = parseFloat(document.getElementById("cfFat").value) || 0;
  if(!name){ alert("请填写食物名称"); return; }
  const list = loadCustomFoods();
  list.push({name, category:cat, kcal, protein, carb, fat});
  saveCustomFoods(list);
  customFormOpen = false;
  alert(`已保存自定义食物「${name}」`);
  renderFoodCalc();
}

/* ===== 初始化 ===== */
renderFilters();
renderCurrentPlan();
</script>
