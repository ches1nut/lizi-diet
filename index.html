<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🌰饮食</title>
<style>
  :root{
    --brand:#26215C;
    --brand-deep:#1B1747;
    --brand-2:#4A3FA8;
    --brand-soft:#EEEDFE;
    --brand-mid:#CECBF6;
    --accent:#F59E0B;
    --bg:#F6F7FB;
    --card:#ffffff;
    --text:#1f2329;
    --sub:#6b7280;
    --border:#E6E8F0;
    --shadow-sm:0 1px 2px rgba(23,25,35,.04), 0 2px 8px rgba(23,25,35,.05);
    --shadow-md:0 4px 12px rgba(23,25,35,.06), 0 12px 32px rgba(38,33,92,.12);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  .page{
    max-width:680px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column;
  }

  /* ===== 顶部导航（首页用） ===== */
  .navbar{
    padding:22px 28px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{
    width:38px; height:38px; border-radius:12px;
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
    display:flex; align-items:center; justify-content:center; font-size:19px;
    box-shadow:0 4px 12px rgba(38,33,92,.28);
  }
  .brand .name{font-size:17px; font-weight:700; letter-spacing:.2px;}
  .me-btn{
    width:38px; height:38px; border-radius:50%;
    border:1px solid var(--border); background:var(--card);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:.15s; box-shadow:var(--shadow-sm);
  }
  .me-btn:hover{border-color:var(--brand); transform:translateY(-1px);}
  .me-btn svg{width:19px; height:19px;}

  /* ===== 页面切换 ===== */
  .screen{display:none;}
  .screen.active{display:block; animation:fade .18s;}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1}}

  /* ===== 首页 ===== */
  .main{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:36px 28px 48px;
  }
  .hero{text-align:center; margin-bottom:30px;}
  .hero h1{font-size:26px; font-weight:700; line-height:1.3; color:var(--text);}
  .hero p{font-size:13px; color:var(--sub); margin-top:8px;}

  /* 当前选择方案卡片 */
  .current-card{
    border-radius:var(--radius); padding:18px 20px; margin-bottom:20px;
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
    color:#fff; cursor:pointer; position:relative; overflow:hidden;
    box-shadow:var(--shadow-md); transition:.18s;
  }
  .current-card:hover{transform:translateY(-2px);}
  .current-card::after{
    content:""; position:absolute; right:-40px; top:-40px; width:140px; height:140px;
    border-radius:50%; background:rgba(255,255,255,.12);
  }
  .current-card .cc-label{
    font-size:11px; letter-spacing:1px; opacity:.85; margin-bottom:6px;
    display:flex; align-items:center; gap:6px;
  }
  .current-card .cc-label .dot{
    width:7px; height:7px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 3px rgba(245,158,11,.3);
  }
  .current-card .cc-name{font-size:19px; font-weight:700; margin-bottom:3px; position:relative; z-index:1;}
  .current-card .cc-sub{font-size:12px; opacity:.9; position:relative; z-index:1;}
  .current-card .cc-arrow{
    position:absolute; right:18px; top:50%; transform:translateY(-50%); z-index:1;
  }
  .current-card .cc-arrow svg{width:20px; height:20px;}

  .current-empty{
    border:1.5px dashed var(--brand-mid); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:20px; background:var(--card);
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    cursor:pointer; transition:.15s;
  }
  .current-empty:hover{border-color:var(--brand); background:var(--brand-soft);}
  .current-empty .ce-t{font-size:14px; font-weight:600; color:var(--text);}
  .current-empty .ce-d{font-size:12px; color:var(--sub); margin-top:2px;}
  .current-empty .ce-arrow{color:var(--brand); flex-shrink:0;}
  .current-empty .ce-arrow svg{width:18px; height:18px;}

  .entries{display:grid; gap:14px;}
  .entry{
    border-radius:var(--radius); padding:22px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    cursor:pointer; text-align:left; transition:.16s;
  }
  .entry .t{font-size:17px; font-weight:700; margin-bottom:6px;}
  .entry .d{font-size:13px; line-height:1.6;}
  .entry .arrow{
    width:48px; height:48px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .entry .arrow svg{width:22px; height:22px;}

  .entry.recommend{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%); color:#fff; border:none;
    box-shadow:var(--shadow-md);}
  .entry.recommend:hover{transform:translateY(-2px);}
  .entry.recommend .d{color:var(--brand-mid);}
  .entry.recommend .arrow{background:rgba(255,255,255,.16);}

  .entry.browse{background:var(--card); border:1px solid var(--border); color:var(--text);
    box-shadow:var(--shadow-sm);}
  .entry.browse:hover{border-color:var(--brand); transform:translateY(-2px);}
  .entry.browse .d{color:var(--sub);}
  .entry.browse .arrow{background:var(--brand-soft);}

  .foot{text-align:center; color:#a6acb8; font-size:12px; padding:0 28px 28px;}

  /* ===== 列表页 ===== */
  .list-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .back-btn{
    width:34px; height:34px; border-radius:10px;
    border:1px solid var(--border); background:var(--card);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition:.15s; box-shadow:var(--shadow-sm);
  }
  .back-btn:hover{border-color:var(--brand);}
  .back-btn svg{width:18px; height:18px;}
  .list-head .title{font-size:16px; font-weight:700;}

  .filters{padding:16px 28px 6px; display:flex; gap:8px; flex-wrap:wrap;}
  .filter{
    font-size:13px; padding:7px 16px; border-radius:18px; cursor:pointer;
    border:1px solid var(--border); background:var(--card); color:var(--sub);
    transition:.15s; font-weight:500;
  }
  .filter.on{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; border-color:transparent; font-weight:600;
    box-shadow:0 4px 10px rgba(38,33,92,.25);}

  .plan-list{padding:14px 28px 100px; display:grid; gap:14px;}
  .plan-card{
    border:1px solid var(--border); border-radius:var(--radius); padding:20px;
    background:var(--card); cursor:pointer; transition:.16s; box-shadow:var(--shadow-sm); position:relative;
  }
  .plan-card:hover{border-color:var(--brand); transform:translateY(-2px); box-shadow:var(--shadow-md);}
  .plan-card .top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px;}
  .plan-card .name{font-size:17px; font-weight:700;}
  .plan-card.sel{border-color:var(--brand); background:var(--brand-soft);}
  .plan-card .chk{
    position:absolute; right:16px; top:16px; width:22px; height:22px; border-radius:7px;
    border:1.5px solid var(--border); background:var(--card); display:flex; align-items:center;
    justify-content:center; transition:.15s; flex-shrink:0; cursor:pointer;
  }
  .plan-card .chk.on{background:var(--brand); border-color:var(--brand);}
  .plan-card .chk svg{width:13px; height:13px; opacity:0; transition:.1s;}
  .plan-card .chk.on svg{opacity:1;}

  /* 底部对比栏 */
  .compare-bar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:40;
    width:calc(100% - 56px); max-width:624px; border-radius:16px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    box-shadow:0 8px 24px rgba(38,33,92,.32);
  }
  .compare-bar .info{font-size:13px; font-weight:500;}
  .compare-bar .info .cnt{font-weight:800; font-size:15px;}
  .compare-bar button{
    padding:9px 20px; border-radius:11px; border:none; background:#fff; color:var(--brand);
    font-size:14px; font-weight:700; cursor:pointer; flex-shrink:0; transition:.15s;
  }
  .compare-bar button:disabled{opacity:.45; cursor:not-allowed;}
  .compare-bar button:not(:disabled):hover{transform:translateY(-1px);}
  .plan-card .desc{font-size:13px; color:var(--sub); line-height:1.6; margin-bottom:12px;}
  .plan-card .tags{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{font-size:11px; padding:3px 9px; border-radius:7px; background:var(--brand-soft); color:var(--brand); font-weight:500;}
  .tag{font-size:11px; padding:3px 9px; border-radius:7px; background:#f3f4f6; color:var(--sub); border:1px solid var(--border);}
  .badge{font-size:11px; padding:3px 10px; border-radius:7px; white-space:nowrap; margin-left:10px; flex-shrink:0; font-weight:600;}
  .source{font-size:11px; color:var(--sub); display:inline-flex; align-items:center; gap:4px;}

  /* ===== 方案详情页 ===== */
  .detail-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .detail-body{padding:24px 28px 40px;}
  .detail-hero{margin-bottom:24px;}
  .detail-hero .name{font-size:23px; font-weight:800; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
  .detail-hero .target{
    font-size:13px; color:var(--brand-deep); background:var(--brand-soft);
    padding:7px 14px; border-radius:10px; display:inline-block; margin-top:8px; font-weight:500;
  }
  .detail-sec{margin-bottom:26px;}
  .detail-sec .h{
    font-size:15px; font-weight:700; margin-bottom:12px;
    display:flex; align-items:center; gap:8px;
  }
  .detail-sec .h::before{
    content:""; width:4px; height:15px; border-radius:2px;
    background:linear-gradient(180deg,var(--brand),var(--brand-2)); display:inline-block;
  }
  .detail-sec .p{font-size:14px; line-height:1.8; color:var(--text);}
  .detail-sec ul{list-style:none; padding:0;}
  .detail-sec li{
    font-size:14px; line-height:1.7; color:var(--text);
    padding:7px 0 7px 20px; position:relative;
  }
  .detail-sec li::before{
    content:""; position:absolute; left:2px; top:16px;
    width:7px; height:7px; border-radius:50%;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
  }
  .param-row{
    display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--border);
  }
  .param-row:last-child{border-bottom:none;}
  .param-row .k{font-size:13px; color:var(--sub); width:84px; flex-shrink:0; font-weight:500;}
  .param-row .v{font-size:14px; color:var(--text); line-height:1.6;}
  .detail-cta{
    position:sticky; bottom:0; padding:14px 28px;
    background:linear-gradient(to top, var(--bg) 70%, rgba(246,247,251,0));
  }
  .detail-cta button{
    width:100%; padding:15px; border-radius:14px; border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
    transition:.15s; box-shadow:var(--shadow-md);
  }
  .detail-cta button:hover{transform:translateY(-1px);}
  .detail-cta .cta-sub{
    display:block; text-align:center; margin-top:10px; font-size:13px; color:var(--brand);
    cursor:pointer; font-weight:600;
  }
  .detail-cta .cta-sub:hover{opacity:.7;}

  /* 适合人群判断提示 */
  .fit-hint{
    display:flex; align-items:flex-start; gap:10px; border-radius:14px;
    padding:14px 16px; margin-bottom:6px; font-size:13px; line-height:1.6;
  }
  .fit-hint .fh-ic{font-size:16px; flex-shrink:0; line-height:1.4;}
  .fit-hint.ok{background:var(--color-background-success); color:#0F6E56;}
  .fit-hint.warn{background:#FFF7E6; color:#A16207;}
  .fit-hint.none{background:var(--brand-soft); color:var(--brand-deep);}
  .fit-hint b{font-weight:700;}
  .compare-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .compare-body{padding:20px 28px 40px; overflow-x:auto;}
  .compare-table{
    width:100%; border-collapse:separate; border-spacing:0; min-width:440px;
    font-size:13px;
  }
  .compare-table th, .compare-table td{
    padding:12px 14px; text-align:left; vertical-align:top;
    border-bottom:1px solid var(--border);
  }
  .compare-table thead th{
    position:sticky; top:0; background:var(--card); z-index:1; font-size:14px;
  }
  .compare-table thead th .pname{font-weight:700; font-size:14px; color:var(--text);}
  .compare-table thead th .psrc{font-size:11px; color:var(--sub); font-weight:400; margin-top:2px;}
  .compare-table tbody th{
    color:var(--sub); font-weight:600; white-space:nowrap; width:92px;
    background:var(--bg); position:sticky; left:0;
  }
  .compare-table td{color:var(--text); line-height:1.6;}
  .compare-table tr:last-child th, .compare-table tr:last-child td{border-bottom:none;}
  .compare-goal-badges{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px;}
  .compare-goal-badges .badge{margin-left:0;}
  .compare-cta{
    position:sticky; bottom:0; padding:14px 28px;
    background:linear-gradient(to top, var(--bg) 70%, rgba(246,247,251,0));
  }
  .compare-cta .btn-row{display:flex; gap:12px;}
  .compare-cta button{
    flex:1; padding:14px; border-radius:14px; border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
    transition:.15s; box-shadow:var(--shadow-md);
  }
  .compare-cta button:hover{transform:translateY(-1px);}

  /* ===== 计算页 ===== */
  .calc-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .calc-body{padding:24px 28px 40px;}
  .calc-plan-name{font-size:22px; font-weight:800; margin-bottom:4px;}
  .calc-plan-source{font-size:12px; color:var(--sub); margin-bottom:20px;}

  .form-group{margin-bottom:18px;}
  .form-group label{font-size:13px; color:var(--sub); display:block; margin-bottom:8px;}
  .form-group label b{color:var(--text); font-weight:600;}
  .form-input{
    width:100%; padding:13px 15px; border-radius:12px;
    border:1px solid var(--border); background:var(--card);
    font-size:15px; color:var(--text); outline:none; transition:.15s;
  }
  .form-input:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(38,33,92,.12);}
  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .seg{display:flex; gap:8px; flex-wrap:wrap;}
  .seg-item{
    padding:10px 16px; border-radius:11px; cursor:pointer;
    border:1px solid var(--border); background:var(--card); color:var(--sub);
    font-size:13px; transition:.15s; font-weight:500;
  }
  .seg-item.on{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; border-color:transparent; font-weight:600;
    box-shadow:0 4px 10px rgba(38,33,92,.25);}

  .profile-tip{
    background:var(--brand-soft); border-radius:14px; padding:14px 18px;
    font-size:13px; color:var(--text); margin-bottom:20px; line-height:1.6;
    border:1px solid var(--brand-mid);
  }
  .profile-tip a{color:var(--brand); font-weight:600; cursor:pointer; text-decoration:none;}

  .result-card{
    border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:14px;
    background:var(--card); box-shadow:var(--shadow-sm);
  }
  .result-card .rc-title{font-size:13px; color:var(--sub); margin-bottom:14px; font-weight:600;}
  .result-macro{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:10px;}
  .macro-item{
    text-align:center; padding:16px 8px; border-radius:14px;
    background:linear-gradient(180deg,var(--brand-soft) 0%,#fff 100%);
    border:1px solid var(--brand-mid);
  }
  .macro-item .num{font-size:26px; font-weight:800; color:var(--brand-deep);}
  .macro-item .unit{font-size:11px; color:var(--sub);}
  .macro-item .lbl{font-size:12px; color:var(--text); margin-top:3px; font-weight:500;}

  /* ===== 问卷页 ===== */
  .quiz-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .quiz-body{padding:24px 28px 40px;}
  .quiz-progress{
    height:6px; border-radius:3px; background:var(--border); margin-bottom:28px; overflow:hidden;
  }
  .quiz-progress .bar{height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-2)); border-radius:3px; transition:.3s;}
  .quiz-q{font-size:21px; font-weight:700; line-height:1.4; margin-bottom:24px;}
  .quiz-opts{display:grid; gap:12px;}
  .quiz-opt{
    border:1px solid var(--border); border-radius:15px; padding:17px 20px;
    cursor:pointer; transition:.15s; font-size:15px; line-height:1.5;
    background:var(--card); box-shadow:var(--shadow-sm);
  }
  .quiz-opt:hover{border-color:var(--brand); background:var(--brand-soft); transform:translateY(-1px);}

  .quiz-result{text-align:center; padding:20px 0;}
  .quiz-result .big{font-size:24px; font-weight:800; margin-bottom:12px;}
  .quiz-result .why{font-size:13px; color:var(--sub); line-height:1.7; margin-bottom:28px; text-align:left;
    background:var(--brand-soft); border-radius:14px; padding:16px 18px; border:1px solid var(--brand-mid);}
  .quiz-result .why b{color:var(--text);}

  /* 备选方案 */
  .quiz-alt{margin:18px 0 24px; text-align:left;}
  .quiz-alt .alt-title{font-size:13px; color:var(--sub); font-weight:600; margin-bottom:10px;}
  .alt-card{
    border:1px solid var(--border); border-radius:13px; padding:13px 15px;
    margin-bottom:8px; cursor:pointer; transition:.15s; background:var(--card);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .alt-card:hover{border-color:var(--brand);}
  .alt-card .ac-name{font-size:14px; font-weight:600; color:var(--text);}
  .alt-card .ac-desc{font-size:12px; color:var(--sub); margin-top:2px; line-height:1.5;}
  .alt-card .ac-arrow{color:var(--brand); flex-shrink:0; font-weight:600;}

  /* ===== 我的面板 ===== */
  .me-head{
    padding:16px 28px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; gap:12px;
  }
  .me-body{padding:24px 28px 40px; max-width:560px; margin:0 auto;}

  .me-section{margin-bottom:26px;}
  .me-section .st{font-size:13px; font-weight:600; color:var(--sub); margin-bottom:10px; padding-left:2px;}
  .me-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden;
  }
  .me-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:15px 18px; font-size:15px;
  }
  .me-row + .me-row{border-top:1px solid var(--border);}
  .me-row .ic{
    width:32px; height:32px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--brand-soft);
  }
  .me-row .ic svg{width:18px; height:18px;}
  .me-row .lbl{color:var(--text); flex:1; text-align:left; display:flex; align-items:center; gap:11px;}
  .me-row .val{color:var(--sub); font-size:14px; max-width:60%; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .me-row .act{color:var(--brand); font-size:14px; cursor:pointer; flex-shrink:0; font-weight:500;}
  .me-row .act:hover{opacity:.7;}
  .me-tip{font-size:12px; color:var(--sub); line-height:1.6; margin-top:8px; padding:0 4px;}
  .me-danger{color:#DC2626;}

  .btn-primary{
    width:100%; padding:14px; border-radius:13px; border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff;
    font-size:15px; font-weight:700; cursor:pointer; transition:.15s;
    box-shadow:var(--shadow-md);
  }
  .btn-primary:hover{transform:translateY(-1px);}

  /* ===== 手机窄屏 ===== */
  @media (max-width:480px){
    .navbar{padding:16px 18px 12px;}
    .brand .logo{width:34px; height:34px; border-radius:11px; font-size:17px;}
    .me-btn{width:34px; height:34px;}
    .main{padding:28px 18px 40px; justify-content:flex-start;}
    .hero{margin-bottom:24px;}
    .hero h1{font-size:24px;}

/* ===== 方案对比选择状态 ===== */
let compareSel = [];  // 当前勾选的方案 id（最多 3 个）
const COMPARE_MAX = 3;

function toggleCompare(id, e){
  e.stopPropagation();  // 阻止触发卡片点击
  const idx = compareSel.indexOf(id);
  if(idx>=0){
    compareSel.splice(idx,1);
  } else {
    if(compareSel.length>=COMPARE_MAX){
      alert(`最多对比 ${COMPARE_MAX} 个方案`);
      return;
    }
    compareSel.push(id);
  }
  renderPlans();
  renderCompareBar();
}

function renderCompareBar(){
  const bar = document.getElementById("compareBar");
  const cnt = document.getElementById("compareCnt");
  const btn = document.getElementById("compareBtn");
  cnt.textContent = compareSel.length;
  bar.style.display = compareSel.length>0 ? "flex" : "none";
  btn.disabled = compareSel.length<2;
}

/* ===== 渲染方案卡片 ===== */
function renderPlans(){
  const box = document.getElementById("planList");
  const list = PLANS.filter(p=>{
    if(curFilter==="全部") return true;
    const goals = p.goals || [p.goal];
    return goals.includes(curFilter);
  });
  if(list.length===0){
    box.innerHTML = `<div style="text-align:center;color:#9aa0a6;font-size:13px;padding:40px 0;">暂无「${curFilter}」方案，敬请期待</div>`;
    return;
  }
  box.innerHTML = list.map(p=>{
    const g = GOAL_STYLE[p.goal] || GOAL_STYLE["减脂"];
    const badges = (p.goals || [p.goal]).map(gk=>{
      const gs = GOAL_STYLE[gk] || GOAL_STYLE["减脂"];
      return `<span class="badge" style="color:${gs.color};background:${gs.bg};margin-left:4px;">${gk}</span>`;
    }).join("");

    <div class="plan-card ${isSel?'sel':''}" onclick="openPlan('${p.id}')">
      <div class="chk ${isSel?'on':''}" onclick="toggleCompare('${p.id}',event)">

  }).join("");
  renderCompareBar();
}

/* ===== 方案对比页 ===== */
function openCompare(){
  const plans = compareSel.map(id=>PLANS.find(x=>x.id===id)).filter(Boolean);
  if(plans.length<2){
    alert("请至少选择 2 个方案进行对比");

  }

}

function renderCompare(plans){
  // 对比维度定义
  const rows = [
    {k:"目标",       get:p=>p.detail.target},
    {k:"碳水",       get:p=>p.compare.carb},
    {k:"蛋白质",     get:p=>p.compare.protein},
    {k:"脂肪",       get:p=>p.compare.fat},
    {k:"训练要求",   get:p=>p.compare.training},
    {k:"执行节奏",   get:p=>p.compare.duration},
    {k:"适合人群",   get:p=>p.detail.who},
  ];

  const thead = `<tr><th></th>${plans.map(p=>`

        return `<span class="badge" style="color:${gs.color};background:${gs.bg};">${gk}</span>`;
      }).join("")}</div>
    </th>`).join("")}</tr>`;

  const tbody = rows.map(r=>`
    <tr>
      <th>${r.k}</th>
      ${plans.map(p=>`<td>${r.get(p)}</td>`).join("")}

function compareStart(id){

/* 详情页「与其他方案对比」：以当前方案为基准，自动带上同目标的其他方案 */
function quickCompare(){
  const base = PLANS.find(x=>x.id===curPlanId);
  if(!base) return;
  const baseGoals = base.goals || [base.goal];
  // 优先选同主目标的其他方案，凑满 2-3 个
  const others = PLANS.filter(x=>x.id!==base.id && (x.goals||[x.goal]).some(g=>baseGoals.includes(g)));
  compareSel = [base.id, ...others.slice(0,2).map(x=>x.id)];
  renderPlans();
  openCompare();
}

/* 适合人群判断：方案训练要求 vs 用户活动水平 */
function buildFitHint(p){
  const profile = loadProfile();
  const act = profile.actLevel;
  const train = (p.compare && p.compare.training) || "";

  // 训练要求 → 建议最低活动水平
  const trainMap = {
    "无门槛": "sed",
    "低": "light",
    "低–中": "light",
    "需配合训练": "mod",
    "高": "high"
  };
  const needLevel = trainMap[train];

  if(!act){
    return `<div class="fit-hint none"><span class="fh-ic">💡</span><div>还没填写你的活动水平。<a onclick="go('me')" style="color:var(--brand);font-weight:600;">去「我的」完善个人信息</a>，我会帮你判断这个方案适不适合你。</div></div>`;
  }

  const lv = {sed:0, light:1, mod:2, high:3};
  const cur = lv[act] ?? 0;
  const need = lv[needLevel] ?? 0;

  if(cur >= need){
    return `<div class="fit-hint ok"><span class="fh-ic">✓</span><div><b>适合你。</b>你的活动水平「${ACT_DESC[act]}」达到这个方案的训练要求（${train}）。</div></div>`;
  } else {
    return `<div class="fit-hint warn"><span class="fh-ic">⚠️</span><div><b>训练要求可能偏高。</b>这个方案需要「${train}」训练量，你目前是「${ACT_DESC[act]}」。若训练跟不上，效果会打折。</div></div>`;
  }
}

function startPlan(){
  const p = PLANS.find(x=>x.id===curPlanId);
  if(!p) return;
  setCurrentPlan(p.id);   // 记为用户当前选择方案
  renderCalc(p);

function renderCalc(p){
  const profile = loadProfile();
  const d = p.detail;
  const hasProfile = profile.gender && profile.age && profile.height && profile.weight;

  // 个人信息区块
  let profileHtml = "";
  if(!hasProfile){
    profileHtml = `
      <div class="profile-tip">
        请先完善你的个人信息（只需填一次，之后切换方案会自动带出）：
        <div style="margin-top:12px;">${renderProfileForm(profile)}</div>
        <button class="btn-primary" style="margin-top:12px;" onclick="saveProfileForm()">保存个人信息</button>
      </div>`;
  } else {
    const al = profile.actLevel ? ACT_DESC[profile.actLevel] : "";
    profileHtml = `
      <div class="profile-tip">
        个人信息：${profile.gender==="male"?"男":"女"} · ${profile.age}岁 · ${profile.height}cm · ${profile.weight}kg${al?" · 活动水平"+al:""}
        <a onclick="editProfile()"> 修改</a>
      </div>`;
  }

  // 方案专属输入区块
  let inputHtml = "";

    inputHtml = p.inputs.map(inp=>{
      if(inp.type==="seg"){
        return `
          <div class="form-group">
            <label><b>${inp.label}</b></label>
            <div class="seg">
              ${inp.options.map((o,i)=>`<div class="seg-item" id="seg_${inp.key}_${o.v}" onclick="pickSeg('${inp.key}','${o.v}')">${o.label}</div>`).join("")}
            </div>
          </div>`;
      }
      return "";
    }).join("");
  }

  document.getElementById("calcBody").innerHTML = `
    <div class="calc-plan-name">${p.name}</div>
    <div class="calc-plan-source">参考来源：${p.source}</div>
    ${profileHtml}
    ${inputHtml}
    <button class="btn-primary" onclick="calcResult('${p.id}')">计算我的营养素</button>
    <div id="calcResult"></div>
  `;
}

function renderProfileForm(profile){
  return PROFILE_FIELDS.map(f=>{
    if(f.type==="seg"){
      return `
        <div class="form-group">
          <label><b>${f.label}</b></label>
          <div class="seg">
            ${f.options.map(o=>`<div class="seg-item ${profile[f.key]===o.v?"on":""}" onclick="pickProfileSeg('${f.key}','${o.v}')">${o.label}</div>`).join("")}

    return `

      </div>`;
  }).join("");
}

function pickProfileSeg(key, v){
  const p = loadProfile();

  renderCalc(PLANS.find(x=>x.id===curPlanId));

function saveProfileForm(){
  const p = loadProfile();

      if(v) p[f.key] = parseFloat(v);

  saveProfile(p);
  renderCalc(PLANS.find(x=>x.id===curPlanId));
}

const segState = {};
function pickSeg(key, v){
  segState[key] = v;
  document.querySelectorAll(`[id^="seg_${key}_"]`).forEach(el=>el.classList.remove("on"));
  document.getElementById(`seg_${key}_${v}`).classList.add("on");
}

/* ===== 计算逻辑 ===== */
function calcResult(id){
  const p = PLANS.find(x=>x.id===id);
  const profile = loadProfile();
  const hasProfile = profile.gender && profile.age && profile.height && profile.weight;

  if(!hasProfile){
    alert("请先完善个人信息");
    return;
  }

  const w = profile.weight; // 体重 kg
  let carb=0, protein=0, fat=0, kcal=0;
  let extra = ""; // 额外说明

  const g = profile.gender;
  const age = profile.age;
  const h = profile.height;

  // 基础代谢 Mifflin-St Jeor
  let bmr = 10*w + 6.25*h - 5*age + (g==="male"?5:-161);

  switch(id){
    case "month3":{
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB["month3"]||{})[tl] || 2.8;
      carb = w * carbK;
      protein = w * 1.5;
      fat = w * 0.7;
      kcal = carb*4 + protein*4 + fat*9;
      extra = `活动水平「${ACT_DESC[tl]}」→ 碳水 ${carbK}g/kg，蛋白 1.5g/kg、脂肪 0.7g/kg 起步，每 10 天只调碳水。`;
      break;
    }
    case "triple-carb":{
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB["triple-carb"]||{})[tl] || 3.0;
      carb = w * carbK;
      protein = w * 1.6;
      fat = w * 0.8;
      kcal = carb*4 + protein*4 + fat*9;
      extra = `活动水平「${ACT_DESC[tl]}」→ 碳水 ${carbK}g/kg，蛋白 1.6g/kg、脂肪 0.8g/kg 固定。`;
      break;
    }
    case "carb-descend":{
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB["carb-descend"]||{})[tl] || 2.8;
      carb = w * carbK;
      protein = w * 1.5;
      fat = w * 0.7;
      kcal = carb*4 + protein*4 + fat*9;
      const ver = segState.version || "dyn";
      extra = `活动水平「${ACT_DESC[tl]}」→ 起始碳水 ${carbK}g/kg，蛋白 1.5g/kg 渐升、脂肪 0.7g/kg。版本：${ver==="dyn"?"三个月动态版（90天）":"40天冲刺版"}。每 10 天复盘渐降。`;
      break;
    }
    case "five32":{
      const base = segState.base || "big";
      const act = profile.actLevel || "sed";
      const defOpt = p.inputs[0].options.find(o=>o.v===base);
      const deficit = defOpt ? defOpt.deficit : 500;
      const actK = ACT_FACTOR[act] || 1.2;
      const tdee = bmr * actK;
      const intake = tdee - deficit;
      carb = intake * 0.5 / 4;
      protein = intake * 0.3 / 4;
      fat = intake * 0.2 / 9;
      kcal = intake;
      extra = `总消耗≈${Math.round(tdee)} 大卡（BMR ${Math.round(bmr)}×活动系数 ${actK}），${base==="big"?"大基数":"小基数"}减 ${deficit} 大卡缺口，按 5:3:2 分配。`;
      break;
    }
    case "kai-carb-cycle":{
      const bt = segState.bodyType || "endo";
      const opt = p.inputs[0].options.find(o=>o.v===bt);
      const carbK = opt.carb, fatK = opt.fat;
      carb = w * carbK;
      fat = w * fatK;
      protein = w * 1.0;
      kcal = carb*4 + protein*4 + fat*9;
      extra = `${opt.label}：碳水 ${carbK}g/kg、脂肪 ${fatK}g/kg、蛋白按 1g/kg 起步。一周 = 2 高碳 + 3 中碳 + 2 低碳（蛋白每天不变）。`;
      break;
    }
    case "dietary-guideline":{
      const act = profile.actLevel || "sed";
      const actK = ACT_FACTOR[act] || 1.2;
      const tdee = bmr * actK;
      kcal = tdee;
      carb = tdee * 0.575 / 4;  // 碳水取中值 57.5%
      protein = tdee * 0.125 / 4; // 蛋白取中值 12.5%
      fat = tdee * 0.25 / 9;    // 脂肪取中值 25%
      extra = `按总能量 ${Math.round(tdee)} 大卡，供能比取中值：碳水 57.5%、蛋白 12.5%、脂肪 25%（官方区间 50–65%/10–15%/20–30%）。`;
      break;
    }
    case "zengji-jianzhi":{
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB["zengji-jianzhi"]||{})[tl] || 3.0;
      const actK = ACT_FACTOR[tl] || 1.55;
      const tdee = bmr * actK;
      const deficit = 250;  // 200–300 取中值
      const intake = tdee - deficit;
      carb = w * carbK;
      protein = w * 1.6;      // 1.2–2 取中值
      fat = w * 0.7;          // 0.6–0.8 取中值
      kcal = intake;
      extra = `活动水平「${ACT_DESC[tl]}」→ 碳水 ${carbK}g/kg。总消耗≈${Math.round(tdee)} 大卡（BMR ${Math.round(bmr)}×活动系数 ${actK}），扣 200–300 小缺口后摄入≈${Math.round(intake)} 大卡，蛋白 1.6g/kg、脂肪 0.7g/kg 起步。核心：小缺口 + 保训练强度，力量涨肌肉就在长。`;
      break;
    }
  }

  document.getElementById("calcResult").innerHTML = `
    <div class="result-card">
      <div class="rc-title">每日营养素目标</div>
      <div class="result-macro">
        <div class="macro-item"><div class="num">${Math.round(carb)}</div><div class="unit">克/天</div><div class="lbl">碳水化合物</div></div>
        <div class="macro-item"><div class="num">${Math.round(protein)}</div><div class="unit">克/天</div><div class="lbl">蛋白质</div></div>
        <div class="macro-item"><div class="num">${Math.round(fat)}</div><div class="unit">克/天</div><div class="lbl">脂肪</div></div>
      </div>
      <div style="text-align:center;font-size:13px;color:var(--sub);">总热量 ≈ ${Math.round(kcal)} 大卡/天</div>
    </div>
    <div class="result-card" style="background:var(--brand-soft);border-color:transparent;">
      <div class="rc-title">说明</div>
      <div style="font-size:13px;color:var(--text);line-height:1.7;">${extra}</div>
    </div>
  `;
}

// 公共前置题：目标 + 个人信息（性别/年龄/身高/体重/活动水平）
const QUIZ_ENTRY = {
  q:"你的首要目标是什么？",
  type:"seg",
  opts:[
    {v:"lose", label:"减脂（想掉秤、降体脂）"},

};

// 个人信息题（第 2~6 题，三目标通用，填完即写入个人信息）
const QUIZ_INFO = [
  {key:"gender", q:"你的性别是？", type:"seg", opts:[
    {v:"male", label:"男"}, {v:"female", label:"女"}
  ]},
  {key:"age", q:"你的年龄是？", type:"num", unit:"岁"},
  {key:"height", q:"你的身高是？", type:"num", unit:"cm"},
  {key:"weight", q:"你的体重是？", type:"num", unit:"kg"},

    {v:"sed",   label:"久坐 · 几乎不练"},
    {v:"light", label:"轻度 · 每周 1–2 练"},
    {v:"mod",   label:"中度 · 每周 3–4 练"},
    {v:"high",  label:"高强度 · 每周 5 练以上"}
  ]}
];

// 各目标分支的专属题目（个人信息题之后按目标进入对应分支）
const QUIZ_FLOW = {
  lose: [
    {
      q:"你现在减脂遇到什么情况？",
      opts:[
        {v:"first", label:"第一次减脂，不太懂怎么吃"},
        {v:"stuck", label:"减了一段时间卡住了（平台期）"},
        {v:"rebound", label:"之前低碳减，状态差、容易反弹"},
        {v:"na", label:"没在减脂 / 不适用"}
      ]
    },
    {
      q:"你更想要哪种执行方式？",
      opts:[
        {v:"simple", label:"有模板照着吃，越简单越好"},
        {v:"precise", label:"按数字精确计算，步骤清晰"},
        {v:"flexible", label:"灵活调整，能长期坚持"}
      ]
    }
  ],
  // 增肌：目前只有一个方案，填完个人信息后直接出结果；后续补充增肌方案后在此加入增肌专属题目
  muscle: [],
  // 日常健康：填完个人信息后直接推荐膳食指南
  health: []
};

let quizIdx = 0;
const quizAns = {};
let quizGoal = null;   // 当前分支：lose / muscle / health
let quizList = [];     // 当前分支的专属题目列表

function goRecommend(){
  quizIdx = 0;
  quizGoal = null;
  quizList = [];
  Object.keys(quizAns).forEach(k=>delete quizAns[k]);
  renderQuiz();
  go('quiz');
}

function renderQuiz(){
  // 总题数 = 1(目标) + QUIZ_INFO.length(个人信息) + quizList.length(分支)
  const total = 1 + QUIZ_INFO.length + quizList.length;
  if(quizIdx >= total){
    renderQuizResult();
    return;
  }
  let item;
  if(quizIdx === 0) item = QUIZ_ENTRY;
  else if(quizIdx <= QUIZ_INFO.length) item = QUIZ_INFO[quizIdx - 1];
  else item = quizList[quizIdx - 1 - QUIZ_INFO.length];

  const progress = Math.round((quizIdx/total)*100);

  if(item.type === "num"){
    // 数字输入题
    document.getElementById("quizBody").innerHTML = `
      <div class="quiz-progress"><div class="bar" style="width:${progress}%"></div></div>
      <div class="quiz-q">${item.q}</div>
      <input class="form-input" type="number" id="quizNum" inputmode="decimal" placeholder="${item.unit}" style="font-size:18px;padding:14px;" />
      <button class="btn-primary" style="margin-top:16px;" onclick="submitQuizNum('${item.key}')">下一步</button>
    `;
  } else {
    // 选择题
    document.getElementById("quizBody").innerHTML = `
      <div class="quiz-progress"><div class="bar" style="width:${progress}%"></div></div>
      <div class="quiz-q">${item.q}</div>
      <div class="quiz-opts">
        ${item.opts.map(o=>`<div class="quiz-opt" onclick="pickQuiz('${o.v}')">${o.label}</div>`).join("")}
      </div>
    `;
  }
}

function pickQuiz(v){
  if(quizIdx === 0){
    // 第 1 题：目标，切换分支
    quizGoal = v;
    quizList = QUIZ_FLOW[v] || [];
    quizAns["goal"] = v;
  } else if(quizIdx <= QUIZ_INFO.length){
    // 个人信息题（seg 型）：记录并写入个人信息
    const info = QUIZ_INFO[quizIdx - 1];
    quizAns[info.key] = v;
    const p = loadProfile();
    p[info.key] = v;
    saveProfile(p);
  } else {
    quizAns[quizList[quizIdx - 1 - QUIZ_INFO.length].q] = v;
  }
  quizIdx++;
  renderQuiz();
}

function submitQuizNum(key){
  const v = document.getElementById("quizNum").value;
  if(v === "" || v === null){
    return; // 未填不跳转
  }
  quizAns[key] = parseFloat(v);
  const p = loadProfile();
  p[key] = parseFloat(v);
  saveProfile(p);
  quizIdx++;
  renderQuiz();
}

function renderQuizResult(){
  const rec = recommendPlan();
  const p = PLANS.find(x=>x.id===rec.id);
  const g = GOAL_STYLE[p.goal] || GOAL_STYLE["减脂"];

  // 备选方案：同目标下、非主推荐的方案（取 2 个）
  const mainGoals = p.goals || [p.goal];
  const alts = PLANS.filter(x=>x.id!==p.id && (x.goals||[x.goal]).some(gk=>mainGoals.includes(gk))).slice(0,2);

  const altHtml = alts.length>0 ? `
    <div class="quiz-alt">
      <div class="alt-title">也可以看看这些：</div>
      ${alts.map(a=>`
        <div class="alt-card" onclick="setCurrentPlan('${a.id}');openPlan('${a.id}')">
          <div>
            <div class="ac-name">${a.name}</div>
            <div class="ac-desc">${a.desc}</div>
          </div>
          <span class="ac-arrow">›</span>
        </div>`).join("")}
    </div>` : "";

  document.getElementById("quizBody").innerHTML = `
    <div class="quiz-result">
      <div class="big">推荐你试试：${p.name}</div>
      <div style="margin-bottom:20px;">
        <span class="badge" style="color:${g.color};background:${g.bg};">${p.goal}</span>
      </div>
      <div class="why">
        <b>为什么推荐它：</b><br>${rec.reason}
      </div>
      <button class="btn-primary" onclick="setCurrentPlan('${p.id}');openPlan('${p.id}')">查看方案详情</button>
      ${altHtml}
      <button class="form-input" style="margin-top:12px;background:var(--card);color:var(--brand);border:1px solid var(--brand);cursor:pointer;" onclick="goRecommend()">重新测一次</button>
    </div>
  `;
}

function recommendPlan(){
  const goal = quizAns["goal"];

  // 日常健康 → 膳食指南（直接出结果）
  if(goal==="health"){
    return {id:"dietary-guideline", reason:"你想吃得均衡健康，中国居民膳食指南是最通用的营养基线，无需训练门槛，所有人都适用。"};
  }
  // 增肌 → 增肌减脂同步法
  if(goal==="muscle"){
    return {id:"zengji-jianzhi", reason:"你想增肌，谭成义增肌减脂同步法用小缺口+保训练强度，力量在涨肌肉就在长，同时不挨饿不掉肌肉，适合有训练基础、想边增边减的你。"};
  }
  // 减脂分支
  if(goal==="lose"){
    const act = quizAns["actLevel"];
    const stuck = quizAns["你现在减脂遇到什么情况？"];
    const style = quizAns["你更想要哪种执行方式？"];

    // 训练强度高 + 之前低碳反弹 → 三倍碳水
    if(act==="high" && stuck==="rebound"){
      return {id:"triple-carb", reason:"你训练强度高、但之前低碳减脂状态差易反弹，三倍碳水法靠高碳水支撑高强度训练，用训练消耗制造缺口，适合你。"};
    }
    // 训练强度高 → 三倍碳水
    if(act==="high"){
      return {id:"triple-carb", reason:"你训练强度高，三倍碳水法用高碳水提状态、靠训练消耗制造缺口，正好发挥你的训练能力。"};
    }
    // 平台期 → 碳水渐降
    if(stuck==="stuck"){
      return {id:"carb-descend", reason:"你卡在平台期，碳水渐降法从较高碳水逐步降低、穿插高碳日，给身体适应时间，长期可持续、不易反弹。"};
    }
    // 第一次减脂 + 想要简单 → 三个月减脂计划
    if(stuck==="first" || style==="simple"){
      return {id:"month3", reason:"你有完整模板照着吃，每 10 天只调碳水，简单直接，最适合减脂新手稳稳掉秤。"};
    }
    // 大基数/想要精确 → 532
    if(style==="precise"){
      return {id:"five32", reason:"你喜欢按数字精确执行，532 碳水渐降法计算步骤清晰、每周复盘调碳水，大基数也友好。"};
    }
    // 想长期坚持 → 碳水渐降
    if(style==="flexible"){
      return {id:"carb-descend", reason:"你想灵活调整、长期坚持，碳水渐降法循序渐进、穿插高碳日，可持续性强、不易反弹。"};
    }
    // 默认
    return {id:"month3", reason:"你有完整模板照着吃，每 10 天只调碳水，简单直接，适合减脂稳稳掉秤。"};
  }
  return {id:"month3", reason:"推荐你从三个月减脂计划开始，有完整模板照着吃，简单直接。"};
}

          <div class="me-row"><span class="lbl"><span class="ic">${ICONS.gender}</span>性别</span><span class="val">${genderTxt}</span></div>
          <div class="me-row"><span class="lbl"><span class="ic">${ICONS.age}</span>年龄</span><span class="val">${p.age?p.age+" 岁":"未填写"}</span></div>
          <div class="me-row"><span class="lbl"><span class="ic">${ICONS.height}</span>身高</span><span class="val">${p.height?p.height+" cm":"未填写"}</span></div>
          <div class="me-row"><span class="lbl"><span class="ic">${ICONS.weight}</span>体重</span><span class="val">${p.weight?p.weight+" kg":"未填写"}</span></div>
          <div class="me-row"><span class="lbl"><span class="ic">${ICONS.activity}</span>活动水平</span><span class="val">${actTxt}</span></div>
          <div class="me-row"><span class="lbl"></span><span class="act" onclick="editMeProfile()">编辑</span></div>
        ` : `
          <div class="me-row"><span class="lbl">尚未填写个人信息</span><span class="act" onclick="editMeProfile()">去填写</span></div>
        `}
      </div>
    </div>

    <div class="me-section">
      <div class="st">数据管理</div>
      <div class="me-card">
        <div class="me-row"><span class="lbl"><span class="ic">${ICONS.export}</span>导出数据</span><span class="act" onclick="exportData()">导出</span></div>
        <div class="me-row"><span class="lbl"><span class="ic">${ICONS.import}</span>导入数据</span><span class="act" onclick="document.getElementById('importFile').click()">导入</span></div>
        <div class="me-row"><span class="lbl"><span class="ic">${ICONS.trash}</span><span class="me-danger">清空数据</span></span><span class="act me-danger" onclick="confirmClear()">清空</span></div>
      </div>
      <div class="me-tip">导出为 JSON 文件，换设备或分享给他人时，导入即可恢复你的个人信息。</div>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(this)" />
    </div>

    <div class="me-section">
      <div class="st">关于</div>
      <div class="me-card">
        <div class="me-row"><span class="lbl"><span class="ic">${ICONS.logo}</span>🌰饮食</span><span class="val">v0.1</span></div>
        <div class="me-row"><span class="lbl"><span class="ic">${ICONS.book}</span>方案数据来源</span><span class="val">谭成义、凯圣王等公开教学 + 中国居民膳食指南</span></div>
      </div>
    </div>
  `;
}

function editMeProfile(){
  const p = loadProfile();
  document.getElementById("meProfileSection").innerHTML = `
    <div class="st">编辑个人信息</div>
    <div class="me-card">
      <div style="padding:15px 18px;">${renderProfileForm(p)}</div>
      <div class="me-row">
        <span class="lbl"></span>
        <span class="act" onclick="saveMeProfile()">保存</span>
      </div>
    </div>
  `;
}

function saveMeProfile(){
  const p = loadProfile();
  PROFILE_FIELDS.forEach(f=>{
    if(f.type==="num"){
      const v = document.getElementById("profile_"+f.key).value;
      if(v) p[f.key] = parseFloat(v);
    }
  });
  saveProfile(p);
  renderMe();
}

function exportData(){
  const data = {
    app:"lizi-diet",
    version:1,
    exportedAt:new Date().toISOString(),
    profile:loadProfile()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "lizi-diet-数据备份.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      const profile = data.profile || data;
      if(profile && typeof profile === "object"){
        // 只导入合法的个人信息字段
        const p = loadProfile();
        PROFILE_FIELDS.forEach(f=>{
          if(profile[f.key] !== undefined) p[f.key] = profile[f.key];
        });
        saveProfile(p);
        renderMe();
        alert("导入成功，个人信息已更新。");
      } else {
        alert("文件格式不正确，未能导入。");
      }
    }catch(err){
      alert("文件解析失败，请确认是有效的 JSON 备份文件。");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

function confirmClear(){
  if(confirm("确定要清空所有本地数据吗？此操作不可恢复。")){
    localStorage.removeItem(PROFILE_KEY);
    renderMe();
    alert("已清空本地数据。");
  }
}

function showMePlaceholder(){}

/* ===== 初始化 ===== */
renderFilters();
renderCurrentPlan();
</script>
