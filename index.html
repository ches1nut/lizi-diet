   枚举全池后抓到的真实误伤（每条都有实例，不是假想）：
     - 卷心菜/空心菜/菜心 含「心」、血糯米 含「血」、豆腐脑 含「脑」、火腿肠 含「肠」→ 都不是内脏
     - 牛肝菌/羊肚菌 含「牛」「肝」「肚」→ 是菌菇不是牛杂/内脏
     - 鸡腿菇 含「鸡」→ 是菌菇不是禽肉
     - 杏鲍菇 含「鲍」→ 是菌菇不是海鲜
     - 螺丝椒 含「螺」→ 是辣椒不是海螺
     - 鸡蛋/鸭蛋/鹌鹑蛋/素鸡 含「鸡」「鸭」→ 分别归「蛋」类和豆制品
     - 乳清蛋白粉 含「蛋」→ 是乳制品，完全不含蛋成分 */
const AVOID_EXCLUDE = {
  "内脏":  ["卷心菜","空心菜","菜心","血糯米","豆腐脑","火腿肠","牛肝菌","羊肚菌"],
  "牛肉":  ["牛肝菌"],
  "禽类":  ["鸡蛋","鸭蛋","鹌鹑蛋","素鸡","鸡腿菇"],
  "海鲜":  ["螺丝椒","杏鲍菇"],
  "蛋":    ["乳清蛋白粉","蛋白粉"],
};

/* 该食物是否命中任一忌口项 */
function isAvoided(food, avoidList){
  if(!avoidList || !avoidList.length || !food) return false;
  const name = food.name || "";
  return avoidList.some(k => {
    const kws = AVOID_OPTIONS[k] || [];
    if(!kws.some(kw => name.includes(kw))) return false;   // 没命中关键词 → 不属于该类
    const ex = AVOID_EXCLUDE[k] || [];
    return !ex.some(e => name.includes(e));               // 命中误伤排除词 → 也不算
  });
}

/* 目标归一化：computeTarget 出来的是浮点（carb 218.4 / fat 54.6），
   直接拿去生成会出现「日常"是小数、训练日是整数」的口径不一致。
   统一取整；碳水由残差反解配平（而非直接四舍五入），
   这样既能保住供能比——蛋白/脂肪取整后碳水只差 1g 左右——又能让
   protein×4 + carb×4 + fat×9 ≈ kcal 自洽（漂移 ≤2 kcal）。
   注意：入参的 carb 会被忽略，它只是中间的配平项。 */
function normalizeTarget(t){
  const kcal = Math.round(t.kcal);
  const protein = Math.round(t.protein);
  const fat = Math.round(t.fat);
  const carb = Math.round((kcal - protein * 4 - fat * 9) / 4);
  return { kcal, protein, carb, fat };
}

/* 训练日/休息日：按倍数调整全天热量，差额全部由碳水承担，
   保证 protein×4 + carb×4 + fat×9 === kcal 自洽（否则目标本身就自相矛盾） */
const DAY_TYPE_FACTOR = { "日常":1.0, "训练日":1.08, "休息日":0.95 };
function applyDayType(target, dayType){
  const k = DAY_TYPE_FACTOR[dayType];
  // 倍数 1（日常）/ 非法值：不调整热量，但仍要走归一化，保证与训练日同一口径
  if(!k || k === 1) return normalizeTarget(target);
  const kcal = target.kcal * k;
  const carb = (kcal - target.protein * 4 - target.fat * 9) / 4;
  if(!(carb > 0)) return normalizeTarget(target); // 兜底：调整后碳水为负说明该目标不适合再调
  return normalizeTarget({ kcal, protein: target.protein, carb, fat: target.fat });
}

/* 自定义全天热量：按比例等比缩放三大营养素，保持原有供能比 */
function applyCustomKcal(target, customKcal){
  const v = Number(customKcal);
  if(!v || !(v > 0)) return target;
  const k = v / target.kcal;
  return normalizeTarget({
    kcal: v,
    protein: target.protein * k,
    carb: target.carb * k,
    fat: target.fat * k
  });
}

/* 生成用的最终目标：方案目标 → 自定义热量覆盖 → 训练日/休息日调整 */
function recipeTarget(){
  const base = computeTarget(recipePlanId, loadProfile());
  return applyDayType(applyCustomKcal(base, recipePref.customKcal), recipePref.dayType);
}

/* ── 今日执行状态（生成→执行闭环）────────────────────────────────
   与「今日摄入」是两件事，不要混：
     · 今日摄入 = 真实吃掉的克数（dailyIntakeSummary，用户逐项记）
     · 今日执行 = 这份推荐计划执行到哪一餐了（按餐打勾）
   按日期存储，跨天自动视为全新，不需要任何清理逻辑。 */
const RECIPE_DONE_KEY = "lizi_recipe_done";
function loadRecipeDone(){
  const fresh = { date: todayStr(), meals:{} };
  try{
    const raw = localStorage.getItem(RECIPE_DONE_KEY);
    if(!raw) return fresh;
    const d = JSON.parse(raw);
    // 日期不符（昨天的勾）或结构损坏 → 一律当全新的一天
    if(!d || d.date !== fresh.date || !d.meals || typeof d.meals !== "object") return fresh;
    return { date: d.date, meals: d.meals };
  }catch(e){ return fresh; }
}
function saveRecipeDone(d){
  try{ localStorage.setItem(RECIPE_DONE_KEY, JSON.stringify(d)); }catch(e){}
}
function isMealDone(meal){ return !!loadRecipeDone().meals[meal]; }
function markMealDone(meal, on){
  const d = loadRecipeDone();
  if(on) d.meals[meal] = true; else delete d.meals[meal];
  saveRecipeDone(d);
}
function toggleMealDone(meal){
  markMealDone(meal, !isMealDone(meal));
  renderRecipeMeals();   // 局部重绘，顺带刷新执行条；不整页重建，避免滚动跳回顶部
}

/* 剩余额度：全 App 统一口径，避免各处自己算正负号（「还能吃 800」/「已超 120」） */
function remainingOf(targetKcal, eatenKcal){
  const remain = Math.round(targetKcal) - Math.round(eatenKcal);
  return { remain, over: remain < 0, abs: Math.abs(remain) };
}

/* 「今日执行」进度条：计划执行到几餐 + 今天还能吃多少
   这是「生成」与「执行」的接合点 —— 计划不再是看完就丢的一页纸 */
function renderExecBar(){
  const box = document.getElementById("execBar");
  if(!box || !recipeMeals || !recipeMeals.meals) return;
  // 只把「有食物」的餐次算进分母：加餐默认为空，
  // 若算进 1/4，用户没加加餐时进度就永远到不了 100%
  const planned = MEAL_ORDER.filter(m => (recipeMeals.meals[m] || []).length > 0);
  const doneMap = loadRecipeDone().meals;
  const doneCount = planned.filter(m => doneMap[m]).length;
  const target = recipeTarget();
  const eaten = dailyIntakeSummary().kcal;
  const r = remainingOf(target.kcal, eaten);
  const pct = target.kcal > 0 ? Math.min(100, Math.round(eaten / target.kcal * 100)) : 0;
  const chips = planned.map(m =>
    `<span class="exec-chip ${doneMap[m]?"on":""}">${m}${doneMap[m]?" ✓":""}</span>`).join("");
  box.innerHTML = `
    <div class="exec-top">
      <span class="exec-title">今天执行 <b>${doneCount}/${planned.length}</b> 餐${doneCount>=planned.length && planned.length ? " 🎉" : ""}</span>
      <span class="exec-remain ${r.over?"over":""}">${r.over?"已超":"还能吃"} <b>${r.abs}</b> kcal</span>
    </div>
    <div class="exec-track"><i class="${r.over?"over":""}" style="width:${pct}%;"></i></div>
    <div class="exec-chips">${chips}</div>`;
  // 「还能吃」与「补点什么」必须同屏同口径，所以在这里一起刷新 ——
  // 分开两处调用迟早会漏掉一处，出现「执行条说还剩 400，建议块按 800 给量」
  renderFillSuggest();
}

/* ===== 「接下来补点什么」：把剩余额度翻译成具体食物 =====
   为什么是「一次加菜/加餐的量」而不是「按缺口反算」：
     用户今天什么都没记时，缺口 = 全天目标（1900 kcal），按缺口反算会得出
     「吃 500g 鸡胸」这种荒谬建议。所以缺口只用来决定取份量区间的上界还是下界，
     克数恒定夹在 [半份, 1.5 份]（份量参照 PORTIONS），保证永远是「能立刻执行的一口」。
   为什么啥都没记时不给建议：
     没有任何输入时「该补什么」只能把计划复述一遍，等于废话。改为引导去记录。
   为什么池子按类目划分、不写食物名单：
     名单会随食物库漂移 —— HIGH_FAT_PROTEIN 写「五花肉（熟）」而库里叫「猪五花肉（生）」，
     于是减脂餐曾抽出五花肉。这里只用 schema 的 category + 营养密度做判据。
   为什么复用 FOOD_POOLS 的关键词表：
     「建议里能出现的类别」与「食谱里能选的肉/蛋白偏好」必须永远同一套，
     否则会出现「食谱里选了『虾蟹贝』，建议却给牛肉」。 */

let fillSuggestItems = [];   // 当前展示的 3 条建议（点「＋加入」时按下标取）

/* 每 100g 的营养（区间取中值；按份产品不参与建议，见 suggestPools） */
function nutri100(f){
  return { kcal: mid(f.kcal), protein: mid(f.protein), carb: mid(f.carb), fat: mid(f.fat) };
}
/* 蛋白密度：每 100 kcal 能提供多少克蛋白。与 generateMeals 里的同名判据同源 */
function proteinDensity(f){
  const v = nutri100(f);
  return v.kcal > 0 ? v.protein / v.kcal * 100 : 0;
}
/* 去掉括号后的「主词」：虾（熟）/ 龙虾（熟）→ 虾 / 龙虾，用于互含去重 */
function coreName(f){
  return String((f && f.name) || "").replace(/[（(][^）)]*[）)]/g, "").trim();
}
/* 所属大类：直接复用偏好关键词表的匹配规则（先排排除词，再按包含词命中） */
function classOf(f, keyMap, keys){
  const name = (f && f.name) || "";
  for(const k of keys){
    const rule = keyMap[k];
    if(!rule) continue;
    if((rule.exclude || []).some(e => name.includes(e))) continue;
    if((rule.kw || []).some(kw => name.includes(kw))) return k;
  }
  return "";
}
/* 同类只留一条代表（类内取分值最高的），再按分值排序取前 n 条，
   最后按「主词互含」去重 —— 虾（熟）/ 龙虾（熟）/ 皮皮虾（熟）是同一家人的不同写法，
   同时出现三条等于刷屏；而鳕鱼 vs 龙利鱼这种互不包含的会各自保留。 */
function pickRepresentatives(pool, classFn, scoreFn, n){
  const bestOf = new Map();
  pool.forEach(f=>{
    const c = classFn(f) || ("\u0000" + f.name);   // 无类目的各自成类，交给互含去重兜底
    const cur = bestOf.get(c);
    if(!cur || scoreFn(f) > scoreFn(cur)) bestOf.set(c, f);
  });
  const reps = Array.from(bestOf.values()).sort((a, b)=>{
    // 有明确大类的优先 —— 它们正是食谱页「肉/蛋白」「主食」偏好里能选到的主力食材；
    // 长尾（兔肉/鹿肉/鹌鹑肉这类没有任何偏好类能覆盖的）排后面，
    // 否则「补蛋白」会一本正经地建议吃兔肉。
    const ca = classFn(a) ? 1 : 0, cb = classFn(b) ? 1 : 0;
    return (cb - ca) || (scoreFn(b) - scoreFn(a));
  });
  const out = [];
  for(const f of reps){
    if(out.length >= n) break;
    const c = coreName(f);
    if(out.some(o=>{ const oc = coreName(o); return oc.includes(c) || c.includes(oc); })) continue;
    out.push(f);
  }
  return out;
}
/* 一次建议的克数：缺口只决定取区间上界还是下界，不直接反算（见上方说明）。
   区间：[半份, 1.5 份]；没有份量参照的用 [50g, 150g]。
   400 kcal 是单次建议的热量天花板 —— 再多就不叫「补一口」，叫「加一顿饭」。
   算法：先瞄准缺口的一半并封顶 400，再夹进区间。 */
const SUGGEST_MAX_KCAL = 400;
function suggestGrams(f, gapKcal){
  const v = nutri100(f);
  if(!(v.kcal > 0)) return 0;
  const p = (typeof PORTIONS !== "undefined") ? PORTIONS[f.name] : null;
  const lo = p ? p.g * 0.5 : 50;
  const hi = p ? p.g * 1.5 : 150;
  let g = Math.min(Math.max(gapKcal, 0) * 0.5, SUGGEST_MAX_KCAL) / (v.kcal / 100);
  g = (g >= 50) ? Math.round(g / 10) * 10 : Math.round(g / 5) * 5;
  return Math.round(Math.max(lo, Math.min(hi, g)));
}
/* 两个候选池，全部按 schema 类目 + 营养密度划，不写食物名单。
   protein：每 100g 热量 ≤220（排除肥肉/油脂/坚果）、每 100g 蛋白 ≥15（排除血制品、
            鸡蛋清这类「密度高但一份蛋白量太少」的）、且每 100 kcal ≥10g 蛋白。
   carb   ：每 100g 热量 ≤200、每 100g 碳水落在 15~26g。
            这个区间就是「熟制主食」的位置：米饭 25.5、意大利面 25、玉米 23、红薯 21。
            超过 26g 的必然是糯米/脱水/压缩制品 —— 糯米（熟）27、年糕 33、干百合 38、
            糯米饭 40、干燕麦 61 —— 它们碳水密度看着最高，但一碗就接近 400 kcal，
            升糖也快，不适合当「补一口」的建议。
            （代价：馒头/面包这类 100g 就有 40g+ 碳水的主食被挡在外面。可接受 ——
             「补主食」用碗/份给量时，米饭面条比馒头更能算准。）
   两个池都额外要求「一份 ≥30g」：馄饨/饺子这种 20g 一件的，按「份」给量会算成
   「加 1 个半馄饨 · 58 kcal」，不成句子。没有份量参照的按 30–150g 给量，不受此限。
   两个池都先过忌口（含用户自建食物，因为走的是 allFoods()）。
   ⚠ carb 池带兜底：万一以后食物库调整导致收紧后的池为空，退回放宽版而不是整块消失。 */
function suggestPools(){
  const avoid = (recipePref && recipePref.avoid) || [];
  const portionOk = f => {
    if(typeof PORTIONS === "undefined") return true;
    const p = PORTIONS[f.name];
    return !p || p.g >= 30;
  };
  const base = allFoods().filter(f=>
    f && f.name && !isServingFood(f) && nutri100(f).kcal > 0 &&
    portionOk(f) && !isAvoided(f, avoid));
  const carbBase = f => {
    const v = nutri100(f);
    return f.category === "主食" && v.kcal <= 200 && v.carb >= 15 && proteinDensity(f) < 10;
  };
  const carbTight = base.filter(f=> carbBase(f) && nutri100(f).carb < 26);
  return {
    protein: base.filter(f=>{
      const v = nutri100(f);
      return f.category === "蛋白质" && v.kcal <= 220 && v.protein >= 15 && proteinDensity(f) >= 10;
    }),
    carb: carbTight.length ? carbTight : base.filter(carbBase),
  };
}

function renderFillSuggest(){
  const box = document.getElementById("fillSuggest");
  if(!box || !recipeMeals || !recipeMeals.meals) return;
  const target = recipeTarget();
  const eaten = dailyIntakeSummary();
  const r = remainingOf(target.kcal, eaten.kcal);

  // ① 今天没有任何记录 → 不猜建议，改为引导记录（这也顺手补上了首屏的空状态）
  if(eaten.count === 0){
    box.innerHTML = `
      <div class="fill-suggest">
        <div class="fs-head"><span class="fs-title">接下来补点什么</span></div>
        <div class="fs-hint lead">今天还没记录任何食物。吃完在「🍽 记食物」里点一下，这里就会告诉你还差什么、下一口该补什么。</div>
      </div>`;
    return;
  }
  // ② 额度用完或已超 → 明确说「不用补」，而不是硬凑一条
  if(r.over || r.remain < 80){
    // 剩余恰好为 0 时不能显示「还差 0 kcal」（读起来像没算完），单独给一句
    const gap = r.over ? `已超 <b>${r.abs}</b> kcal`
              : (r.remain > 0 ? `还差 <b>${r.remain}</b> kcal` : "刚好达标");
    const msg = r.over
      ? "今天的热量已经超了。先不加餐 —— 剩下的交给明天，不用今天补回来。"
      : (r.remain > 0 ? "今天的额度基本用完了，再补一口就超。不补完全可以。"
                      : "今天的额度刚好用完，不用再补了。");
    box.innerHTML = `
      <div class="fill-suggest">
        <div class="fs-head">
          <span class="fs-title">接下来补点什么</span>
          <span class="fs-gap">${gap}</span>
        </div>
        <div class="fs-hint lead">${msg}</div>
      </div>`;
    return;
  }

  // ③ 缺口超过一顿正餐的量 → 用户是「还没吃够」，不是「要补一口」。
  //    此时给「加 1 碗米饭」是把一天的量摊到一口上，属于假装有用。
  //    阈值用分餐比例算（37.5% × 全天目标），不用写死 700 这种魔法数字。
  const oneMealK = Math.round(target.kcal * mealSplitOf("午餐"));
  if(r.remain > oneMealK){
    box.innerHTML = `
      <div class="fill-suggest">
        <div class="fs-head">
          <span class="fs-title">接下来补点什么</span>
          <span class="fs-gap">还差 <b>${r.remain}</b> kcal</span>
        </div>
        <div class="fs-hint lead">今天还剩 <b>${r.remain}</b> kcal —— 这已经超过一顿正餐的量了。先照计划把剩下的吃完，再回来看这里：它会告诉你最后一两口该补什么。</div>
      </div>`;
    return;
  }

  // ④ 哪项营养落后就补哪项：蛋白完成度明显落后于热量完成度 → 补蛋白；否则补主食
  const kcalPct = target.kcal > 0 ? eaten.kcal / target.kcal : 0;
  const protPct = target.protein > 0 ? eaten.protein / target.protein : 1;
  const wantProtein = protPct < kcalPct - 0.05;

  const pools = suggestPools();
  const keyMap = wantProtein ? FOOD_POOLS.PROTEIN_KEYS : FOOD_POOLS.STAPLE_KEYS;
  const keys = Object.keys(keyMap);
  const scoreFn = wantProtein ? proteinDensity : (f=> nutri100(f).carb);
  const classFn = f => classOf(f, keyMap, keys);
  const pool = wantProtein ? pools.protein : pools.carb;

  let items = pickRepresentatives(pool, classFn, scoreFn, 3);
  // 用户在食谱里选过「肉/蛋白」偏好 → 优先出那一类（选了鸡，补蛋白当然先给鸡）
  const prefKey = wantProtein && recipePref ? recipePref.protein : "";
  if(prefKey && keys.includes(prefKey)){
    const all = pickRepresentatives(pool, classFn, scoreFn, 99);
    const hit = all.filter(f=> classFn(f) === prefKey);
    if(hit.length) items = hit.concat(all.filter(f=> classFn(f) !== prefKey)).slice(0, 3);
  }

  // 换算克数，并丢掉「吃不满一口」的（<50 kcal 不值得单独列一行）
  fillSuggestItems = items.map(f=>{
    const g = suggestGrams(f, r.remain);
    const v = foodKcal(f, g);
    return { name:f.name, g, kcal:Math.round(v.kcal), protein:Math.round(v.protein), origin:f };
  }).filter(it=> it.g > 0 && it.kcal >= 50);

  if(!fillSuggestItems.length){ box.innerHTML = ""; return; }

  const gapP = Math.max(0, Math.round(target.protein - eaten.protein));
  // 剩余热量已经在右上角 fs-gap 里写了，正文不再重复一遍 —— 同一屏说两遍同一个数字是噪音
  const hint = wantProtein
    ? `蛋白还差 <b>${gapP}g</b> —— 比热量落后得多，先补蛋白：`
    : `蛋白已经够了 —— 补点主食最直接：`;

  box.innerHTML = `
    <div class="fill-suggest">
      <div class="fs-head">
        <span class="fs-title">接下来补点什么</span>
        <span class="fs-gap">还差 <b>${r.remain}</b> kcal</span>
      </div>
      <div class="fs-hint lead">${hint}</div>
      <div class="fs-list">
        ${fillSuggestItems.map((it, i)=>`
          <div class="fs-item">
            <div class="fsi-main">
              <div class="fsi-name">${showNameOf(it.name)}${originBadge(it.origin)}</div>
              <div class="fsi-meta">${humanizeGrams(it.name, it.g)} · ${it.kcal} kcal · 蛋白 ${it.protein}g</div>
            </div>
            <div class="fsi-add" onclick="addSuggestToIntake(${i})">加入</div>
          </div>`).join("")}
      </div>
      <div class="fs-hint">下面写的是一次加菜/加餐的量 —— 不够可以再点几次。加入后会记进今日摄入，「还能吃」同步变小。</div>
    </div>`;
}

/* 把一条建议加入今日摄入（等同在「🍽 记食物」里手动加一份） */
function addSuggestToIntake(i){
  const s = fillSuggestItems[i];
  if(!s) return;
  foodList = loadTodayItems();   // 先载入今天已记录，避免覆盖
  foodList.push({ name:s.name, grams:s.g });
  saveTodayItems();
  showToast(`已加入 ${showNameOf(s.name)} ${s.g}g（约 ${s.kcal} kcal）`);
  // 走 renderExecBar()：「还能吃」重算 + 建议块跟着重算（其末尾会调 renderFillSuggest），
  // 两处口径绑在一起，不会出现一边变了另一边没变
  renderExecBar();
}

function planGoal(planId){
  const p = PLANS.find(x=>x.id===planId);
  return p ? p.goal : "减脂";
}

/* 按用户体重（70kg 基准）缩放模板 */
function scaleTemplate(tpl, weight){
  const ratio = (weight || 70) / 70;
  const out = {goal:tpl.goal, name:tpl.name, meals:{}};
  Object.keys(tpl.meals).forEach(m=>{
    out.meals[m] = tpl.meals[m].map(it=>({n:it.n, g:Math.round(it.g*ratio)}));
  });
  return out;
}

function mealTotal(items){
  let kcal=0, p=0, c=0, f=0;
  items.forEach(it=>{
    const fd = findFood(it.n);
    if(fd){
      const v = foodKcal(fd, it.g);
      kcal+=v.kcal; p+=v.protein; c+=v.carb; f+=v.fat;
    }
  });
  return {kcal, protein:p, carb:c, fat:f};
}

function openRecipe(){
  const id = getCurrentPlanId();
  const profile = loadProfile();
  const hasProfile = profile.gender && profile.age && profile.height && profile.weight;
  if(!id){
    alert("请先选择一个饮食方案");
    go('list');
    return;
  }
  if(!hasProfile){
    alert("请先完善个人信息，才能为你推荐食谱");
    go('calc');
    return;
  }
  recipePlanId = id;
  recipeTplIdx = 0;
  recipePref = loadRecipePref();   // 忌口/训练日等输入持久化，进来不用重填
  recipeSeed = 0;
  recipeMealTab = "早餐";
  recipeMeals = null;  // 进入时清空，buildRecipe 会重新生成一整天
  buildRecipe();
  go('recipe');
}

function buildRecipe(){
  const profile = loadProfile();
  const target = recipeTarget();   // 方案目标 → 自定义热量 → 训练日/休息日，已合并
  const goal = planGoal(recipePlanId);

  // 只在「没有三餐」或「需要重生成」时才生成；正常渲染直接用已保存的三餐
  // 传入 target：让生成的克数瞄准这个人这个方案的目标热量与 macro
  if(!recipeMeals || !recipeMeals.meals){
    recipeMeals = generateMeals(goal, profile.weight, recipePref, recipeSeed, target, profile.trainYears);
  }
  // generateMeals 只产出 MEAL_STRUCT 里的三餐，「加餐」不在其中 —— 补上空数组，
  // 否则加餐 tab 与「每餐汇总」都会读到 undefined
  MEAL_ORDER.forEach(m=>{ if(!Array.isArray(recipeMeals.meals[m])) recipeMeals.meals[m] = []; });

  const plan = PLANS.find(x=>x.id===recipePlanId);
  // 全天合计按 MEAL_ORDER 累加，必须把加餐算进去 —— 否则用户加了加餐，
  // 目标卡/汇总仍按三餐口径算，「计划合计 vs 目标」就对不上了
  const totals = MEAL_ORDER.reduce((acc,m)=>{
    const t = mealTotal(recipeMeals.meals[m]);
    acc.kcal+=t.kcal; acc.protein+=t.protein; acc.carb+=t.carb; acc.fat+=t.fat;
    return acc;
  }, {kcal:0,protein:0,carb:0,fat:0});

  const pct = (val, tgt)=> Math.min(100, Math.round(val/tgt*100));

  // 偏好 chips（蛋白 + 主食）
  const proteinOpts = Object.keys(FOOD_POOLS.PROTEIN_KEYS);
  const stapleOpts = Object.keys(FOOD_POOLS.STAPLE_KEYS);
  const chip = (label, val, cur, kind)=>`<span class="pref-chip ${cur===val?"on":""}" onclick="setPref('${kind}','${val}')">${label}</span>`;
  const avoidChip = k=>`<span class="pref-chip ${(recipePref.avoid||[]).includes(k)?"on":""}" onclick="toggleAvoid('${k}')">${k}</span>`;
  const dayChip = t=>`<span class="pref-chip ${recipePref.dayType===t?"on":""}" onclick="setDayType('${t}')">${t}</span>`;
  const mealsOrder = MEAL_ORDER;   // 含「加餐」第 4 餐
  const tab = (m)=>`<div class="meal-tab ${recipeMealTab===m?"on":""}" onclick="switchMealTab('${m}')">${m}</div>`;

  document.getElementById("recipeBody").innerHTML = `
    <!-- 本餐营养参考放在最上方：它是看这一餐时的主读数，放底部要滚到底才看得到 -->
    <div class="recipe-sum" id="recipeSum"></div>

    <div class="recipe-target-card">
      <div class="rt-label">${plan.name} · ${goal==="增肌"?"增肌期":"减脂期"}</div>
      <div class="rt-name">这顿吃什么？</div>
      <div class="rt-macro">
        <div class="m">碳水<b>${Math.round(target.carb)}g</b></div>
        <div class="m">蛋白<b>${Math.round(target.protein)}g</b></div>
        <div class="m">脂肪<b>${Math.round(target.fat)}g</b></div>
        <div class="m">全天热量<b>${Math.round(target.kcal)}kcal</b></div>
      </div>
    </div>

    <!-- ⚠ class="exec-bar" 不能省：卡片底色/内边距/圆角/与下块的 14px 间距全挂在 .exec-bar 上，
         而 renderExecBar() 只往里面塞 .exec-top/.exec-track/.exec-chips，自己不带这个类。
         少写一次，执行条就变成一条没有卡片、紧贴下方建议块的裸文字（曾真实发生）。 -->
    <div id="execBar" class="exec-bar"></div>

    <!-- 「接下来补点什么」紧贴执行条：「还能吃 420 kcal」的下一句必然是「那吃什么」，
         两句分开写会各算各的口径（曾经的教训：展示口径 ≠ 计算口径） -->
    <div id="fillSuggest"></div>

    <div class="meal-tabs">${mealsOrder.map(tab).join("")}</div>

    <div class="recipe-combo-box">
      <div class="rcb-head">
        <span class="rcb-title">${recipeMealTab}想吃点什么？</span>
        <span class="rcb-more" onclick="togglePrefMore()" title="忌口 / 训练日 / 自定义热量">
          <!-- 未设置任何项时摘要为空 → 必须兜底显示「更多设置」，
               否则入口只剩一个孤零零的 ▾，用户根本不知道忌口/训练日藏在里面 -->
          <span id="prefMoreCount">${prefSummaryText() || "更多设置"}</span>
          <b id="prefMoreArrow">${prefMoreOpen?"▴":"▾"}</b>
        </span>
      </div>
      <div class="rcb-row">
        <span class="rcb-label">肉/蛋白</span>
        <div class="rcb-chips">
          <span class="pref-chip ${recipePref.protein===""?"on":""}" onclick="setPref('protein','')">不限</span>
          ${proteinOpts.map(o=>chip(o, o, recipePref.protein, "protein")).join("")}
        </div>
      </div>
      <div class="rcb-row">
        <span class="rcb-label">主食</span>
        <div class="rcb-chips">
          <span class="pref-chip ${recipePref.staple===""?"on":""}" onclick="setPref('staple','')">不限</span>
          ${stapleOpts.map(o=>chip(o, o, recipePref.staple, "staple")).join("")}
        </div>
      </div>

      <div class="pref-more ${prefMoreOpen?"open":""}">
        <div class="rcb-row">
          <span class="rcb-label">忌口</span>
          <div class="rcb-chips">${Object.keys(AVOID_OPTIONS).map(avoidChip).join("")}</div>
        </div>
        <div class="rcb-row">
          <span class="rcb-label">今天</span>
          <div class="rcb-chips">${["日常","训练日","休息日"].map(dayChip).join("")}</div>
        </div>
        <div class="rcb-row">
          <span class="rcb-label">热量目标</span>
          <div class="rcb-chips rcb-kcal-row">
            <span class="pref-chip ${!recipePref.customKcal?"on":""}" onclick="setCustomKcal('')">按方案</span>
            <input class="pref-kcal" type="number" inputmode="numeric" min="800" max="5000" step="10"
              placeholder="自定义 kcal" value="${recipePref.customKcal||""}" onchange="setCustomKcal(this.value)" aria-label="自定义全天热量目标">
          </div>
        </div>
        <p class="pref-more-note">忌口与训练日会被记住。「训练日」全天热量 +8%（加在碳水），「休息日」 −5%。</p>
      </div>
      <!-- 告警放在 .pref-more 之外：忌口被放宽时「更多设置」多半是收起的，放里面等于没说 -->
      ${recipeMeals && recipeMeals.avoidRelaxed ? `<p class="pref-relax-warn">⚠️ 忌口勾选过多，有餐次的候选食材被全部排除，已自动放宽以免出现空餐 —— 建议少勾几项。</p>` : ""}
    </div>

    <div id="recipeMeals"></div>

    <div class="recipe-actions">
      <button class="btn-primary" onclick="addMealItem(recipeMealTab)">＋ 添加食物到${recipeMealTab}</button>
      <button class="btn-primary btn-intake" onclick="addRecipeMealToIntake()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        一键加入今日摄入
      </button>
    </div>
  `;
  renderRecipeMeals();
}

function setPref(kind, val){
  recipePref[kind] = val;
  saveRecipePref();
  // 改偏好 → 重新生成一整天三餐（偏好影响所有餐的抽选）
  const profile = loadProfile();
  const goal = planGoal(recipePlanId);
  recipeMeals = generateMeals(goal, profile.weight, recipePref, recipeSeed, recipeTarget(), profile.trainYears);
  buildRecipe();
}

/* 切换某一项忌口（多选） */
function toggleAvoid(k){
  const cur = recipePref.avoid || [];
  recipePref.avoid = cur.includes(k) ? cur.filter(x=>x!==k) : cur.concat(k);
  saveRecipePref();
  regenerateAll();
}

/* 训练日 / 休息日 / 日常 */
function setDayType(t){
  recipePref.dayType = t;
  saveRecipePref();
  regenerateAll();
}

/* 自定义全天热量；传空字符串表示恢复「按方案」 */
function setCustomKcal(v){
  const n = Number(v);
  recipePref.customKcal = (v === "" || v === null || !(n > 0)) ? null : Math.round(n);
  saveRecipePref();
  regenerateAll();
}

/* 展开/收起「更多设置」—— 只切显隐，不重新生成 */
function togglePrefMore(){
  prefMoreOpen = !prefMoreOpen;
  const box = document.querySelector(".pref-more");
  const arrow = document.getElementById("prefMoreArrow");
  const head = document.getElementById("prefMoreCount");
  if(box) box.classList.toggle("open", prefMoreOpen);
  if(arrow) arrow.textContent = prefMoreOpen ? "▴" : "▾";
  if(head) head.textContent = prefSummaryText();
}

/* 收起状态下也要让用户知道「有设置生效」 */
function prefSummaryText(){
  const bits = [];
  if((recipePref.avoid||[]).length) bits.push("忌口 " + recipePref.avoid.length + " 项");
  if(recipePref.dayType && recipePref.dayType !== "日常") bits.push(recipePref.dayType);
  if(recipePref.customKcal) bits.push(recipePref.customKcal + " kcal");
  return bits.length ? bits.join(" · ") : "";
}

/* 任一生成输入变化后重算整天餐单（自定义热量/训练日会改变目标，必须重算 target） */
function regenerateAll(){
  const profile = loadProfile();
  const goal = planGoal(recipePlanId);
  recipeMeals = generateMeals(goal, profile.weight, recipePref, recipeSeed, recipeTarget(), profile.trainYears);
  buildRecipe();
}

function switchMealTab(meal){
  recipeMealTab = meal;
  buildRecipe();  // 重新渲染，只展示当前餐
}

function regenRecipe(){
  // 只重抽当前这一餐，其余餐保持不动（用户每顿单独看，不该顺手换掉其他餐）
  const profile = loadProfile();
  const goal = planGoal(recipePlanId);
  const target = recipeTarget();

  // 连抽 3 个候选，用 mealsNutrition() 选出「当前这一餐」最贴近该餐目标热量的一版。
  // 让「换一换」不只是换个花样，而是换到更接近目标的一餐（此前 mealsNutrition 从未被调用）
  const wantKcal = target.kcal * mealSplitOf(recipeMealTab);
  let best = null, bestDiff = Infinity;
  for(let k = 1; k <= 3; k++){
    const cand = generateMeals(goal, profile.weight, recipePref, recipeSeed + k, target, profile.trainYears);
    const n = mealsNutrition({ [recipeMealTab]: cand.meals[recipeMealTab] });
    const diff = Math.abs(n.kcal - wantKcal);
    if(diff < bestDiff){ bestDiff = diff; best = cand; }
  }
  recipeSeed += 3;   // 种子前移，保证下次「换一换」拿到的是全新组合

  recipeMeals.meals[recipeMealTab] = best.meals[recipeMealTab];
  // 单餐重抽也可能撞上「池被剔空」，把放宽标记并进来，避免告警漏报
  recipeMeals.avoidRelaxed = !!recipeMeals.avoidRelaxed || !!best.avoidRelaxed;
  // 只重绘当前餐 + 本餐营养小结（renderRecipeMeals 内部会调 renderRecipeSum），
  // 不走 buildRecipe() 整页重渲染，避免按钮被点掉后页面滚回顶部
  renderRecipeMeals();
}

// 把「当前餐」的所有食物一键加入今日摄入清单
function addRecipeMealToIntake(){
  const items = recipeMeals.meals[recipeMealTab] || [];
  if(items.length === 0){ showToast("这一餐还没有食物"); return; }
  foodList = loadTodayItems();  // 载入今天已记录，避免覆盖
  let added = 0;
  items.forEach(it=>{
    const fd = findFood(it.n);
    if(!fd) return;
    if(isServingFood(fd)){
      foodList.push({name:it.n, servings:1});
    } else {
      foodList.push({name:it.n, grams:it.g});
    }
    added++;
  });
  saveTodayItems();
  const totalKcal = Math.round(items.reduce((s,it)=>{
    const fd = findFood(it.n);
    return s + (fd ? foodKcal(fd, isServingFood(fd)?1:it.g).kcal : 0);
  }, 0));
  // 闭环：把这一餐记进今日摄入 = 这一餐已经吃了 → 自动打上「已完成」，
  // 用户不必再去餐次标题行手动点一次（手动的那个按钮留给「吃了但没记」的情况）
  markMealDone(recipeMealTab, true);
  // ⚠ 必须走 renderRecipeMeals()（它内部会调 renderExecBar），不能只调 renderExecBar()：
  // 否则执行条的 chip 变了、餐次标题行的「未完成/已完成」还是旧的，同一屏出现两种说法
  renderRecipeMeals();
  showToast(`已将${recipeMealTab} ${added} 种食物加入今日摄入（约 ${totalKcal} kcal），并标记为已完成`);
}

function switchRecipeTpl(i){
  recipeTplIdx = i;
  buildRecipe();
}

/* ===== 自由组合引擎：按偏好从食材池动态生成一日三餐 ===== */
// 带种子的伪随机（保证同一次「换一个」内三餐/各餐的抽取稳定）
function seededRand(seed){
  let s = seed || 1;
  return function(){
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}
// 从 FOODS 中按分类取食材，排除命中 exclude 的
function poolByCategory(cat){
  return FOODS.filter(f=>f.category===cat && f.name);
}
// 按偏好标签从「蛋白质/主食」池里筛选食材名
function filterByPref(cat, tag){
  const map = (cat==="蛋白质") ? FOOD_POOLS.PROTEIN_KEYS : FOOD_POOLS.STAPLE_KEYS;
  if(!tag || !map[tag]) return null;
  const rule = map[tag];
  const pool = poolByCategory(cat);
  const hit = pool.filter(f=>{
    if(rule.exclude && rule.exclude.some(e=>f.name.includes(e))) return false;
    return rule.kw.some(kw=>f.name.includes(kw));
  });
  return hit.length ? hit : null;
}
/* 分餐热量比例：必须与 renderRecipeSum() 的展示口径一致（早 25% / 午 37.5% / 晚 37.5%） */
const MEAL_SPLIT = { "早餐":0.25, "午餐":0.375, "晚餐":0.375, "加餐":0 };
/* 餐次展示顺序。加餐不参与生成（FOOD_POOLS.MEAL_STRUCT 里没有它），
   由用户按需自己添加 —— 硬塞进去会打乱三餐的 macro 分配。 */
const MEAL_ORDER = ["早餐", "午餐", "晚餐", "加餐"];

/* 取某餐的分餐比例。
   ⚠ 必须用显式类型判断，不能写 `MEAL_SPLIT[m] || 1/3` —— 加餐的比例是 0，
   0 是 falsy，会被 `||` 静默兜底成 1/3，于是「加餐」凭空拿到全天 1/3 的目标额度。 */
function mealSplitOf(meal){
  const v = MEAL_SPLIT[meal];
  return (typeof v === "number") ? v : 1/3;
}

/* 分餐比例转文案：能整除就不带小数（25 → "25"），否则保留一位（37.5 → "37.5"）。
   ⚠ 不能直接 Math.round(ratio*100)：37.5 会被显示成 38%，用户把三餐相加
   25 + 38 + 38 = 101%，一眼就看出对不上。比例是用来核算的，必须精确。 */
function splitLabel(ratio){
  const n = Math.round(ratio * 1000) / 10;   // 保留一位小数
  return String(n).replace(/\.0$/, "");
}

// 组合引擎核心：根据 goal + 偏好生成一日三餐（返回 {meals:{早餐:[{n,g}],...}}）
// 传入 target（computeTarget() 的结果）时，克数按个人 macro 目标反解，全天热量瞄准 target.kcal；
// 不传 target 时退回旧的「结构克数 × 体重比例」行为。
// trainYears：训练年限（年，选填）—— 只用于调蛋白源质量门限，见 MIN_PROTEIN_QUALITY。
function generateMeals(goal, weight, pref, seed, target, trainYears){
  const struct = FOOD_POOLS.MEAL_STRUCT[goal] || FOOD_POOLS.MEAL_STRUCT["减脂"];
  const rand = seededRand(seed * 7919 + 13);
  const ratio = (weight || 70) / 70;
  const out = { meals:{} };

  const clamp = (v, lo, hi)=> Math.max(lo, Math.min(hi, v));
  // 克数上下限随体重等比缩放，防止反解出「米饭 900g」这类荒谬值
  const LIM = {
    staple:  [Math.round(30 * ratio), Math.round(350 * ratio)],
    protein: [Math.round(50 * ratio), Math.round(300 * ratio)],
    veg:     [Math.round(80 * ratio), Math.round(300 * ratio)],
    fat:     [Math.round(3  * ratio), Math.round(20  * ratio)],
  };
  /* ── 蛋白位「一盘菜的起码份量」：低于这个克数就不算一道菜（一小撮而已），
        与 LIM.protein[0]（静态下限 50g/70kg）是两个不同的问题，别混：
          LIM.protein[0] 是**盘子里的份量下限**，但它本身就在供能，硬套会顶爆整餐；
          PROTEIN_MIN_DISH_G 是**值不值得单列**的门槛，只在选人阶段用（见 proteinCarrier）。
        取值 = 旧跳过判据里那个 0.5 系数（50g×0.5 = 25g/70kg，78kg → 28g）——
        数值沿用，但作用点从「选完之后决定跳不跳」挪到了「选之前先把食材筛掉」，
        这一步挪动正是本次修复的实质（见 proteinCarrier 上方说明）。 */
  const PROTEIN_MIN_DISH_G = Math.round(25 * ratio);
  /* ── 单一蛋白食材最多能占本餐脂肪目标的几成（proteinCarrier 判据④）──
     为什么用「占脂肪目标的成数」而不是「扣掉已入账后剩余多少」：
       后者会算出 0。实测（532 碳水渐降法种子 1 早餐，tF 只 8.75g）：主食「包子（肉馅）84g」
       已带入 5.9g 脂肪 → 剩余 2.75g → 再扣掉要留给油的 LIM.fat[0]=3g → 额度 = **0**
       → 判据④把**所有**蛋白源都剔掉（连鸡蛋清 0.1g/100g 都容不下）→ 触发「空池退回原池」
       → 随机抽到「豆浆（无糖）334g」，撞上 334g 克数上限只能交 10g 蛋白 → 那餐蛋白只剩 **62%**。
       也就是说：判据一旦硬到能把池子清空，它不但没起作用，还会**通过兜底把结果变得更差**。
       成数写法则天然有下界（tF × 0.6 恒 > 0），池子不会被清空 —— 见 0.6 的取证。
     0.6 的来历（7 方案 × 10 种子 = 209 餐次，`qa-fat-occupy.cjs`，按实际克数算）：
       蛋白食材实际带入的脂肪 > 本餐脂肪目标的餐次占 **9.1%**，>60% 的占 **27.8%**
       （532 平均占用 73%、增肌盈余 55%）。取 0.6 正好卡在这条分界上：
       把 >60% 的挡掉，同时给同餐其余角色留 40% 额度。 */
  const PROTEIN_FAT_SHARE = 0.6;
  // 每 100g 营养密度（foodKcal 已兼容「区间数组」与「按份产品」两种数据形态）
  const per100 = fd => foodKcal(fd, 100);
  // 按某营养素目标反解克数；按份产品/密度为 0 时返回 null，由调用方回退结构克数
  const solveBy = (fd, key, gTarget)=>{
    if(!fd || gTarget == null || isServingFood(fd)) return null;
    const d = per100(fd)[key];
    if(!d || d <= 0) return null;
    return gTarget / d * 100;
  };
  // 蛋白源质量：每 100 kcal 能提供多少克蛋白。用数据属性判定，取代会与食物库漂移的手写名单。
  // 参考值：鸡胸≈19、豆腐皮≈11、鸡蛋≈9；猪五花肉仅 1.4、腊肉 3.6、猪颈肉 3.5。
  // 这类低质量蛋白源要凑够蛋白就得吃掉几百克，实测曾抽出 334g 猪五花肉（1897 kcal）。
  // 注意：不能用「脂肪密度」单指标筛 —— 豆腐皮/腐竹脂肪虽高但蛋白密度更高，是优质植物蛋白。
  const proteinQuality = fd =>{
    const v = per100(fd);
    return v.kcal > 0 ? (v.protein || 0) / v.kcal * 100 : 0;
  };

  // 减脂期：排除高脂蛋白 / 精制主食；增肌期：排除高脂肥肉但仍保留一定脂肪来源
  const isCut = goal === "减脂";
  const FAT_PROTEIN = ["牛腩（熟）","肥牛卷（熟）","五花肉（熟）","腊肉","午餐肉","火腿肠","鹅肉（熟）","鸭肉（去皮熟）"];
  const HIGH_FAT_PROTEIN = FAT_PROTEIN;  // 减脂/日常都尽量避开

  // 水果不参与生成：曾经的 fruitPool（+ 配套高糖水果黑名单 HIGH_SUGAR_FRUIT）
  // 已随「水果不再作为固定角色塞进某顿饭」一起删除 —— 见下面生成循环里的说明。
  // 用户想加水果时走「＋ 添加食物」或「加餐」自行添加。
  /* ── 蔬菜池：先剔掉「结构克数放不下」的浓缩形态 ──
     蔬菜的克数是结构给定的（结构克数 × 体重比例 ≈ 200–280g），是全餐里**唯一不由目标反解**的一项。
     所以只要食材本身是「浓缩/干制」形态，这个固定克数就会把它放大 20 倍：
       紫菜（干）蛋白 29g/100g、碳水 25g/100g、230 kcal/100g
         → 223g 就是 **65g 蛋白 + 56g 碳水**，既是宏量炸弹，也是荒谬份量（干紫菜一次只用 5–10g）
       羊肚菌（干）290 / 发菜（干）250 / 竹荪（干）245 kcal/100g 同理
       大蒜 140 kcal、碳水 29g/100g → 223g 交出 65g 碳水；它是调味品，不是一道 200g 的菜
     实测取证（膳食指南，蛋白目标 66g/天）：
       晚餐「白面包 170g | 紫菜（干）223g | 黄油 16g」  → P 80/25 = **324%**
       午餐「紫薯 515g   | 竹荪（干）223g | 杏仁 22g」   → P 53/25 = 214%、碳水 165%

     判据用**能量密度**，不用名字名单 —— 名单必随食物库漂移（HIGH_FAT_PROTEIN 写「五花肉（熟）」
     而库里叫「猪五花肉（生）」就是这么失效的）。数据本身给了一条硬空档：
       本库蔬菜 101 项里，97 项鲜菜全部 ≤ 55 kcal/100g（最高是凉薯 55）；
       60–120 kcal/100g **一项都没有**（完全空白）；
       再往上恰好就是上面那 5 项浓缩形态。
     所以门槛取 120 kcal/100g：中间隔着 65 kcal 的空档，零误伤。
     ⚠ 这不是「调参」，是把「蔬菜」的判据写清楚：一盘 200g+，能量密度必须低。
     ⚠ 主食池的 isReadyStaple 是同一种病（那边排「（生）/（干）」原料形态 + 高油高糖点心）。 */
  const VEG_CEIL_KCAL = 120;
  const serveAsVeg = f => per100(f).kcal <= VEG_CEIL_KCAL;
  const rawVegPool = poolByCategory("蔬菜");
  const vegPool = (()=>{ const ok = rawVegPool.filter(serveAsVeg); return ok.length ? ok : rawVegPool; })();
  const fatPool = (isCut ? ["橄榄油","菜籽油","牛油果","核桃","杏仁"] : ["橄榄油","花生油","芝麻油","牛油果","核桃","杏仁","黄油","猪油"])
    .map(n=>FOODS.find(f=>f.name===n)).filter(Boolean);
  const rawBreakfastVeg = FOOD_POOLS.BREAKFAST_VEG.map(n=>FOODS.find(f=>f.name===n)).filter(Boolean);
  // 早餐蔬菜是白名单，理论上已人工筛过，但仍走同一判据 —— 白名单也会随食物库扩充而失守
  const breakfastVeg = (()=>{ const ok = rawBreakfastVeg.filter(serveAsVeg); return ok.length ? ok : rawBreakfastVeg; })();

  let proteinPool = pref.protein ? (filterByPref("蛋白质", pref.protein) || poolByCategory("蛋白质")) : poolByCategory("蛋白质");
  let staplePool  = pref.staple  ? (filterByPref("主食", pref.staple)   || poolByCategory("主食"))   : poolByCategory("主食");

  // 减脂/日常：过滤掉高脂蛋白
  if(isCut || goal === "日常健康"){
    proteinPool = proteinPool.filter(f=>!HIGH_FAT_PROTEIN.includes(f.name));
  }

  /* 正餐主食的「能不能直接吃」过滤（所有方案都适用，不只减脂）。
     取证：减脂方案下 400 次生成、午晚餐主食 800 次抽选中，
     27.5% 抽到的是「薏米（生）81g」「挂面（干）86g」「红米（生）94g」——
     用户拿到的是生米干面，还得自己泡/煮、再换算成熟重，这条建议没法直接执行。
     两条判据都从现有数据推，不维护食物名单：

     ① 原料形态：库里用名字后缀标了加工状态 ——（熟）＝已熟制，盛一碗就能吃；
        （生）/（干）＝原料。排除 23/89 个主食。
        ⚠ 只作用于**正餐**池：早餐主食走的是 BREAKFAST_STAPLE 白名单，
        里面的「燕麦片（干）」泡牛奶吃是正常吃法，不能一起排掉。
     ② 高油高糖点心：每 100g 热量 ≥280 且脂肪 ≥5 的「主食」基本是糕点
        —— 油条 383/17、枣糕 320/9、八宝饭 300/7、烧饼 300/9。减脂期尤其不该推。
        反例守卫：馒头 223/1.1、米饭 116/0.3、全麦面包 246/3 都不受影响。
        ⚠ 这取代了原来手写的 REFINED_STAPLE（6 个名字）—— 那份名单既覆盖不全
        （枣糕/八宝饭/元宵/糍粑 全漏），也必随食物库漂移，和 HIGH_FAT_PROTEIN 同一种病。 */
  const RAW_FORM_STAPLE = /（生）$|（干）$/;
  const isReadyStaple = f => {
    if(RAW_FORM_STAPLE.test(f.name)) return false;
    const v = per100(f);
    return !(v.kcal >= 280 && v.fat >= 5);
  };
  const readyPool = staplePool.filter(isReadyStaple);
  if(readyPool.length) staplePool = readyPool;   // 兜底：绝不让池子被筛空

  // 蛋白源质量筛选（数据驱动，取代上面那份会与食物库漂移的硬编码名单）：
  // 所有 goal 都剔除「凑够蛋白就会把热量撑爆」的低质量蛋白源。
  // 上面那份 HIGH_FAT_PROTEIN 名单写的是「五花肉（熟）」，而库里实际叫「猪五花肉（生）」，
  // 名称漂移导致过滤失效 —— 这正是减脂餐曾抽出五花肉的根因。
  //
  // 训练年限微调门限（本次新增）：练得越久，越该用「蛋白密度高」的来源
  //   （老手热量预算紧，低密度蛋白一凑够就把热量撑爆）；新手先把量吃够更重要，故放宽。
  //   · 新手（<1 年）：−0.5   · 中级（1–3 年，含未填）：不变   · 老手（≥3 年）：+0.5
  //   ⚠ 幅度以「绝不把蛋白池筛空」为前提。已有兜底 `if(qualityPool.length)` 会把空池退回原池，
  //     但那样等于门限失效 —— 所以幅度必须实测安全（见提交信息里的非空率）。
  const _ty = parseFloat(trainYears);
  const _tyShift = (isFinite(_ty) && _ty >= 0) ? (_ty < 1 ? -0.5 : (_ty >= 3 ? 0.5 : 0)) : 0;
  const MIN_PROTEIN_QUALITY = (isCut ? 6.5 : (goal === "日常健康" ? 5.5 : 5)) + _tyShift;
  const qualityPool = proteinPool.filter(f => proteinQuality(f) >= MIN_PROTEIN_QUALITY);
  if(qualityPool.length) proteinPool = qualityPool;   // 兜底：绝不让池子被筛空

  /* ── 主食克数上限：为什么不能写死 350g/70kg ──
     主食是这份餐单里唯一的碳水来源，克数由本餐碳水目标反解（solveBy(f,"carb",tC)）。
     所以「主食能吃多少克」本质上取决于「这个食材的碳水密度」：
       干米干面（薏米（生）碳水 75g/100g）→ 390g 就能交 292g 碳水
       熟米饭（碳水 26g/100g）           → 同样 292g 碳水要 1123g
     旧的写死上限是照着**干料**标定的，而现实里人吃的是熟食。一旦把「（生）/（干）」
     原料排掉（见上面的 isReadyStaple），主食池整体从 50–100g 碳水档掉到 20–30g 档，
     同一个 390g 上限能交付的碳水就只剩三分之一，全天碳水与热量都缺一大块补不回来。
     取证：把碳水目标从 390g 提到 498g，生成热量只从 2747 涨到 2752 —— 杠杆 100% 饱和。

     改为按碳水密度推导：交够本餐碳水目标所需克数（留 15% 余量给「食材热量密度 ≠ 纯宏量折算」），
     与体重口径取较大者，再用 STAPLE_CEIL_G 收口。 */
  // 一顿主食的绝对顶（≈4 碗米饭）。连最稠的熟主食也够用：米饭（熟）交 166g 碳水只要 638g。
  // 它同时用在两处：池子筛选（扛不起就换人）+ 克数夹断（扛得起也最多这么多）。
  const STAPLE_CEIL_G = 800;
  // 交够 tC 克碳水所需的食材克数；密度为 0（按份产品/数据缺失）时返回 Infinity → 交由调用方兜底
  const gramsForCarb = (fd, tC)=>{
    const cpg = per100(fd).carb / 100;
    return (tC > 0 && cpg > 0) ? tC / cpg : Infinity;
  };
  // 本餐主食克数上限。⚠ tC 为空（旧回退路径：不传 target）时沿用体重口径 LIM.staple[1]，
  // 不能因为 gramsForCarb 返回 Infinity 而把上限放大到 800 —— 那条路径没有热量目标可瞄准，
  // 放大上限只会让份量无理由地变大。
  const stapleHi = (fd, tC)=> (tC > 0)
    ? Math.min(STAPLE_CEIL_G, Math.max(LIM.staple[1], Math.ceil(gramsForCarb(fd, tC) * 1.15)))
    : LIM.staple[1];

  /* ── 「这个食材配不配当主食」：两条判据，都随目标自动松紧 ──
     ① 扛不扛得起本餐碳水（最初就有的判据）
        旧的写法是一条静态密度门槛（碳水 ≥12g/100g），粒度和目标脱钩：它放过了土豆（17），
        实测仍会抽出「土豆（熟）390g 顶格」，占着主食位只交 66g 碳水；
        对增肌餐（午餐碳水目标 166g）土豆要 976g 才够，同样拦不住。
        新判据：需要的克数超过 STAPLE_CEIL_G 就算扛不起 →
          减脂餐碳水目标小，土豆/紫薯照样当主食；
          增肌餐目标大，自动收窄到米饭/面条一类谷物。
     ② 会不会把本餐蛋白顶爆（本次新增）
        主食的职责是交碳水，但很多「主食」同时带不少蛋白：
          蚕豆（鲜）9g/100g、全麦面包 13g/100g、馄饨（鲜肉）7.8g/100g、鹰嘴豆（熟）7g/100g
        而主食克数是**由碳水目标反解**出来的，于是这些蛋白是**被动带进来**的 ——
        蛋白位管不了它（蛋白位的缺口记账只让蛋白位「少解」，不让主食「少带」）。
        实测取证（日常健康，每餐蛋白目标 25g；此时蛋白位已被「缺口太小不出场」正确跳过）：
          午餐「蚕豆（鲜）521g | 豆芽 223g | 橄榄油 19g」→ P 51/25 = 207%
          晚餐「鹰嘴豆（熟）374g | 螺丝椒 223g | 芝麻油 13g」→ P 34/25 = 139%
        即：本餐蛋白变成由**碳水克数**决定，而不是由蛋白目标决定。所以判据是：
          按碳水目标反解出的克数，主食自身带进来的蛋白不得超过本餐蛋白目标。
     两条都过不了的项被剔掉；全被剔光就退回原池，绝不让某餐没主食。
     ⚠ 只约束「生成器自动抽选」，用户仍可手动添加粥类/淀粉蔬菜/包子馄饨。 */
  const carrierPool = (pool, tC, tP)=>{
    // 密度只算一次：池子近百项、每餐都要过一遍，重复调 per100 会明显拖慢生成
    const ok = pool.filter(f=>{
      const v = per100(f);
      const g = (tC > 0 && v.carb > 0) ? tC / (v.carb / 100) : Infinity;
      if(!isFinite(g)) return true;                  // 密度缺失（按份产品）→ 交由调用方兜底
      if(g > STAPLE_CEIL_G) return false;            // 扛不起本餐碳水
      if(tP != null && v.protein > 0 && v.protein * g / 100 > tP) return false;   // 会把蛋白顶爆
      return true;
    });
    return ok.length ? ok : pool;   // 兜底：全被筛掉就退回原池，绝不让某餐没主食
  };

  /* ── 「这个食材配不配当本餐的蛋白来源」：判据是**密度匹不匹配本餐蛋白缺口** ──
     与上面主食池的 carrierPool 同构（那边判碳水，这边判蛋白），所以同样随目标自动松紧。
     注意它是**双向**的 —— 两头都不配：
       缺口大 → 密度太低的扛不起（牛奶 3.3g/100g 要 758g 才够 25g 蛋白）
       缺口小 → 密度太高的也不配（一小撮就凑够了，「豆筋 4g」不成其为一道菜）
     为什么必须**换人**而不是把上限调高：低密度蛋白源在**热量上**也扛不起，两个上限一个都不松。
     算术验证（532 碳水渐降法，午餐蛋白目标 45g、本餐热量预算 599 kcal）：
       北豆腐蛋白 8.1g/100g → 交 45g 要 556g = 545 kcal，占本餐热量预算的 91%
       而 capByShare(g,f,0.55) 只许这一项吃 599×0.55 = 329 kcal → 折合上限 336g
       两个上限（LIM.protein[1]=334g 与 capByShare）在这个方案上几乎重合 ——
       所以「把 334g 调高」根本解决不了，它本来就被热量预算卡死。
       实测后果：午餐蛋白 35/45 = 78%，且 334g 北豆腐顺带带入 18g 脂肪 → 这餐脂肪 181%。
       换人之后：素鸡(18.0g/100g)只需 250g、豆干(16.0)281g，蛋白交得够，脂肪也不再被动带进来。

     ⚠⚠ 下界那条（判断 g < PROTEIN_MIN_DISH_G）是**本次修复的实质**，别当成可有可无的调参 ——
       旧代码把「份量太小 → 本餐不单列蛋白菜」这个决定放在**选完人之后**（见下面蛋白分支里
       `if(g < LIM.protein[0] * 0.5)`）。而 g = 缺口 ÷ 密度，是**密度盲**的：
         缺口 8.9g + 豆筋(40g/100g) → g = 22.3g → 判成「缺口很小」→ 跳过 → 那餐蛋白只有 69%
       大缺口被高密度食材换算成了小克数，于是被误判为「缺口可忽略」。反过来 缺口 8.9g +
       北豆腐(8.1) → g = 110g → 照常上菜。同一个缺口，两种结果 —— 判据落在了错误的量纲上。
       修法：把这条下界挪到**选人之前**当筛选条件，池子里就只剩「份量落在合理区间」的食材：
         缺口小 → 自动落到低密度源（豆腐/牛奶/酸奶），份量自然落在 27–55g，不需要跳过
         缺口大 → 落在高密度源，份量落在 30–250g
       这样「池子里的菜一定不会被跳过」成了不变式，跳过只在**兜底路径**（池被筛空）才可能发生。
       取证（7 方案 × 20 种子 = 420 餐次，`qa-skip-probe.cjs`）：
         修前 15 次跳过里 5 次是误跳（跳过之后该餐蛋白 69–90%），5 次的 g 分别是
         22.3 / 23.2 / 20.5 / 11.1 / 25.3，全部 < 28 阈值，但真实缺口是 8.9 / 10.4 / 3.7 / 2.2 / 6.1g。

     三条判据与主食池一一对应（①②正是 capByShare 夹断的两条边，③是补上的下界），
     第④条是「跨宏量」的对称补位（见下）：
       ① 克数 → 交够缺口所需克数 ≤ LIM.protein[1]（单项绝对顶）
       ② 热量 → 这份克数的热量 ≤ 本餐热量预算 × 0.55（与 capByShare 同一个系数）
       ③ 份量 → 交够缺口所需克数 ≥ PROTEIN_MIN_DISH_G（够得着一道菜的起码份量）
       ④ 脂肪 → 这份克数带入的脂肪 ≤ 本餐脂肪目标 × PROTEIN_FAT_SHARE
     取证（7 方案 × 20 种子，共 420 个餐次，`dbg-protein-ceil.cjs`）：
       改造前 69/420 餐次（16.4%）蛋白未达 90%，中位 78%、最差 51%；
       其中**早餐 50 次**（占 72%）、午餐 15、晚餐 4；
       根因 72% 涉及 334g 上限、17% 是热量预算 —— 元凶正是早餐蛋白池的牛奶/豆浆/酸奶：
         减脂早餐蛋白缺口 25g，低脂牛奶要 758g 才交得够，334g 上限只能交 11g → 整餐 59%。
     ⚠ 只约束「生成器自动抽选」，用户仍可手动添加牛奶/豆浆/豆腐。
     ⚠ 池子被筛空时**逐条放宽判据**（见下方「兜底」一节），最后才退回原池，绝不让某餐没蛋白。

     ── 判据④：与主食池的 ② 是一对（`carrierPool` 那边管「会不会把本餐**蛋白**顶爆」）──
     主食池和蛋白池都只盯着「自己那一门」营养，于是**跨宏量的占位**两端都漏：
       主食池 ②（上轮才加）：蚕豆（鲜）521g 交 51g 蛋白，而本餐蛋白目标只有 25g
       蛋白池 ④（本轮）：卤蛋 130g 自带 12g 脂肪，而本餐脂肪目标只有 13.8g → 那餐脂肪 163%
     取证（7 方案 × 10 种子 = 209 个餐次，`qa-fat-occupy.cjs`，按「实际克数带入的脂肪 ÷ 本餐脂肪目标」）：
       占用率 >100% 的餐次 **19/209（9.1%）**、>60% 的 **58/209（27.8%）**；
       532 碳水渐降法平均占用 73%（27% 的餐次 >100%）、增肌盈余法平均 55%
     额度怎么定：**不能**用「扣掉已入账后剩余多少」—— 那会算出 0 并把池子清空，
       反而通过「空池退回原池」的兜底把结果变得比不加判据更差（实测 532 早餐蛋白 62%）。
       改用「本餐脂肪目标 × 0.6」这种**有下界**的成数写法，见 PROTEIN_FAT_SHARE 上方取证。
       ⚠ 不能靠把油压到 0 来腾额度 —— 脂肪位那段闭包注释明确写了
         「自带脂肪已超 tF 时油降到 LIM.fat[0] 最小份量」是**有意为之**（一份现实里的菜总要
         用点烹调油）。所以只能靠**选人**，这正是作者自己写下的
         「那是食材选择的问题（高脂肉占位），不是油量的问题」。
     ⚠ 判据④ 必须与「早餐补上脂肪角色」成对出现，不能单独上（同一次改动的实测）：
        只上④    → 早餐脂肪平均 82% → **65%**（早餐没有脂肪杠杆，堵了来源就直接缺口）
        只补角色  → 早餐脂肪 82% → **115%**（高脂蛋白食材先吃掉额度，杠杆再补就是纯超出）
        成对上线  → 早餐脂肪 82% → **104%**，7 方案总体 脂肪 17.6 → 12.3 / 碳水 9.0 → 7.4
        两端都是「一个补位、一个把关」，缺一个就翻车 —— 数据见 `gh.log` 的 G/B/H 三臂对照。

     ── 兜底：不能「一把退回原池」，要逐条放宽（本次修复）──
     这一节不是新增判据，是修**兜底**。旧兜底 `ok.length ? ok : pool` 的后果反直觉：
     它把被 ① ② ③ ④ 剔掉的食材**原样放回**，而 ①（扛不起缺口）恰恰是最不能放的一条 ——
     放它回来，反解出的克数会撞上 LIM.protein[1] 被截断，那餐蛋白必然缺口。
     取证（忌口=乳制品+蛋，7 方案 × 20 种子 = 420 餐次，`qa-fallback-sweep.cjs`）：
       兜底触发 **97/420（23.1%）**；这 97 次抽中的食材**全部**都带判据违规，
       其中 **55 次是 ① 违规**（克数上限内交不够缺口）；
       兜底餐次蛋白平均 **86.6%**、未达 90% 的 **47/97**；而非兜底餐次平均 102.8%。
       典型：缺口 22.0g 抽到「豆浆（无糖）」（3.0g 蛋白/100g，需 733g）→ 撞 334g 上限
             只交 10g → 那餐蛋白 **70%**。
     用同一批数据离线推演「逐级放宽」（记录每个候选对四条判据的通过情况后重算）：
       只放宽 ④ 就够的 **70 次**；要再放宽 ③ 的 3 次；要再放宽 ② 的 24 次；
       **连 ① 都要放的 0 次**。也就是说「一把退回全池」在 97 次里有 70 次是**多放宽了三条**。
     所以改成阶梯：**先放代价最小的，① 始终保留**；连 ① 都放才空（极端情形）才退回全池。
     代价排序的依据（放谁最不伤结果）：
       ④ 脂肪顶爆 → 本餐脂肪偏高，但蛋白照交（脂肪位会自动少放油）—— 代价最小，**先放**；
       ② 吃光热量预算 → 本餐热量偏高（收尾校准会把主食压回来）—— 次之；
       ③ 盘份量不足 → 该项会被调用方的 `g < PROTEIN_MIN_DISH_G` 守卫跳过，等于本餐白抽一次、
                     不出蛋白菜，所以**放它最不划算**，排在最后；
       ① 扛不起缺口 → 只能交一部分蛋白，交出来的还是低密度填充 —— 最重，**不放宽**。
     实测（同一批 420 餐次，改后）：兜底餐次蛋白 86.6% → **96.2%**，
       未达 90% 的 47/97 → **13/97**，① 违规抽中 55 → **0**；
       全部餐次蛋白未达 90% **50/420（11.9%）→ 17/420（4.0%）**。
     代价：放宽 ④ 让本餐脂肪上行（早餐 122% → 132%）—— 这是「把蛋白交够」换来的，不是退步：
       那些餐次的严格池本来就是空的（唯一能交够缺口的只有高脂豆制品），
       不放 ④ 就只能回到 70% 蛋白。放谁都要付一样多的代价，区别只是付在哪一门上。
     ⚠ 默认场景（无忌口）实测**结果完全相同**（7 方案 × 50 种子 = 1050 餐次，兜底 9 次、
       四项 MAD 逐项一致）—— 这一改只影响「池子被压到筛空」的那些餐次。
     ⚠ 不动求解架构：仍是「一个池子 + 若干判据 + 随机抽选」，只是把「筛空之后怎么办」
       从「全放」改成「按代价从小到大逐条放」。
     ⚠ 主食池的 carrierPool 是**同型写法**，但实测 0/420 从未被筛空（池大、判据松），
       故本次不动它 —— 记在这里，等它真被筛空时按同一手法改。 */
  const proteinCarrier = (pool, gap, mealKcal, fatRoom)=>{
    if(gap == null) return pool;            // 旧回退路径（不传 target）不筛，行为与改动前一致
    /* relax 位掩码 =「本条判据已放宽」：bit0=④脂肪、bit1=②热量预算、bit2=③盘份量。
       ① 没有对应的位 —— 它永远不放宽（理由见上方「兜底」一节）。 */
    const judge = (f, relax)=>{
      const v = per100(f);
      if(!(v.protein > 0)) return true;     // 密度缺失（按份产品）→ 交由调用方兜底
      const g = gap / (v.protein / 100);    // 交够缺口所需克数
      if(g > LIM.protein[1]) return false;                                   // ① 单项克数上限扛不起
      if(!(relax & 2) && mealKcal && v.kcal > 0 && g * v.kcal / 100 > mealKcal * 0.55) return false;   // ② 吃光本餐热量预算
      if(!(relax & 4) && g < PROTEIN_MIN_DISH_G) return false;               // ③ 太浓：一小撮就够，不成一道菜
      if(!(relax & 1) && fatRoom != null && v.fat > 0 && g * v.fat / 100 > fatRoom) return false;      // ④ 会不会把本餐脂肪顶爆
      return true;
    };
    // 阶梯：全判据 → 放④ → 放④② → 放④②③；某一级非空就返回，全空才退回原池
    for(const relax of [0, 1, 3, 7]){
      const ok = pool.filter(f=>judge(f, relax));
      if(ok.length) return ok;
    }
    /* ── 最后一档：连 ① 都放才空时，也**别再随机抽** ──
       走到这里说明没有任何一项能在克数上限内交够缺口（阶梯四级全空）。此时每一项的
       交付量都被上限截断，交付量 = 截断克数 × 蛋白密度，于是「交付最多」是这一档里
       唯一还站得住的判据 —— 按它挑，把这一档的损失压到最小。
       ⚠ 旧写法是 `return pool`（在全池里均匀抽），等于把结果交给运气。实测：
         增肌盈余法 + 忌口「蛋+乳制品」+ 90–115kg 早餐，池只剩 3 项豆制品、缺口 31–42g
         而克数上限只 386–493g，三项**全都**交不够 —— 这时
           抽到「豆浆（无糖）」→ 那餐蛋白 **47–57%**
           抽到「北豆腐」    → 那餐蛋白 **94–101%**
         同一批 20 个穷尽餐次，随机版均值 60–76%、最差 **47%**；按交付量挑之后
         均值 97–100%、最差 **94%**（并全部落在原本就允许的早餐白名单内，不新增食材）。
       ⚠ 并列最优时一起返回，保留随机性。 */
    const deliver = f =>{
      const v = per100(f);
      if(!(v.protein > 0)) return 0;
      const g0 = gap / (v.protein / 100);
      let g = g0;
      if(mealKcal && v.kcal > 0) g = Math.min(g, (mealKcal * 0.55) / (v.kcal / 100));   // 与 capByShare 同口径
      return Math.min(g, LIM.protein[1]) * v.protein / 100;
    };
    const best = Math.max.apply(null, pool.map(deliver));
    return pool.filter(f=> deliver(f) >= best);
  };

  // 正餐蛋白池排除「乳制品 + 豆浆」（牛奶、酸奶、奶酪、乳清蛋白粉、豆浆属早餐/加餐），
  // 正餐保留肉/鱼/虾/蛋/豆制品。蛋类（鸡蛋/卤蛋/鸭蛋）作为正餐配菜常见，故不排除。
  //
  // ⚠ 用关键字而不是名单 —— 旧写法是一份 7 个名字的硬编码名单，而蛋白质池里实际有
  //   17 项乳制品 + 2 项豆浆，漏网 10 项：无糖酸奶 / 脱脂牛奶 / 奶酪（切达）/
  //   乳清蛋白粉（1勺约30g）/ 全脂奶粉 / 脱脂奶粉 / 奶油奶酪 / 酸奶油 / 黄油牛奶 / 羊奶 / 舒化奶。
  //   后果实测（增肌盈余法晚餐）：蛋白位抽出「无糖酸奶 334g」，只交 12g 蛋白（目标 53g），
  //   而 334g 已是 LIM.protein 上限 —— 反解不上去也补不回来。
  //   这与 HIGH_FAT_PROTEIN 写「五花肉（熟）」而库里叫「猪五花肉（生）」是同一种病：
  //   手写名单必随食物库漂移。改关键字后，新增任何乳制品自动生效。
  //   已核验：池内 19 项命中（17 乳制品 + 2 豆浆），零误伤。
  const isDairyOrSoy = f => /奶|酪|乳清|豆浆/.test(f.name);
  proteinPool = proteinPool.filter(f=>!isDairyOrSoy(f));

  // 「蛋」是早餐倾向偏好：正餐不能拿鸡蛋/鸭蛋当主蛋白（量太少），
  // 此时正餐蛋白回退到全量瘦肉/鱼/虾池，早餐才用蛋
  if(pref.protein === "蛋"){
    proteinPool = poolByCategory("蛋白质").filter(f=>!isDairyOrSoy(f));
    if(isCut || goal === "日常健康") proteinPool = proteinPool.filter(f=>!HIGH_FAT_PROTEIN.includes(f.name));
  }

  // 早餐专属池：只从「蛋/奶/豆/清淡」里抽，绝不让猪里脊、肥牛、五花肉等正餐大菜出现在早餐
  const breakfastProtein = FOOD_POOLS.BREAKFAST_PROTEIN.map(n=>FOODS.find(f=>f.name===n)).filter(Boolean);
  const breakfastStaple  = FOOD_POOLS.BREAKFAST_STAPLE.map(n=>FOODS.find(f=>f.name===n)).filter(Boolean);
  // 若减脂，早餐主食去掉油条/白面包等精制高糖项
  const bStaple = isCut ? breakfastStaple.filter(f=>!["白面包"].includes(f.name)) : breakfastStaple;

  // 用户选了肉蛋白偏好时，早餐给出对应的清淡映射（选「鸡」→鸡蛋，「牛」→牛奶，「猪/羊/鱼/虾」→退到鸡蛋/豆浆）
  const PREf_BREAKFAST_MAP = { "鸡":"鸡蛋（全蛋）", "牛":"低脂牛奶", "蛋":"鸡蛋（全蛋）", "豆/素":"豆浆（无糖）" };
  let breakfastProteinPool = breakfastProtein;
  if(pref.protein && PREf_BREAKFAST_MAP[pref.protein]){
    const target = PREf_BREAKFAST_MAP[pref.protein];
    const hit = breakfastProtein.find(f=>f.name===target);
    if(hit) breakfastProteinPool = [hit, ...breakfastProtein.filter(f=>f.name!==target)];
  }

  // 记录已抽中的蛋白/主食，避免三餐重复同一食材（让组合更多样）
  const usedProtein = new Set();
  const usedStaple = new Set();

  // 忌口关键词（生成输入扩展）。统一在 pick() 内部过滤，一处覆盖全部池，
  // 包括最容易遗漏的三个早餐专属池（breakfastProteinPool / breakfastVeg / bStaple）
  const avoidList = (pref && pref.avoid) || [];
  // 是否因为某个池被忌口剔空而不得不放宽忌口（如勾选 13 类全选时早餐蛋白池 11 项全灭）。
  // 放宽是必要的（宁可放宽也不能让某餐没菜），但必须让用户看见，不能静默失效。
  let avoidRelaxed = false;

  /* ── 忌口过滤（pick 的第一步，抽出来复用） ──
     ⚠ 这一步必须能**独立先做**，因为蛋白池收窄（proteinCarrier）要排在它之后。
       否则两者会打架：收窄判据只看营养密度、不看忌口，可能把池子收成清一色忌口项 ——
       于是 pick 的忌口过滤发现「剔完为空」，就按设计放宽忌口，把忌口项端上桌。
       实测（忌口=乳制品+蛋，减脂早餐，`dbg-avoid-egg.cjs`）：25 次生成里 2 次端出
       「鸡蛋清」「鸡蛋（全蛋）」，且这 2 次 avoidRelaxed 都为 true —— 忌口被静默绕过。
       根因不是放宽逻辑（它本身是对的），而是**顺序**：收窄必须建立在「已尊重忌口」的池子上。
       剔完为空则退回原池 —— 宁可忽略某条忌口，也不能让某一餐没菜（既有行为，保留）。 */
  const avoidBase = (pool)=>{
    if(!avoidList.length) return pool;
    const allowed = pool.filter(f=>!isAvoided(f, avoidList));
    if(allowed.length) return allowed;
    avoidRelaxed = true;   // 池被剔空 → 只能放宽
    return pool;
  };

  function pick(pool, used){
    const base = avoidBase(pool);
    const avail = base.filter(f=>!used.has(f.name));
    const src = avail.length ? avail : base;  // 若都抽过了则允许重复
    const f = src[Math.floor(rand() * src.length)];
    if(!f) return null;
    used.add(f.name);
    return f;
  }

  const stapleRefs = [];   // 记录主食项，供收尾 kcal 校准使用
  Object.keys(struct).forEach(meal=>{
    const roles = struct[meal];
    const items = [];
    const isBreakfast = meal === "早餐";
    // 本餐承担的 macro 目标（按分餐比例拆分全天目标）
    const split = mealSplitOf(meal);
    const tP = target ? target.protein * split : null;
    const tC = target ? target.carb    * split : null;
    const tF = target ? target.fat     * split : null;
    // 主食池按「扛不扛得起本餐碳水」+「会不会把本餐蛋白顶爆」双判据收窄。
    // ⚠ 必须在 tC/tP 之后才定：两条判据本身都以本餐目标为输入。
    // 早餐同样适用 —— BREAKFAST_STAPLE 白名单里有南瓜（熟）/小米粥/白粥，它们的碳水密度
    // 只够当配菜，占着早餐主食位时实测只交 101 kcal（南瓜 390g 顶格）。
    const sPool = carrierPool(isBreakfast ? bStaple : staplePool, tC, tP);

    // 单项克数安全网：单品最多承担本餐热量预算的 share 比例。
    // 防止低密度/高热量食材反解出荒谬克数（570g 五花肉、900g 米饭这类）。
    const mealKcal = target ? target.kcal * split : null;
    const capByShare = (g, fd, share)=>{
      if(!mealKcal) return g;
      const kpg = per100(fd).kcal / 100;
      if(kpg <= 0) return g;
      return Math.min(g, (mealKcal * share) / kpg);
    };

    /* 本餐已选各项**实际**贡献的 P/C/F，以及「还差多少」。
       ⚠ 旧实现让每个角色各自解到「整餐目标」，等于假装同餐其他项不供能 —— 这不是求解思路问题，
         而是没兑现上面那句「本餐承担的 macro 目标」。取证（增肌盈余法早餐，目标蛋白 35g）：
           蛋白位「茅屋奶酪 320g」精准交出 35.0g  ← 单独看完全正确
           主食位「馄饨（鲜肉）238g」又自带 18.6g ← 从未被计入
           整餐合计 55g = 157%
         脂肪同理：旧注释写「只让烹调用油承担约一半脂肪目标，另一半来自食材本身」，
         但「那一半到底有多少」从未核算 → 肉类自带脂肪超额，实测脂肪 108–167%。
       所以这里不改架构，只把后续角色的目标扣成「还差多少」，让整餐而不是单项对准目标。
       ⚠ tP/tF 为空（旧回退路径：不传 target）时 need() 返回 null，行为与改动前一致。 */
    const contrib = { protein:0, carb:0, fat:0 };
    const track = (fd, grams)=>{
      const v = per100(fd);
      contrib.protein += (v.protein || 0) * grams / 100;
      contrib.carb    += (v.carb    || 0) * grams / 100;
      contrib.fat     += (v.fat     || 0) * grams / 100;
    };
    // 本餐还差多少（已达标就不再往上加，返回 0 由 LIM 下限兜底最小份量）
    const need = (mealTarget, got)=> mealTarget == null ? null : Math.max(0, mealTarget - got);

    if(roles["主食"]){
      const f = pick(sPool, usedStaple);
      if(f){
        const hi = stapleHi(f, tC);   // 上限随碳水密度推导，不再写死 LIM.staple[1]
        // 此时 contrib 全 0，等价于原来的 solveBy(f,"carb", tC)；写成 need() 是为了四个分支口径一致
        let g = solveBy(f, "carb", need(tC, contrib.carb));
        if(g == null) g = roles["主食"] * ratio;
        g = capByShare(g, f, 0.65);
        const grams = Math.round(clamp(g, LIM.staple[0], hi));
        items.push({n:f.name, g:grams});
        track(f, grams);   // 记账必须在 push 之后用**最终克数**（含 clamp），否则后续角色扣不准
        stapleRefs.push({meal, idx:items.length-1, fd:f, hi});
      }
    }
    /* ── 蔬菜：**先入账、后入列** ──
       蔬菜的克数是结构给定的（结构克数 × 体重比例），不受任何 macro 目标驱动，
       所以它是这份餐单里**唯一确定**的一项 —— 正确的顺序是先把它记进本餐账本，
       再让蛋白位去补剩下的缺口（主食在前，因为它自己带进来的蛋白也会被蛋白位扣掉）。
       ⚠ 旧顺序（主食 → 蛋白 → 蔬菜）会把蔬菜带进来的蛋白变成**纯超出**，
         而蛋白位已经解完了，没有任何角色能让出这部分：
           午餐「糙米 309g(8g) | 龙利鱼 203g(37.6g) | 海茸 223g(2g)」→ P 46/44 = 106%
           早餐「红薯 257g(4g) | 鸡蛋清 230g(25g)   | 菠菜 111g(3.2g)」→ P 32/29 = 109%
         每餐 2–3g、全天约 6g，相当于蛋白目标的 5%（减脂 117g 时）。
       ⚠ 但**展示顺序必须仍是「主食 / 蛋白 / 蔬菜 / 脂肪」**（用户已习惯、测试也按此断言），
         所以这里只算克数与入账，push 推迟到蛋白分支之后。 */
    let vegItem = null;
    if(roles["蔬菜"]){
      const f = pick(isBreakfast ? breakfastVeg : vegPool, new Set());
      if(f){
        const grams = Math.round(clamp(roles["蔬菜"] * ratio, LIM.veg[0], LIM.veg[1]));
        vegItem = {n:f.name, g:grams};
        track(f, grams);
      }
    }
    if(roles["蛋白"]){
      /* 蛋白池按「密度匹不匹配本餐蛋白缺口」收窄（早餐用早餐专属池，正餐用全量池）。
         ⚠ 必须先过忌口（avoidBase），再上载体判据 —— 顺序反了会让收窄后的池子清一色是忌口项，
           从而触发 pick 的放宽路径、把忌口项端上桌（见 avoidBase 上方说明）。
         ⚠ 必须在主食分支**之后**才定：缺口 = 本餐蛋白目标 − 主食已带入的蛋白（contrib.protein），
           而 contrib 要到主食分支跑完才有值。所以这里不能再像以前那样在循环开头取池。
         ⚠ 蔬菜也已入账（见上方「先入账、后入列」），所以这里的缺口是**真的**缺口。 */
      const pBase = avoidBase(isBreakfast ? breakfastProteinPool : proteinPool);
      const pPool = proteinCarrier(pBase, need(tP, contrib.protein), mealKcal,
        tF > 0 ? tF * PROTEIN_FAT_SHARE : null);
      const f = pick(pPool, usedProtein);
      if(f){
        /* ⚠ 关键修复：扣掉主食（可能还有更早入账的项）已带的蛋白再反解。
           旧写法 solveBy(f,"protein", tP) 让蛋白位独自扛满整餐蛋白目标，
           而主食（馄饨/包子/饺子/全麦面包/鹰嘴豆）自带的蛋白从未被计入 → 实测整餐蛋白 103–178%。 */
        const gap = need(tP, contrib.protein);
        let g = solveBy(f, "protein", gap);
        if(g == null) g = roles["蛋白"] * ratio;
        g = capByShare(g, f, 0.55);

        /* ── 蛋白位最小份量：静态下限 LIM.protein[0] 也在供能，必须随目标自适应 ──
           静态下限 LIM.protein[0]（=50g/70kg，78kg → 56g）的存在意义是「盘子里看得见一道菜」。
           但它**本身就在供能**：56g 鸡胸/即食鸡胸肉 ≈ 17g 蛋白。于是当本餐蛋白目标只有 17–25g 时
           （日常健康方案蛋白仅占供能 12.5%，全天 66g），光靠下限就把整餐蛋白顶到 134–180%。
           实测取证（膳食指南，目标蛋白 66g/天）：
             晚餐「全麦面包 230g | 即食鸡胸肉 56g | 丝瓜 223g」→ P 37/25 = 150%
             早餐「馄饨（鲜肉）194g | 茅屋奶酪 56g   | 芹菜 89g」 → P 22/17 = 135%
           两处的 56g 都正好等于下限 —— 下限在供能，而不是「最小份量」。
           这与上面主食上限是同一类病：**静态阈值不随目标缩放**。所以下限取
           「静态下限」与「缺口所需克数」的较小者 —— 菜还在，但不为了凑满下限而超标。

           ⚠ 至于「缺口小到不值得单列一道菜」这个决定，**已经上移到 proteinCarrier 里**当筛选条件
             （见那里的判据③与 PROTEIN_MIN_DISH_G 上方说明）。留在这里的 `g <` 只是**兜底守卫**：
             proteinCarrier 筛空时会退回原池，那时抽到的食材可能还是「太浓」的，
             此时才靠这一句拦下，避免出现「豆筋 4g」这种不成立的份量。
             换句话说：正常路径下这句永不触发（池里的菜都被③保证了份量 ≥ PROTEIN_MIN_DISH_G），
             能走到这里说明池子被筛空过（极小的缺口 + 全池都偏浓）。
           ⚠ 热量的自洽性不受影响：主食/蔬菜带的蛋白本来就该由蛋白位让出来，
             让出来的克数会由收尾 kcal 校准补回主食（主食是热量杠杆）。
           ⚠ 已知小副作用：跳过时 pick() 已把该食材加进 usedProtein，当天其余餐次不会再抽到它。
             影响仅为「当天可选食材少一项」，不影响任何营养口径，故不做回滚（回滚要改 pick 的契约）。 */
        if(g < PROTEIN_MIN_DISH_G){
          // 兜底守卫：连一道菜的起码份量都不到，本餐不单列蛋白菜（正常路径见 proteinCarrier 判据③）
        } else {
          const lo = Math.min(LIM.protein[0], Math.ceil(g));
          const grams = Math.round(clamp(g, lo, LIM.protein[1]));
          items.push({n:f.name, g:grams});
          track(f, grams);
        }
      }
    }
    // 蔬菜已在上方入账（见「先入账、后入列」），这里按展示顺序补进列表
    if(vegItem) items.push(vegItem);
    if(roles["脂肪"]){
      const f = pick(fatPool, new Set());
      if(f){
        /* ⚠ 这里从 tF*0.5 改成「缺口全额」，是本次改动里唯一动了系数的地方，说明为什么：
           旧写法 solveBy(f,"fat", tF*0.5) 的原意是「烹调用油承担约一半脂肪目标，另一半来自食材本身」。
           但那句「另一半」当时是**空头承诺**——contrib.fat 从未核算过，0.5 只是拍脑袋替它估的数。
           实测脂肪 108–167%（上海鲜/五花肉这类高脂食材时 211%），说明估值严重偏低。

           现在 contrib.fat 已经把主食/蛋白/蔬菜**实际**带进来的脂肪记清楚了，于是：
             食材已供 contrib.fat  →  油只需补 tF - contrib.fat  →  整餐恰好落在 tF。
           如果这里再乘 0.5，整餐脂肪 = (tF + contrib.fat) / 2，恒 < tF —— 等于把「食材自带的那一份」
           重复扣了两次，实测就是脂肪被从超标推到不足（膳食指南 101%→77%、凯圣王 95%→72%）。
           所以 0.5 是「记账之前的估值」，记账落地后必须撤掉，否则新旧两套口径打架。

           ⚠ 由此带来的行为变化：肉/蛋自带脂肪越多，油量自动越少；自带脂肪已超 tF 时油降到
             LIM.fat[0] 最小份量，此时整餐脂肪仍会超标 —— 但那是**食材选择**的问题（高脂肉占位），
             不是油量的问题，继续压油只会造出「零油烹饪」的假餐单，不再硬凑。
           ⚠ 脂肪角色必须**最后**计算，否则 contrib.fat 不完整（当前顺序即如此，勿调整）。 */
        const rest = need(tF, contrib.fat);
        let g = solveBy(f, "fat", rest);
        if(g == null) g = roles["脂肪"] * ratio;
        const grams = Math.round(clamp(g, LIM.fat[0], LIM.fat[1]));
        items.push({n:f.name, g:grams});
        track(f, grams);
      }
    }
    // 水果不再作为固定角色塞进某顿饭（早餐吃苹果、午晚餐配香蕉都不是人人喜欢），
    // 改为可选加餐：用户想加时点「＋添加食物」自行加入
    out.meals[meal] = items;
  });

  // 收尾校准：反解出的 macro 克数仍会被「食材自身热量密度 ≠ 纯 macro 折算」以及蔬菜热量带偏，
  // 这里按全天 kcal 残差补偿到主食克数上（主食是热量调节的最佳杠杆，不该让蛋白/蔬菜为凑热量而失真）
  if(target && target.kcal > 0 && stapleRefs.length){
    const totalKcal = mealsNutrition(out.meals).kcal;
    const resid = target.kcal - totalKcal;
    if(Math.abs(resid) > target.kcal * 0.03){
      stapleRefs.forEach(ref=>{
        const sp = mealSplitOf(ref.meal);
        const perG = per100(ref.fd).kcal / 100;
        if(perG <= 0) return;
        const it = out.meals[ref.meal][ref.idx];
        // ⚠ 上限必须用 ref.hi（本餐按碳水密度推导的），不能再用写死的 LIM.staple[1] ——
        // 那是照干米干面标定的，会把熟主食二次掐死，等于把上面刚做对的推导又抹掉
        it.g = Math.round(clamp(it.g + (resid * sp) / perG, LIM.staple[0], ref.hi));
      });
    }
  }
  out.avoidRelaxed = avoidRelaxed;   // 供 UI 提示「忌口项过多，部分餐次无法满足」
  return out;
}
// 计算一餐/一天的营养是否贴近目标（用于「换一个」时优先选更贴近的组合）
function mealsNutrition(meals){
  let kcal=0,p=0,c=0,f=0;
  Object.values(meals).forEach(items=>{
    const t = mealTotal(items);
    kcal+=t.kcal; p+=t.protein; c+=t.carb; f+=t.fat;
  });
  return {kcal, protein:p, carb:c, fat:f};
}

function renderRecipeSum(){
  // ⚠ 必须用 recipeTarget()（含自定义热量 / 训练日），不能用 computeTarget() 原值 ——
  // 否则用户设了「训练日 +8%」或自定义 1800 后，这里显示的参考目标仍是方案原值，两者对不上
  const target = recipeTarget();
  const m = recipeMealTab;  // 只统计当前餐
  const t = mealTotal(recipeMeals.meals[m] || []);
  // 按餐次给出目标参考：早餐约 25%、午/晚餐各约 37.5%
  const ratio = mealSplitOf(m);   // 与 generateMeals() 共用同一分餐口径
  const pct = v=>Math.min(100, Math.round(v*100));
  const box = document.getElementById("recipeSum");
  // 加餐不占全天分配（ratio 为 0）→ 不能拿 0 当分母算进度条（会得 Infinity%），只报实际值
  if(!(ratio > 0)){
    // 空加餐不显示一排 0（上面已经有空态说明了，重复）
    if(!t.kcal){ box.innerHTML = ""; return; }
    box.innerHTML = `
      <div class="rs-hint">${m}实际摄入 · 不占全天分配</div>
      <div class="rs-item"><div class="n">${Math.round(t.kcal)}</div><div class="u">热量 kcal</div></div>
      <div class="rs-item"><div class="n">${Math.round(t.carb)}</div><div class="u">碳水 g</div></div>
      <div class="rs-item"><div class="n">${Math.round(t.protein)}</div><div class="u">蛋白 g</div></div>
      <div class="rs-item"><div class="n">${Math.round(t.fat)}</div><div class="u">脂肪 g</div></div>
    `;
    return;
  }
  const tK = target.kcal*ratio, tC = target.carb*ratio, tP = target.protein*ratio, tF = target.fat*ratio;
  box.innerHTML = `
    <div class="rs-hint">${m}营养参考 · 按全天目标 ${splitLabel(ratio)}% 分配</div>
    <div class="rs-item"><div class="n">${Math.round(t.kcal)}/${Math.round(tK)}</div><div class="u">热量 kcal</div><div class="bar"><i style="width:${pct(t.kcal/tK)}%;"></i></div></div>
    <div class="rs-item"><div class="n">${Math.round(t.carb)}/${Math.round(tC)}</div><div class="u">碳水 g</div><div class="bar"><i style="width:${pct(t.carb/tC)}%;"></i></div></div>
    <div class="rs-item"><div class="n">${Math.round(t.protein)}/${Math.round(tP)}</div><div class="u">蛋白 g</div><div class="bar"><i style="width:${pct(t.protein/tP)}%;"></i></div></div>
    <div class="rs-item"><div class="n">${Math.round(t.fat)}/${Math.round(tF)}</div><div class="u">脂肪 g</div><div class="bar"><i style="width:${pct(t.fat/tF)}%;"></i></div></div>
  `;
}

  // 统计：最近一次 vs 最初一次 的体重/体脂变化
  let trendHtml = "";
  if(logs.length >= 2){
    const first = logs[0], last = logs[logs.length-1];
    const wDiff = (last.weight - first.weight);
    const bfDiff = (last.bodyFat != null && first.bodyFat != null) ? (last.bodyFat - first.bodyFat) : null;
    trendHtml = `
      <div class="bl-trend">
        <div class="bl-trend-item">
          <div class="lbl">体重总变化</div>
          <div class="val ${wDiff<0?'down':wDiff>0?'up':'flat'}">${wDiff>0?'+':''}${wDiff.toFixed(1)} kg</div>
        </div>
        ${bfDiff!=null ? `
        <div class="bl-trend-item">
          <div class="lbl">体脂率总变化</div>
          <div class="val ${bfDiff<0?'down':bfDiff>0?'up':'flat'}">${bfDiff>0?'+':''}${bfDiff.toFixed(1)} %</div>
        </div>` : ""}
      </div>`;
  }

  const listHtml = logs.length ? `
    <div class="bl-list">
      ${[...logs].reverse().map((r,i)=>{
        const prev = logs[logs.length-1-i-1];  // 上一条（更早）
        let wTag = "", bfTag = "";
        if(prev){
          const wd = r.weight - prev.weight;
          if(wd !== 0) wTag = `<span class="bl-delta ${wd<0?'down':'up'}">${wd>0?'+':''}${wd.toFixed(1)}kg</span>`;
          if(r.bodyFat!=null && prev.bodyFat!=null){
            const bd = r.bodyFat - prev.bodyFat;
            if(bd !== 0) bfTag = `<span class="bl-delta ${bd<0?'down':'up'}">${bd>0?'+':''}${bd.toFixed(1)}%</span>`;
          }
        }
        return `
        <div class="bl-item">
          <div class="bl-date">${r.date}</div>
          <div class="bl-vals">
            <span class="bl-w">${r.weight} kg ${wTag}</span>
            ${r.bodyFat!=null ? `<span class="bl-bf">体脂 ${r.bodyFat}% ${bfTag}</span>` : ""}
          </div>
          <button class="bl-del" onclick="delBodyLog(${logs.length-1-i})">删</button>
        </div>`;
      }).join("")}
    </div>` : `<div class="bl-empty">还没有记录，从今天开始记一笔吧。</div>`;

  document.getElementById("bodylogBody").innerHTML = `
    <div class="bl-form">
      <div class="bl-form-t">记一笔</div>
      <div class="bl-row">
        <label>体重 (kg)</label>
        <input type="number" id="blWeight" inputmode="decimal" placeholder="${curWeight||'当前体重'}" value="${curWeight}" step="0.1" />
      </div>
      <div class="bl-row">
        <label>体脂率 (%) <span class="opt">选填</span></label>
        <input type="number" id="blBodyFat" inputmode="decimal" placeholder="${curBodyFat||'估算即可'}" value="${curBodyFat}" step="0.1" />
      </div>
      <div class="bl-row">
        <label>日期</label>
        <input type="date" id="blDate" value="${todayStr()}" />
      </div>
      <button class="btn-primary" onclick="addBodyLog()">保存记录</button>
    </div>
    ${trendHtml}
    ${listHtml}
  `;
}

function todayStr(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function addBodyLog(){
  const w = parseFloat(document.getElementById("blWeight").value);
  const bfVal = document.getElementById("blBodyFat").value;
  const bf = bfVal === "" ? null : parseFloat(bfVal);
  const date = document.getElementById("blDate").value || todayStr();
  if(!w || isNaN(w) || w <= 0){
    alert("请填写有效体重");
    return;
  }
  if(bf !== null && (isNaN(bf) || bf <= 0)){
    alert("体脂率若填写需为有效正数");
    return;
  }
  const logs = loadBodyLog();
  logs.push({date, weight: Math.round(w*10)/10, bodyFat: bf===null?null:Math.round(bf*10)/10});
  logs.sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  saveBodyLog(logs);
  // 同步最新体重/体脂到个人信息，供方案计算使用
  const profile = loadProfile();
  profile.weight = w;
  if(bf !== null) profile.bodyFat = bf;
  saveProfile(profile);
  renderBodyLog();
}

function delBodyLog(idx){
  const logs = loadBodyLog();
  if(idx >= 0 && idx < logs.length){
    logs.splice(idx,1);
    saveBodyLog(logs);
    renderBodyLog();
  }
}

let foodKw = "";

// 模糊搜索别名：口语词 → 命中的品牌/分类关键词（搜「奶茶」「咖啡」等品类词也能找到对应品牌食物）
const SEARCH_ALIASES = {
  "奶茶": ["霸王茶姬","喜茶","奈雪","茶饮"],
  "咖啡": ["瑞幸","咖啡","拿铁","美式"],
  "汉堡": ["麦当劳","汉堡","巨无霸"],
  "快餐": ["麦当劳","赛百味"],
  "炸鸡": ["麦当劳","鸡翅","鸡腿","麦乐鸡"],
  "三明治": ["赛百味","三明治"],
  "茶饮": ["霸王茶姬","喜茶","奈雪"],
  "轻食": ["赛百味"],
};
// 判断某食物是否命中搜索词（模糊：匹配名称/品牌/分类/别名）
function foodMatchKw(f, kw){
  if(!kw) return true;
  const k = kw.trim().toLowerCase();
  if(!k) return true;
  const hay = [f.name, f.brand||"", f.category||""].join(" ").toLowerCase();
  if(hay.includes(k)) return true;
  // 别名命中：搜「奶茶」→ 匹配茶饮品牌
  const aliasKw = Object.keys(SEARCH_ALIASES).find(a=>a.toLowerCase()===k);
  if(aliasKw){
    const hits = SEARCH_ALIASES[aliasKw];
    return hits.some(h=>hay.includes(h.toLowerCase()));
  }
  // 部分别名：关键词包含在别名键里（如搜「奶」匹配「奶茶」）
  for(const a of Object.keys(SEARCH_ALIASES)){
    if(a.toLowerCase().includes(k)){
      if(SEARCH_ALIASES[a].some(h=>hay.includes(h.toLowerCase()))) return true;
    }
  }
  return false;
}

function renderFoodCalc(){
  const allCats = Array.from(new Set(allFoods().map(f=>f.category)));
  // 常用分类：按食物数量降序取前 7 个（排除「全部」）
  const catCount = {};
  allFoods().forEach(f=>{ catCount[f.category]=(catCount[f.category]||0)+1; });
  const topCats = allCats.slice().sort((a,b)=>(catCount[b]||0)-(catCount[a]||0)).slice(0,7);
  const shownCats = catsCollapsed ? topCats : allCats;
  const hasMore = allCats.length > topCats.length;

  const foods = allFoods().filter(f=>{
    const okCat = foodCat==="全部" || f.category===foodCat;
    const okKw = foodMatchKw(f, foodKw);
    return okCat && okKw;
  });

  const searchBox = `
    <div class="food-search">
      <input id="foodSearchInput" placeholder="搜索食物名称..." value="${foodKw}" oninput="foodKw=this.value;renderFoodCalc()" />
    </div>`;

  // 「记食物」分段主体
  const foodSection = `
    ${searchBox}
    <div class="food-cats">
      <span class="food-cat ${foodCat==="全部"?"on":""}" onclick="setFoodCat('全部')">全部</span>
      ${shownCats.map(c=>`<span class="food-cat ${c===foodCat?"on":""}" onclick="setFoodCat('${c}')">${c}</span>`).join("")}
      ${hasMore ? `<span class="food-cat food-cat-more ${catsCollapsed?"":"on"}" onclick="toggleCats()">${catsCollapsed ? `展开全部 ${allCats.length} 个 ▾` : "收起 ▲"}</span>` : ""}
    </div>
    <div class="food-grid" id="foodGrid">
      ${foods.map(f=>{
        const isSrv = isServingFood(f);
        const kcalShow = isSrv ? f.kcal : fmtRange(f.kcal);
        const unitShow = isSrv ? (f.unit || "份") : "100g";
        const macroShow = isSrv
          ? (f.protein!=null ? `蛋白${f.protein}g · 碳水${f.carb}g · 脂肪${f.fat}g` : `热量 ${f.kcal} kcal/${unitShow}`)
          : `蛋白${fmtRange(f.protein)} · 碳水${fmtRange(f.carb)} · 脂肪${fmtRange(f.fat)}`;
        return `
        <div class="food-item ${pickedFood===f.name?"sel":""}" data-food="${f.name}" onclick="pickFoodItem('${f.name}')">
          <div class="fi-name">${showName(f)}${originBadge(f)}</div>
          <div class="fi-kcal"><b>${kcalShow}</b> kcal/${unitShow}</div>
          <div class="fi-kcal" style="font-size:11px;">${macroShow}</div>
        </div>`;
      }).join("")}
    </div>
    <div id="foodPickerBox"></div>
    <button class="food-photo-btn" onclick="document.getElementById('photoInput').click()">
      <svg class="ic-brand" viewBox="0 0 24 24" fill="none" stroke="#26215C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      拍照 / 上传食物图片（存档，暂不自动识别）
    </button>
    <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="addFoodPhotos(this)" />
    <div class="photo-previews" id="photoPreviews"></div>
    <button class="add-custom" onclick="toggleCustomForm()">＋ 添加自定义食物</button>
    <div id="customFormBox"></div>`;

  // 「一键套餐」分段主体
  const comboTags = ["全部"].concat(Array.from(new Set(MEAL_COMBOS.map(c=>c.tag))));
  const combos = MEAL_COMBOS.filter(c=>comboTag==="全部" || c.tag===comboTag);
  const comboSection = `
    <div class="food-cats">
      ${comboTags.map(t=>`<span class="food-cat ${t===comboTag?"on":""}" onclick="setComboTag('${t}')">${t}</span>`).join("")}
    </div>
    <div class="combo-grid" id="comboGrid">
      ${combos.map(c=>`
        <div class="combo-item" onclick="addCombo(${MEAL_COMBOS.indexOf(c)})">
          <div class="ci-name">${c.name}</div>
          <div class="ci-sub">${c.items.map(it=>it.n.replace(/\(.*\)/,"").replace(/·.*/,"")).join(" + ")}</div>
          <div class="ci-kcal">≈ ${comboKcal(c)} kcal</div>
        </div>`).join("")}
    </div>`;

  document.getElementById("foodBody").innerHTML = `
    <div class="food-mode-tabs">
      <button class="fseg ${foodMode==="food"?"on":""}" onclick="setFoodMode('food')">🍽 记食物</button>
      <button class="fseg ${foodMode==="combo"?"on":""}" onclick="setFoodMode('combo')">🍱 一键套餐</button>
    </div>
    ${foodMode==="food" ? foodSection : comboSection}
    <div class="food-summary-bar" id="foodSummaryBar">
      <div class="food-list-summary" id="foodListSummary"></div>
      <div class="food-total" id="foodTotal"></div>
    </div>
  `;

  renderFoodPickerBox();
  renderFoodListSummary();
  renderFoodTotal();
  renderPhotoPreviews();
  renderCustomForm();
}

function setFoodMode(m){ foodMode = m; renderFoodCalc(); }
function toggleCats(){ catsCollapsed = !catsCollapsed; renderFoodCalc(); }
function setFoodCat(c){ foodCat = c; pickedFood = null; renderFoodCalc(); }

/* ---- 一键套餐（组合餐） ---- */
function comboKcal(combo){
  // 计算套餐总热量（估算）
  let kcal = 0;
  combo.items.forEach(it=>{
    const fd = findFood(it.n);
    if(!fd) return;
    if(it.servings !== undefined){
      kcal += foodKcal(fd, it.servings).kcal;
    } else {
      kcal += foodKcal(fd, it.g || 0).kcal;
    }
  });
  return Math.round(kcal);
}
function setComboTag(t){ comboTag = t; renderFoodCalc(); }
function addCombo(idx){
  const combo = MEAL_COMBOS[idx];
  if(!combo) return;
  combo.items.forEach(it=>{
    const fd = findFood(it.n);
    if(!fd) return;
    if(it.servings !== undefined){
      foodList.push({name:fd.name, servings:it.servings});
    } else {
      foodList.push({name:fd.name, grams:it.g || 100});
    }
  });
  saveTodayItems();
  renderFoodCalc();
  showToast(`已加入「${combo.name}」${combo.items.length} 项`);
}

function pickFoodItem(name){
  pickedFood = name;
  renderFoodPickerBox();
  // 更新高亮：按 data-food 比对，不能用 .fi-name 的 textContent ——
  // 名字后面还挂着「官方/估算/自定义」徽章，textContent 永远不等于纯名字，
  // 用 textContent 比对会导致选中态静默失效
  document.querySelectorAll("#foodGrid .food-item").forEach(el=>{
    el.classList.toggle("sel", el.getAttribute("data-food") === name);
  });
}

function renderFoodPickerBox(){
  const box = document.getElementById("foodPickerBox");
  if(!box) return;
  if(!pickedFood){
    box.innerHTML = "";
    return;
  }
  const fd = findFood(pickedFood);
  const isSrv = isServingFood(fd);
  const unitLabel = isSrv ? (fd.unit||"份") : "克";
  const unitShow = isSrv ? (fd.unit||"份") : "100g";
  const kcalShow = isSrv ? fd.kcal : fmtRange(fd.kcal);
  const p = (!isSrv && typeof PORTIONS!=="undefined") ? (PORTIONS[pickedFood] || null) : null;

  // 按份店面产品：提供「规格备注 + 热量微调」，供用户手动记录糖度/加酱等差异
  const adjBox = isSrv ? `
    <div class="fp-row" style="margin-top:6px;">
      <input id="foodNoteInput" type="text" placeholder="规格备注（选填，如：去酱 / 三分糖）" style="width:100%;text-align:left;padding:8px 10px;" />
    </div>
    <div class="fp-row" style="margin-top:4px;">
      <span style="font-size:12px;color:var(--sub);">热量调整</span>
      <input id="foodKcalAdjInput" type="number" placeholder="0" style="flex:1;text-align:center;" />
      <span class="fp-unit">kcal</span>
    </div>
    <div style="font-size:11px;color:var(--sub);margin:2px 0 4px;">糖度/加酱等规格没有官方数据，可在此手动增减热量（正=加，负=减）。</div>` : "";

  // 有份量参照的普通食物：提供「数量 + 单位」快捷输入，自动换算克数；也可切到「按克数」精确输入
  const portionBox = p ? `
    <div class="fp-row">
      <input id="foodPortionInput" type="number" placeholder="数量" value="1" min="0.5" step="0.5" style="flex:1;" oninput="syncPortionToGrams()" />
      <span class="fp-unit" id="foodPortionUnit">${p.unit}</span>
      <span class="fp-unit" style="font-size:11px;color:var(--sub);">≈ ${p.g}g/${p.unit}</span>
    </div>
    <div style="font-size:11px;color:var(--sub);margin:4px 0 6px;">已自动换算为克数，可直接用，也可在下面微调：</div>` : "";

  const gramsRow = p ? `
    <div class="fp-row">
      <input id="foodGramsInput" type="number" placeholder="克" value="${p.g}" oninput="syncGramsToPortion()" />
      <span class="fp-unit">克</span>
    </div>` : `
    <div class="fp-row">
      <input id="foodGramsInput" type="number" placeholder="${unitLabel}" value="${isSrv ? 1 : 100}" />
      <span class="fp-unit">${unitLabel}</span>
    </div>`;

  box.innerHTML = `
    <div class="fp-mask" onclick="closeFoodPicker()"></div>
    <div class="fp-sheet">
      <div class="sheet-grab"></div>
      <div class="fp-name">${showName(fd)}${originBadge(fd)} <span style="font-size:12px;color:var(--sub);font-weight:400;">（${kcalShow} kcal / ${unitShow}）</span></div>
      ${originNote(fd)}
      ${portionBox}
      ${gramsRow}
      ${adjBox}
      <div class="fp-btns">
        <button class="fp-add" onclick="addFoodToList()">加入清单</button>
        <button class="fp-cancel" onclick="closeFoodPicker()">取消</button>
      </div>
    </div>`;
}

// 关闭食物选择弹层
function closeFoodPicker(){
  pickedFood = null;
  renderFoodPickerBox();
  renderFoodCalc();
}

// 数量变化 → 自动换算并回填克数输入框
function syncPortionToGrams(){
  const fd = findFood(pickedFood);
  const p = (fd && typeof PORTIONS!=="undefined") ? PORTIONS[pickedFood] : null;
  if(!p) return;
  const n = parseFloat(document.getElementById("foodPortionInput").value) || 0;
  const gEl = document.getElementById("foodGramsInput");
  if(gEl) gEl.value = Math.round(n * p.g * 10) / 10;
}
// 克数变化 → 反推数量输入框（保留 1 位小数）
function syncGramsToPortion(){
  const fd = findFood(pickedFood);
  const p = (fd && typeof PORTIONS!=="undefined") ? PORTIONS[pickedFood] : null;
  if(!p) return;
  const g = parseFloat(document.getElementById("foodGramsInput").value) || 0;
  const pEl = document.getElementById("foodPortionInput");
  if(pEl) pEl.value = Math.round(g / p.g * 10) / 10;
}

function addFoodToList(){
  const fd = findFood(pickedFood);
  if(!fd) return;
  const isSrv = isServingFood(fd);
  const p = (!isSrv && typeof PORTIONS!=="undefined") ? (PORTIONS[pickedFood] || null) : null;

  let qty;
  if(isSrv){
    qty = parseFloat(document.getElementById("foodGramsInput").value) || 1;
  } else if(p){
    // 有份量参照：优先用克数输入框（已由数量自动换算，或用户手动微调）
    const gramsEl = document.getElementById("foodGramsInput");
    const gramsVal = gramsEl ? parseFloat(gramsEl.value) : NaN;
    const portionEl = document.getElementById("foodPortionInput");
    const portionN = portionEl ? (parseFloat(portionEl.value) || 0) : 0;
    const autoG = portionN * p.g;
    // 若用户手动改过克数（与自动换算值不一致），以克数为准；否则用自动换算
    qty = (gramsVal && Math.abs(gramsVal - autoG) > 0.5) ? gramsVal : (autoG || p.g);
    if(qty <= 0) qty = p.g;
  } else {
    qty = parseFloat(document.getElementById("foodGramsInput").value) || 100;
  }
  if(qty <= 0) return;

  if(isSrv){
    const noteEl = document.getElementById("foodNoteInput");
    const adjEl = document.getElementById("foodKcalAdjInput");
    const note = noteEl ? noteEl.value.trim() : "";
    const kcalAdj = adjEl ? (parseFloat(adjEl.value) || 0) : 0;
    const item = {name:fd.name, servings:qty};
    if(note) item.note = note;
    if(kcalAdj) item.kcalAdj = kcalAdj;
    foodList.push(item);
  } else {
    foodList.push({name:fd.name, grams:qty});
  }
  saveTodayItems();
  const qtyShow = isSrv ? `${qty}${fd.unit||"份"}` : humanizeGrams(fd.name, qty);
  showToast(`已加入「${fd.name}」${qtyShow}`);
  pickedFood = null;
  renderFoodCalc();
}

function removeFoodFromList(i){
  foodList.splice(i,1);
  saveTodayItems();
  renderFoodCalc();
  renderIntakeRing();  // 同步首页进度环
}

// 修改已选食物第 i 项的数量/克数（input onchange 触发）
function updateFoodItemQty(i, val){
  const it = foodList[i];
  if(!it) return;
  const fd = findFood(it.name);
  const v = parseFloat(val);
  if(!fd || isNaN(v) || v <= 0) return;
  if(it.servings !== undefined){
    it.servings = v;
  } else {
    it.grams = v;
  }
  saveTodayItems();
  renderFoodCalc();
  renderIntakeRing();
}

// 按自然单位（个 / 碗 / 份 …）修改数量 → 换算成克存储
function updateFoodItemPortion(i, portions){
  const it = foodList[i];
  if(!it) return;
  const p = (typeof PORTIONS!=="undefined") ? PORTIONS[it.name] : null;
  const n = parseFloat(portions);
  if(!p || isNaN(n) || n <= 0) return;
  it.grams = Math.round(n * p.g * 10) / 10;
  delete it.servings;
  saveTodayItems();
  renderFoodCalc();
  renderIntakeRing();
}

function renderFoodListSummary(){
  const box = document.getElementById("foodListSummary");
  if(!box) return;
  if(foodList.length===0){
    box.innerHTML = `<div class="fls-t">已选食物</div><div class="fls-empty">还没有添加食物，点上方食物加入清单</div>`;
    return;
  }
  box.innerHTML = `
    <div class="fls-t">已选食物（${foodList.length} 项）</div>
    ${foodList.map((it,i)=>{
      const fd = findFood(it.name);
      const qty = (it.servings !== undefined) ? it.servings : it.grams;
      const v = foodKcal(fd, qty);
      if(it.kcalAdj) v.kcal += it.kcalAdj;
      const isSrv = isServingFood(fd);
      const p = (!isSrv && typeof PORTIONS!=="undefined") ? (PORTIONS[it.name] || null) : null;
      const usePortion = p && p.unit !== "克";
      const qtyInput = isSrv
        ? `<input class="fls-qty" type="number" value="${qty}" min="0.5" step="0.5" onchange="updateFoodItemQty(${i}, this.value)" /> <span class="fls-unit">${fd.unit||"份"}</span>`
        : usePortion
          ? `<input class="fls-qty" type="number" value="${Math.round(qty/p.g*10)/10}" min="0.5" step="0.5" onchange="updateFoodItemPortion(${i}, this.value)" /> <span class="fls-unit">${p.unit}</span>`
          : `<input class="fls-qty" type="number" value="${Math.round(qty)}" min="1" step="5" onchange="updateFoodItemQty(${i}, this.value)" /> <span class="fls-unit">克</span>`;
      const metaShow = isSrv
        ? `${it.note ? it.note : ""}${it.kcalAdj ? `${it.note?" · ":""}${it.kcalAdj>0?"+":""}${it.kcalAdj} kcal` : ""}`
        : usePortion
          ? `约 ${Math.round(qty)}g`
          : (fd ? humanizeGrams(it.name, qty) : ("约 "+roundish(qty)+"g"));
      return `
      <div class="food-row" style="padding:10px 14px;">
        <div style="flex:1;">
          <div class="fr-name" style="font-size:13px;">${showNameOf(it.name)}${originBadge(fd)}</div>
          <div class="fr-meta">${metaShow}</div>
          <div class="fls-qty-row">${qtyInput}</div>
        </div>
        <div class="fr-kcal" style="font-size:13px;">${Math.round(v.kcal)} kcal</div>
        <div class="fr-del" onclick="removeFoodFromList(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
      </div>`;
    }).join("")}
  `;
}

function renderFoodTotal(){
  const box = document.getElementById("foodTotal");
  if(!box) return;
  let kcal=0, p=0, c=0, f=0;
  foodList.forEach(it=>{
    const fd = findFood(it.name);
    const qty = (it.servings !== undefined) ? it.servings : it.grams;
    const v = foodKcal(fd, qty);
    if(it.kcalAdj) v.kcal += it.kcalAdj;
    kcal+=v.kcal; p+=v.protein; c+=v.carb; f+=v.fat;
  });
  box.innerHTML = `
    <div class="ft-item"><div class="n">${Math.round(c)}</div><div class="u">碳水 g</div></div>
    <div class="ft-item"><div class="n">${Math.round(p)}</div><div class="u">蛋白 g</div></div>
    <div class="ft-item"><div class="n">${Math.round(f)}</div><div class="u">脂肪 g</div></div>
    <div class="ft-kcal"><div class="n">${Math.round(kcal)}</div><div class="u">总热量 kcal</div></div>
  `;
}

/* 拍照存档 */
function addFoodPhotos(input){
  const files = Array.from(input.files || []);
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = function(e){
      foodPhotos.push(e.target.result);
      renderPhotoPreviews();
    };
    reader.readAsDataURL(file);
  });
  input.value = "";
}
function renderPhotoPreviews(){
  const box = document.getElementById("photoPreviews");
  if(!box) return;
  box.innerHTML = foodPhotos.map((src,i)=>`
    <div class="pp">
      <img src="${src}" />
      <span class="pp-x" onclick="removePhoto(${i})">×</span>
    </div>`).join("");
}
function removePhoto(i){ foodPhotos.splice(i,1); renderPhotoPreviews(); }

/* 自定义食物 */
let customFormOpen = false;
function toggleCustomForm(){
  customFormOpen = !customFormOpen;
  renderFoodCalc();
}
function renderCustomForm(){
  const box = document.getElementById("customFormBox");
  if(!box) return;
  if(!customFormOpen){ box.innerHTML = ""; return; }
  box.innerHTML = `
    <div class="custom-form">
      <div class="cf-t">添加自定义食物（每 100g）</div>
      <div class="cf-row"><label>食物名称</label><input id="cfName" placeholder="如：红烧鸡腿" /></div>
      <div class="cf-row"><label>分类</label><input id="cfCat" placeholder="如：蛋白质" value="自定义" /></div>
      <div class="cf-grid">
        <div class="cf-row"><label>热量 kcal</label><input id="cfKcal" type="number" placeholder="0" /></div>
        <div class="cf-row"><label>蛋白质 g</label><input id="cfProtein" type="number" placeholder="0" /></div>
        <div class="cf-row"><label>碳水 g</label><input id="cfCarb" type="number" placeholder="0" /></div>
        <div class="cf-row"><label>脂肪 g</label><input id="cfFat" type="number" placeholder="0" /></div>
      </div>
      <div class="fp-btns" style="margin-top:14px;">
        <button class="fp-add" onclick="saveCustomFood()">保存</button>
        <button class="fp-cancel" onclick="toggleCustomForm()">取消</button>
      </div>
    </div>`;
}
function saveCustomFood(){
  const name = document.getElementById("cfName").value.trim();
  const cat = document.getElementById("cfCat").value.trim() || "自定义";
  const kcal = parseFloat(document.getElementById("cfKcal").value) || 0;
  const protein = parseFloat(document.getElementById("cfProtein").value) || 0;
  const carb = parseFloat(document.getElementById("cfCarb").value) || 0;
  const fat = parseFloat(document.getElementById("cfFat").value) || 0;
  if(!name){ alert("请填写食物名称"); return; }
  const list = loadCustomFoods();
  list.push({name, category:cat, kcal, protein, carb, fat});
  saveCustomFoods(list);
  customFormOpen = false;
  alert(`已保存自定义食物「${name}」`);
  renderFoodCalc();
}

/* ===== 数字输入框体验优化 =====
   1. 禁止滚轮改变 number 值（避免滑动时数字意外跳跃）
   2. 禁止负数：统一设置 min=0，输入负号时自动纠正 */
document.addEventListener("focusin", function(e){
  const t = e.target;
  if(t && t.tagName === "INPUT" && t.type === "number"){
    if(!t.hasAttribute("min")) t.setAttribute("min", "0");
    // 阻止滚轮改变数值
    t.addEventListener("wheel", function(ev){ ev.preventDefault(); }, {passive:false});
  }
});

// 输入时清掉负号 / 非法字符（number 输入框的兜底）
document.addEventListener("input", function(e){
  const t = e.target;
  if(t && t.tagName === "INPUT" && t.type === "number"){
    if(t.value !== "" && parseFloat(t.value) < 0){
      t.value = "";
    }
  }
});

/* ===== 初始化 ===== */
renderFilters();
renderCurrentPlan();
renderTab();
</script>
