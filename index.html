// 从当前 DOM 表单收集未提交的输入值（num 字段 + 减脂专属字段）
function collectProfileDraft(){
  PROFILE_FIELDS.forEach(f=>{
    if(f.type==="num"){
      const el = document.getElementById("profile_"+f.key);
      if(el && el.value !== "") profileDraft[f.key] = el.value;
    }
  });
  ["targetWeight","targetWeeks"].forEach(k=>{
    const el = document.getElementById("profile_"+k);
    if(el && el.value !== "") profileDraft[k] = el.value;
  });
}

function renderProfileForm(profile){
  const base = PROFILE_FIELDS.map(f=>{
    if(f.type==="seg"){
      return `
        <div class="form-group">
          <label><b>${f.label}</b></label>
          <div class="seg">
            ${f.options.map(o=>`<div class="seg-item ${profile[f.key]===o.v?"on":""}" onclick="pickProfileSeg('${f.key}','${o.v}')">${o.label}</div>`).join("")}
          </div>
        </div>`;
    }
    // 优先用草稿值（未提交输入），其次用已保存值
    const val = (profileDraft[f.key] !== undefined) ? profileDraft[f.key] : (profile[f.key]||"");
    // 体重字段需联动减脂时长建议；其他 num 字段不需 oninput
    const oninput = f.key === "weight" ? ` oninput="renderWeightHint()"` : "";
    return `
      <div class="form-group">
        <label><b>${f.label}</b></label>
        <input class="form-input" type="number" id="profile_${f.key}" value="${val}" placeholder="${f.unit}"${oninput} />
      </div>`;
  }).join("");

  // 减脂目标：追加目标体重 + 预计时长
  let extra = "";
  if(profile.goal === "lose"){
    const tw = (profileDraft.targetWeight !== undefined) ? profileDraft.targetWeight : (profile.targetWeight||"");
    const tww = (profileDraft.targetWeeks !== undefined) ? profileDraft.targetWeeks : (profile.targetWeeks||"");
    extra = `
      <div class="form-group">
        <label><b>目标体重</b></label>
        <input class="form-input" type="number" id="profile_targetWeight" value="${tw}" placeholder="kg" oninput="renderWeightHint()" />
      </div>
      <div class="form-group">
        <label><b>预计减脂时长</b></label>
        <input class="form-input" type="number" id="profile_targetWeeks" value="${tww}" placeholder="周" oninput="renderWeightHint()" />
      </div>
      <div id="weightHint" style="margin-top:8px;"></div>`;
  }
  return base + extra;
}

// 实时显示减脂合理性提示（目标体重 / 时长联动）
function renderWeightHint(){
  const box = document.getElementById("weightHint");
  if(!box) return;
  const p = loadProfile();
  const curW = parseFloat(document.getElementById("profile_weight")?.value) || p.weight;
  const tgtW = parseFloat(document.getElementById("profile_targetWeight")?.value);
  const weeks = parseFloat(document.getElementById("profile_targetWeeks")?.value);
  if(!curW || !tgtW){
    box.innerHTML = "";
    return;
  }
  const r = validateWeightLoss(curW, tgtW, weeks);
  const colorMap = {invalid:"#DC2626", "warn-fast":"#DC2626", "warn-slow":"#B45309", "ok":"#0F6E56", "hint":"#185FA5"};
  const iconMap = {invalid:"⚠️", "warn-fast":"⚠️", "warn-slow":"💡", "ok":"✓", "hint":"💡"};
  box.innerHTML = `<div class="weight-hint" style="color:${colorMap[r.level]};background:${r.level==="ok"?"rgba(15,110,86,.08)":r.level==="warn-fast"||r.level==="invalid"?"rgba(220,38,38,.08)":"rgba(24,95,165,.08)"};font-size:12.5px;line-height:1.6;padding:10px 12px;border-radius:10px;">${iconMap[r.level]} ${r.msg}</div>`;
}

function pickProfileSeg(key, v){
  // 重渲染前，先收集当前表单里未提交的输入，避免丢失
  collectProfileDraft();
  const p = loadProfile();
  p[key] = v;
  saveProfile(p);
  if(pendingRecipeAfterInfo){
    const hasProfile = p.gender && p.age && p.height && p.weight;
    if(hasProfile){ openRecipe(); return; }
  }
  // 根据当前页面重渲染对应表单：我的面板 vs 计算页
  if(curScreen === "me"){
    editMeProfile();
  } else {
    renderCalc(PLANS.find(x=>x.id===curPlanId));
  }
}

function saveProfileForm(){
  const p = loadProfile();
  PROFILE_FIELDS.forEach(f=>{
    if(f.type==="num"){
      const v = document.getElementById("profile_"+f.key).value;
      if(v) p[f.key] = parseFloat(v);
    }
  });
  // 减脂专属字段
  if(p.goal === "lose"){
    const tw = document.getElementById("profile_targetWeight");
    const tww = document.getElementById("profile_targetWeeks");
    if(tw && tw.value) p.targetWeight = parseFloat(tw.value);
    if(tww && tww.value) p.targetWeeks = parseFloat(tww.value);
  }
  // 减脂合理性校验：超安全速度时警告
  if(p.goal === "lose" && p.weight && p.targetWeight && p.targetWeeks){
    const r = validateWeightLoss(p.weight, p.targetWeight, p.targetWeeks);
    if(r.level === "warn-fast" || r.level === "invalid"){
      if(!confirm(r.msg + "\n\n仍要按当前设置保存吗？（建议调整目标体重或时长）")){
        return;
      }
    }
  }
  saveProfile(p);
  profileDraft = {};
  if(pendingRecipeAfterInfo){
    const hasProfile = p.gender && p.age && p.height && p.weight;
    if(hasProfile){ openRecipe(); return; }
  }
  renderCalc(PLANS.find(x=>x.id===curPlanId));
}

function editProfile(){
  const p = loadProfile();
  const box = document.getElementById("calcBody");
  // 直接把个人信息改成可编辑表单
  const plan = PLANS.find(x=>x.id===curPlanId);
  box.querySelector(".profile-tip").innerHTML = `
    请修改你的个人信息：
    <div style="margin-top:12px;">${renderProfileForm(p)}</div>
    <button class="btn-primary" style="margin-top:12px;" onclick="saveProfileForm()">保存</button>`;
}

/* 方案专属 seg 选择状态（持久化 —— 方案档位/体型不该每次进页面重选）
   key 沿用项目 localStorage 惯例（lizi_*）。写入点只有 pickSeg，
   故「segState 里有这个键」⇔「用户手动选过」—— (d) 的自动推导据此判断是否让位给用户。 */
const SEG_KEY = "lizi_seg_state";
/* 允许的档位取值：直接从 PLANS 的 seg 选项推导（数据驱动，不维护第二份名单）。
   ⚠ 必须校验：segState 现在来自 localStorage —— 损坏 / 旧版本残留的非法值会造成两种真实故障
     （均为加持久化之前不可能出现，因为那时只有 pickSeg 写、值必然合法）：
       · bodyType 非法 → computeTarget 的 kai 分支 `p.inputs[0].options.find(...)` 返回 undefined
         → `w * opt.carb` 抛 TypeError（整页计算崩掉）；
       · base 非法 → five32 的档位在「计算」与「文案」之间不一致（计算按 `base==="big"?500:300`
         得 300，文案按 `defOpt ? defOpt.deficit : 500` 得 500）—— 正是 t-plan-debt 防的双实现漂移。
   校验不过的键/值一律丢弃（回落默认行为），而不是带着脏值往下走。 */
const SEG_ALLOWED = (()=>{
  const m = {};
  PLANS.forEach(p=>(p.inputs||[]).forEach(inp=>{
    if(inp && inp.type === "seg" && inp.options){
      m[inp.key] = m[inp.key] || [];
      inp.options.forEach(o=>m[inp.key].push(o.v));
    }
  }));
  return m;
})();
function loadSegState(){
  try{
    const raw = JSON.parse(localStorage.getItem(SEG_KEY));
    if(!raw || typeof raw !== "object" || Array.isArray(raw)) return {};
    const out = {};
    Object.keys(raw).forEach(k=>{
      if(SEG_ALLOWED[k] && SEG_ALLOWED[k].indexOf(raw[k]) >= 0) out[k] = raw[k];
    });
    return out;
  }catch(e){ return {}; }
}
const segState = Object.assign({}, loadSegState());
function saveSegState(){
  try{ localStorage.setItem(SEG_KEY, JSON.stringify(segState)); }catch(e){}
}
function pickSeg(key, v){
  segState[key] = v;
  saveSegState();
  document.querySelectorAll(`[id^="seg_${key}_"]`).forEach(el=>el.classList.remove("on"));
  document.getElementById(`seg_${key}_${v}`).classList.add("on");
}

/* ===== 计算逻辑 ===== */
function calcResult(id){
  const p = PLANS.find(x=>x.id===id);
  const profile = loadProfile();
  const hasProfile = profile.gender && profile.age && profile.height && profile.weight;

  if(!hasProfile){
    alert("请先完善个人信息");
    return;
  }

  const w = profile.weight; // 体重 kg
  let extra = ""; // 说明文案

  const g = profile.gender;
  const age = profile.age;
  const h = profile.height;

  // 基础代谢 Mifflin-St Jeor
  const bmr = 10*w + 6.25*h - 5*age + (g==="male"?5:-161);

  // 展示口径唯一真源：显示值与生成器同源（computeTarget 含瘦体重 + 生理下限校准），
  // 否则会出现「计算器页算一套、餐单生成另一套」的双实现漂移（t-plan-debt 有专门断言）。
  const t = computeTarget(id, profile);
  const carb = t.carb, protein = t.protein, fat = t.fat, kcal = t.kcal;

  // 文案反算：下面所有数字都从**实际目标**换算，禁止硬编码方案名义系数 ——
  // 否则生理下限把蛋白抬到 1.6g/kg 后，文案还写「蛋白 1.5g/kg」，就是「展示口径 ≠ 计算口径」。
  const gk = x => (x / w).toFixed(2);            // 换算成 g/kg 体重
  const pct = x => Math.round(x / kcal * 100);   // 换算成供能比 %

  switch(id){
    case "month3":{
      const tl = profile.actLevel || "mod";
      extra = `活动水平「${ACT_DESC[tl]}」→ 实际 碳水 ${gk(carb)}g/kg、蛋白 ${gk(protein)}g/kg、脂肪 ${gk(fat)}g/kg（蛋白/脂肪按瘦体重，已按生理下限校准），每 10 天只调碳水。`;
      break;
    }
    case "triple-carb":{
      const tl = profile.actLevel || "mod";
      extra = `活动水平「${ACT_DESC[tl]}」→ 实际 碳水 ${gk(carb)}g/kg、蛋白 ${gk(protein)}g/kg、脂肪 ${gk(fat)}g/kg（蛋白/脂肪按瘦体重）。`;
      break;
    }
    case "carb-descend":{
      const tl = profile.actLevel || "mod";
      const ver = segState.version || "dyn";
      extra = `活动水平「${ACT_DESC[tl]}」→ 起始 碳水 ${gk(carb)}g/kg、蛋白 ${gk(protein)}g/kg、脂肪 ${gk(fat)}g/kg（蛋白/脂肪按瘦体重）。版本：${ver==="dyn"?"三个月动态版（90天）":"40天冲刺版"}。每 10 天复盘渐降。`;
      break;
    }
    case "five32":{
      const base = five32Base(profile);
      const act = profile.actLevel || "sed";
      const defOpt = p.inputs[0].options.find(o=>o.v===base);
      const deficit = defOpt ? defOpt.deficit : 500;
      const actK = ACT_FACTOR[act] || 1.2;
      const tdee = bmr * actK;
      extra = `总消耗≈${Math.round(tdee)} 大卡（BMR ${Math.round(bmr)}×活动系数 ${actK}），${base==="big"?"大基数":"小基数"}减 ${deficit} 大卡缺口。名义按 5:3:2 分配，实际供能比 ${pct(carb*4)}% 碳水 / ${pct(protein*4)}% 蛋白 / ${pct(fat*9)}% 脂肪（蛋白/脂肪按瘦体重并已按下限校准）。`;
      break;
    }
    case "kai-carb-cycle":{
      const bt = segState.bodyType || "endo";
      const opt = p.inputs[0].options.find(o=>o.v===bt);
      extra = `${opt.label}（起跳值）：实际 碳水 ${gk(carb)}g/kg、脂肪 ${gk(fat)}g/kg、蛋白 ${gk(protein)}g/kg（蛋白/脂肪按瘦体重并已按下限校准）。一周 = 2 高碳 + 3 中碳 + 2 低碳（蛋白每天不变）。`;
      break;
    }
    case "dietary-guideline":{
      const act = profile.actLevel || "sed";
      const actK = ACT_FACTOR[act] || 1.2;
      const tdee = bmr * actK;
      extra = `按总能量 ${Math.round(tdee)} 大卡，实际供能比：碳水 ${pct(carb*4)}%、蛋白 ${pct(protein*4)}%、脂肪 ${pct(fat*9)}%（名义中值 57.5%/12.5%/25%，官方区间 50–65%/10–15%/20–30%；蛋白已按生理下限抬升，故碳水不再是精确的 57.5%）。`;
      break;
    }
    case "zengji-yingyu":{
      const tl = profile.actLevel || "mod";
      const actK = ACT_FACTOR[tl] || 1.55;
      const tdee = bmr * actK;
      const bf = surplusForBodyFat(profile);
      const intake = tdee + bf.surplus;
      extra = `活动水平「${ACT_DESC[tl]}」→ 实际 碳水 ${gk(carb)}g/kg（由残差收尾）、蛋白 ${gk(protein)}g/kg、脂肪 ${gk(fat)}g/kg。总消耗≈${Math.round(tdee)} 大卡（BMR ${Math.round(bmr)}×活动系数 ${actK}），加 ${bf.surplus} 大卡盈余后摄入≈${Math.round(intake)} 大卡${bf.note}。核心：热量盈余 + 足量蛋白碳水，配合渐进超负荷力量训练稳步增肌。`;
      break;
    }
  }

  document.getElementById("calcResult").innerHTML = `
    <div class="result-card">
      <div class="rc-title">每日营养素目标</div>
      <div class="result-macro">
        <div class="macro-item"><div class="num">${Math.round(carb)}</div><div class="unit">克/天</div><div class="lbl">碳水化合物</div></div>
        <div class="macro-item"><div class="num">${Math.round(protein)}</div><div class="unit">克/天</div><div class="lbl">蛋白质</div></div>
        <div class="macro-item"><div class="num">${Math.round(fat)}</div><div class="unit">克/天</div><div class="lbl">脂肪</div></div>
      </div>
      <div style="text-align:center;font-size:13px;color:var(--sub);">总热量 ≈ ${Math.round(kcal)} 大卡/天</div>
    </div>
    <div class="result-card" style="background:var(--brand-soft);border-color:transparent;">
      <div class="rc-title">说明</div>
      <div style="font-size:13px;color:var(--text);line-height:1.7;">${extra}</div>
    </div>
  `;
}

function goRecommend(){
  quizIdx = 0;
  quizGoal = null;
  quizList = [];
  Object.keys(quizAns).forEach(k=>delete quizAns[k]);
  // 预填已有个人信息：已填过的字段不再重复询问（目标题始终保留，用户可重选）
  const p = loadProfile();
  QUIZ_INFO.forEach(f=>{ if(p[f.key] !== undefined && p[f.key] !== "") quizAns[f.key] = p[f.key]; });
  QUIZ_INFO_LOSE.forEach(f=>{ if(p[f.key] !== undefined && p[f.key] !== "") quizAns[f.key] = p[f.key]; });
  // 生成固定的初始题目序列（目标 + 未填的通用信息题）
  quizItems = [QUIZ_ENTRY, ...QUIZ_INFO.filter(f=>!(f.key in quizAns))];
  renderQuiz();
  go('quiz');
}

// 生成完整题目序列（仅在「选目标」和「跳过」时需要重排分支题，其余用固定 quizItems）
function getQuizItems(){
  return quizItems;
}

function renderQuiz(){
  const items = getQuizItems();
  const total = items.length;
  if(quizIdx >= total){
    renderQuizResult();
    return;
  }
  const item = items[quizIdx];
  const progress = Math.round((quizIdx/total)*100);

  if(item.type === "num"){
    // 数字输入题
    const hint = item.hint ? `<div class="quiz-hint" id="quizNumHint" style="font-size:12.5px;color:#185FA5;margin-top:10px;line-height:1.6;"></div>` : "";
    const skipBtn = item.optional ? `<button class="quiz-skip" onclick="skipQuizNum('${item.key}')">跳过（选填）</button>` : "";
    document.getElementById("quizBody").innerHTML = `
      <div class="quiz-progress"><div class="bar" style="width:${progress}%"></div></div>
      <div class="quiz-q">${item.q}</div>
      <input class="form-input" type="number" id="quizNum" inputmode="decimal" placeholder="${item.unit}" style="font-size:18px;padding:14px;" oninput="onQuizNumInput('${item.key}')" />
      ${hint}
      <button class="btn-primary" style="margin-top:16px;" onclick="submitQuizNum('${item.key}')">下一步</button>
      ${skipBtn}
    `;
    // 渲染减脂时长提示
    if(item.hint) onQuizNumInput(item.key);
  } else {
    // 选择题
    document.getElementById("quizBody").innerHTML = `
      <div class="quiz-progress"><div class="bar" style="width:${progress}%"></div></div>
      <div class="quiz-q">${item.q}</div>
      <div class="quiz-opts">
        ${item.opts.map(o=>`<div class="quiz-opt" onclick="pickQuiz('${o.v}')">${o.label}</div>`).join("")}
      </div>
    `;
  }
}

// 数字题输入时的实时提示（减脂时长题给出权威建议）
function onQuizNumInput(key){
  const hintBox = document.getElementById("quizNumHint");
  if(!hintBox) return;
  if(key === "targetWeeks"){
    const p = loadProfile();
    const curW = p.weight;
    const tgtW = quizAns["targetWeight"];
    if(curW && tgtW){
      const r = validateWeightLoss(curW, tgtW, null);
      hintBox.innerHTML = `💡 ${r.msg}`;
    } else {
      hintBox.innerHTML = "";
    }
    return;
  }
  if(key === "targetWeight"){
    const p = loadProfile();
    const curW = p.weight;
    const v = parseFloat(document.getElementById("quizNum").value);
    if(curW && v && v < curW){
      const diff = curW - v;
      const wMin = Math.ceil(diff / WEIGHT_LOSS.maxKgPerWeek);
      const wMax = Math.round(diff / WEIGHT_LOSS.minKgPerWeek);
      hintBox.innerHTML = `💡 需减 ${diff.toFixed(1)}kg，按 WHO 建议（0.5–1kg/周），合理时长约 ${wMin}–${wMax} 周。`;
    } else if(curW && v && v >= curW){
      hintBox.innerHTML = `⚠️ 目标体重应低于当前体重 ${curW}kg（减脂目标下）。`;
    } else {
      hintBox.innerHTML = "";
    }
  }
  if(key === "bodyFat"){
    const p = loadProfile();
    const h = p.height, wgt = p.weight;
    const v = parseFloat(document.getElementById("quizNum").value);
    if(h && wgt && v && v > 0){
      const bmi = wgt / ((h/100)*(h/100));
      hintBox.innerHTML = `💡 你的 BMI 约 ${bmi.toFixed(1)}。参考：体脂率男 10–20%、女 18–28% 属正常区间。`;
    } else {
      hintBox.innerHTML = "";
    }
  }
  if(key === "trainYears"){
    const v = parseFloat(document.getElementById("quizNum").value);
    if(v !== undefined && !isNaN(v)){
      if(v < 1){
        hintBox.innerHTML = `💡 新手阶段（<1 年）：建议优先掌握基础动作与训练习惯，营养按标准区间即可。`;
      } else if(v < 3){
        hintBox.innerHTML = `💡 初级–中级（1–3 年）：可逐步尝试精细化营养与训练周期化。`;
      } else {
        hintBox.innerHTML = `💡 有经验（≥3 年）：可根据体感与目标微调营养素配比。`;
      }
    } else {
      hintBox.innerHTML = "";
    }
  }
}

function pickQuiz(v){
  if(quizIdx === 0){
    // 第 1 题：目标，切换分支
    quizGoal = v;
    quizList = QUIZ_FLOW[v] || [];
    quizAns["goal"] = v;
    // 记录目标到个人信息
    const p = loadProfile();
    p.goal = v;
    saveProfile(p);
    // 选完目标后，把「减脂专属信息题 + 分支题」追加到固定序列末尾
    // （目标题已在 items[0]，通用信息题紧随其后，追加题不影响已答/未答题的位置）
    if(quizGoal === "lose"){
      quizItems.push(...QUIZ_INFO_LOSE.filter(f=>!(f.key in quizAns)));
    }
    quizItems.push(...quizList);
  } else {
    const items = getQuizItems();
    const item = items[quizIdx];
    if(item.key){
      // 个人信息题（含减脂专属）：记录并写入个人信息
      quizAns[item.key] = v;
      const p = loadProfile();
      p[item.key] = v;
      saveProfile(p);
    } else {
      quizAns[item.q] = v;
    }
  }
  quizIdx++;
  renderQuiz();
}

function submitQuizNum(key){
  const v = document.getElementById("quizNum").value;
  if(v === "" || v === null){
    return; // 未填不跳转
  }
  const num = parseFloat(v);
  quizAns[key] = num;
  const p = loadProfile();
  p[key] = num;
  saveProfile(p);

  // 减脂时长校验：超出安全速度时给警告并阻断
  if(key === "targetWeeks" && quizGoal === "lose"){
    const curW = p.weight;
    const tgtW = p.targetWeight;
    if(curW && tgtW){
      const r = validateWeightLoss(curW, tgtW, num);
      if(r.level === "warn-fast" || r.level === "invalid"){
        if(!confirm(r.msg + "\n\n仍要按这个时长继续吗？")){
          return;
        }
      }
    }
  }
  quizIdx++;
  renderQuiz();
}

// 选填数字题跳过：不写入答案，直接进入下一题
function skipQuizNum(key){
  delete quizAns[key];
  const p = loadProfile();
  delete p[key];
  saveProfile(p);
  quizIdx++;
  renderQuiz();
}

// 大基数判定：综合 BMI + 体脂率 + 需减 kg 数，任一命中即视为大基数
// 优先 BMI（≥28 中国肥胖线）→ 体脂率（男>25% 女>32%）→ 需减 >15kg
function isBigBase(curW, curH, bf, needLose){
  if(curW && curH){
    const bmi = curW / ((curH/100)*(curH/100));
    if(bmi >= 28) return true;   // 中国成人肥胖标准 BMI≥28
  }
  if(bf){
    const v = parseFloat(bf);
    if(!isNaN(v) && v > 0){
      if(v > 32) return true;    // 男女通用高体脂线（男>25 女>32，取宽松 32）
    }
  }
  if(needLose && needLose > 15) return true;
  return false;
}

// five32 基数档位（big=500 缺口 / small=300 缺口）：
//   用户**手动选过** → 永远以用户选择为准（segState.base 只可能由 pickSeg 或被持久化的 pickSeg 结果写入）；
//   从没选过 → 按个人情况自动推导（大基数 → big，否则 small），不再硬编码默认 "big"。
// ⚠ computeTarget 与 calcResult 的文案**必须**共用本函数，否则会出现
//   「显示算一个档、生成算另一个档」的双实现漂移（t-plan-debt 有专门断言）。
function five32Base(profile){
  if(segState.base) return segState.base;
  const w = profile.weight;
  const needLose = Math.max(0, w - (parseFloat(profile.targetWeight) || w));
  return isBigBase(w, profile.height, parseFloat(profile.bodyFat), needLose) ? "big" : "small";
}

function recommendPlan(){
  const goal = quizAns["goal"];

  // 日常健康 → 膳食指南（直接出结果）
  if(goal==="health"){
    return {id:"dietary-guideline", reason:"你想吃得均衡健康，中国居民膳食指南是最通用的营养基线，无需训练门槛，所有人都适用。"};
  }
  // 增肌 → 增肌盈余法
  if(goal==="muscle"){
    return {id:"zengji-yingyu", reason:"你想增肌，增肌盈余法采用 ISSN 与卫健委的权威标准：热量盈余 300–500 大卡、蛋白 1.6–2g/kg、碳水供能比 60–65%，配合渐进超负荷力量训练，把盈余转化为肌肉。"};
  }
  // 减脂分支
  if(goal==="lose"){
    const act = quizAns["actLevel"];
    const stuck = quizAns["你现在减脂遇到什么情况？"];
    const style = quizAns["你更想要哪种执行方式？"];
    const curW = quizAns["weight"];
    const tgtW = quizAns["targetWeight"];
    const curH = quizAns["height"];
    const bf = quizAns["bodyFat"];
    const needLose = (curW && tgtW && tgtW < curW) ? (curW - tgtW) : null;

    // 大基数判定：优先用 BMI / 体脂率（更准确），退化到 kg 差阈值
    const bigBase = isBigBase(curW, curH, bf, needLose);
    // 大基数优先精确控制的 532
    if(bigBase){
      const bmi = curW && curH ? (curW/((curH/100)*(curH/100))) : null;
      const why = bmi ? `（BMI 约 ${bmi.toFixed(1)}）` : (bf ? `（体脂率 ${bf}%）` : `（需减约 ${needLose.toFixed(0)}kg）`);
      return {id:"five32", reason:`你的基数偏大${why}。532 碳水渐降法计算步骤清晰、每周复盘调碳水，更适合大基数稳步减脂、避免反弹。`};
    }
    // 训练强度高 + 之前低碳反弹 → 三倍碳水
    if(act==="high" && stuck==="rebound"){
      return {id:"triple-carb", reason:"你训练强度高、但之前低碳减脂状态差易反弹，三倍碳水法靠高碳水支撑高强度训练，用训练消耗制造缺口，适合你。"};
    }
    // 训练强度高 → 三倍碳水
    if(act==="high"){
      return {id:"triple-carb", reason:"你训练强度高，三倍碳水法用高碳水提状态、靠训练消耗制造缺口，正好发挥你的训练能力。"};
    }
    // 平台期 → 碳水渐降
    if(stuck==="stuck"){
      return {id:"carb-descend", reason:"你卡在平台期，碳水渐降法从较高碳水逐步降低、穿插高碳日，给身体适应时间，长期可持续、不易反弹。"};
    }
    // 第一次减脂 + 想要简单 → 三个月减脂计划
    if(stuck==="first" || style==="simple"){
      return {id:"month3", reason:"你有完整模板照着吃，每 10 天只调碳水，简单直接，最适合减脂新手稳稳掉秤。"};
    }
    // 大基数/想要精确 → 532
    if(style==="precise"){
      return {id:"five32", reason:"你喜欢按数字精确执行，532 碳水渐降法计算步骤清晰、每周复盘调碳水，大基数也友好。"};
    }
    // 想长期坚持 → 碳水渐降
    if(style==="flexible"){
      return {id:"carb-descend", reason:"你想灵活调整、长期坚持，碳水渐降法循序渐进、穿插高碳日，可持续性强、不易反弹。"};
    }
    // 默认
    return {id:"month3", reason:"你有完整模板照着吃，每 10 天只调碳水，简单直接，适合减脂稳稳掉秤。"};
  }
  return {id:"month3", reason:"推荐你从三个月减脂计划开始，有完整模板照着吃，简单直接。"};
}

/* ===== 配色主题 =====
   三套都做过对比度校验：正文/次要文字在各自 bg/card 上 ≥ 4.5:1，
   白色文字在 brand→brand-2 渐变上 ≥ 4.5:1。
   默认 B（暖橙食欲）——设计评审的推荐，也是「吃」这件事最顺的色温。 */
const THEME_KEY = "lizi_theme";
const DEFAULT_THEME = "B";
const THEMES = [
  { id:"A", name:"深紫精炼", note:"冷静克制，偏工具感", sw:["#26215C","#4A3FA8"] },
  { id:"B", name:"暖橙食欲", note:"暖色，最贴「吃」", sw:["#9A3412","#C2410C"] },
  { id:"C", name:"健康绿",   note:"清爽，偏轻食",     sw:["#14532D","#15803D"] },
];
function getTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    return THEMES.some(x=>x.id===t) ? t : DEFAULT_THEME;
  }catch(e){ return DEFAULT_THEME; }
}
function themeName(id){ const t = THEMES.find(x=>x.id===id); return t ? t.name : id; }
function applyTheme(id){
  // B 是 :root 默认值，移除属性即可；A/C 靠属性覆盖
  if(id === DEFAULT_THEME) document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", id);
}
function setTheme(id){
  if(!THEMES.some(x=>x.id===id)) return;
  try{ localStorage.setItem(THEME_KEY, id); }catch(e){}
  applyTheme(id);
  renderMe();
  // 主题色被写进了 JS 生成的 SVG 属性（进度环渐变），必须重渲染才跟着变
  renderIntakeRing();
  if(recipeMeals) buildRecipe();
  showToast("已切换配色：" + themeName(id));
}

function editMeProfile(){
  const p = loadProfile();
  // 兜底：goal 缺失时根据当前方案推断（老用户兼容）
  if(!p.goal){
    const cp = PLANS.find(x=>x.id===getCurrentPlanId());
    if(cp) p.goal = cp.goal === "减脂" ? "lose" : (cp.goal === "增肌" ? "muscle" : "health");
  }
  document.getElementById("meProfileSection").innerHTML = `
    <div class="st">编辑个人信息</div>
    <div class="me-card">
      <div style="padding:15px 18px;">${renderProfileForm(p)}</div>
      <div class="me-row">
        <span class="lbl"></span>
        <span class="act" onclick="saveMeProfile()">保存</span>
      </div>
    </div>
  `;
}

function saveMeProfile(){
  const p = loadProfile();
  PROFILE_FIELDS.forEach(f=>{
    if(f.type==="num"){
      const v = document.getElementById("profile_"+f.key).value;
      if(v) p[f.key] = parseFloat(v);
    }
  });
  if(p.goal === "lose"){
    const tw = document.getElementById("profile_targetWeight");
    const tww = document.getElementById("profile_targetWeeks");
    if(tw && tw.value) p.targetWeight = parseFloat(tw.value);
    if(tww && tww.value) p.targetWeeks = parseFloat(tww.value);
  }
  saveProfile(p);
  profileDraft = {};
  renderMe();
}

function exportData(){
  const data = {
    app:"lizi-diet",
    version:1,
    exportedAt:new Date().toISOString(),
    profile:loadProfile()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "lizi-diet-数据备份.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      const profile = data.profile || data;
      if(profile && typeof profile === "object"){
        // 只导入合法的个人信息字段
        const p = loadProfile();
        PROFILE_FIELDS.forEach(f=>{
          if(profile[f.key] !== undefined) p[f.key] = profile[f.key];
        });
        // 减脂专属字段 + 目标
        ["goal","targetWeight","targetWeeks"].forEach(k=>{
          if(profile[k] !== undefined) p[k] = profile[k];
        });
        saveProfile(p);
        renderMe();
        alert("导入成功，个人信息已更新。");
      } else {
        alert("文件格式不正确，未能导入。");
      }
    }catch(err){
      alert("文件解析失败，请确认是有效的 JSON 备份文件。");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

/* ==================================================================
   推荐食谱 & 食物热量计算

/* ---- 食物数据（内置 FOODS + 用户自定义） ---- */
const CUSTOM_FOOD_KEY = "lizi_custom_foods";
function loadCustomFoods(){
  try{ return JSON.parse(localStorage.getItem(CUSTOM_FOOD_KEY)) || []; }
  catch(e){ return []; }
}
function saveCustomFoods(list){
  try{ localStorage.setItem(CUSTOM_FOOD_KEY, JSON.stringify(list)); }catch(e){}
  _customNames = null;   // 自定义食物变了，「自定义」徽章的判定缓存必须失效
}
function allFoods(){
  return FOODS.concat(BRAND_FOODS).concat(loadCustomFoods());
}
function findFood(name){
  return allFoods().find(f=>f.name===name);
}
// 营养值可能是数值（旧数据/自定义食物）或范围 [lo,hi]（内置食物），统一取中值；null/undefined → 0
function mid(v){
  if(v === null || v === undefined) return 0;
  if(Array.isArray(v)) return (v[0] + v[1]) / 2;
  return v;
}
// 判断是否为「按份」的店面产品（有 serving 且非每100g模型）
function isServingFood(f){
  return f && f.serving !== undefined && f.unit !== undefined;
}
// 格式化成展示文本：范围显示「lo~hi」，纯数值原样返回
function fmtRange(v){
  if(Array.isArray(v)){
    const lo = Number.isInteger(v[0]) ? v[0] : v[0];
    const hi = Number.isInteger(v[1]) ? v[1] : v[1];
    return `${lo}~${hi}`;
  }
  return String(v);
}

/* ===== 数据来源分级：让用户知道这个数字有多可信 =====
   1112 种食物的可信度并不一样，但此前 UI 上完全没区分 ——
   用户看到「187 kcal」会当成实测值，这是虚假的确定感。
   不新增任何数据字段，全部从现有结构推导：
     custom    用户自己录的（可能重名覆盖内置，必须最先判）
     brand     有 brand 字段 = 品牌官方公布（BRAND_FOODS，202 条全有）
     estimated 外食/复合菜（类目见 OUT_EAT_CATS）或名字带「（估）」
               —— 同一道宫保鸡丁，各家油盐糖能差一倍，这里的数只能当参考
     basic     基础食材（鸡蛋/鸡胸/米饭…），数据稳定，不挂标记
   ⚠ 全部推导、不写死食物名单 —— 硬编码食物名单会与食物库漂移
   （此前 HIGH_FAT_PROTEIN 写「五花肉（熟）」而库里叫「猪五花肉（生）」就是这么失效的） */
let _customNames = null;
function customNameSet(){
  if(!_customNames) _customNames = new Set(loadCustomFoods().map(f=>f && f.name));
  return _customNames;
}
/* 外食/复合菜类目：库里按「一道菜 / 一家店」组织的类目。
   ⚠ 这里出现类目枚举，和上面「不写死名单」并不矛盾 —— 两回事：
     会漂移的是**食物条目名单**（库里随时增删、改名，写死必然失效）；
     **类目名**是食物库的组织层，全部 18 个、稳定可枚举。
   配套防漂移：测试里存了一份「基础食材类目」快照，两组并集必须等于 FOODS 的全部类目。
   以后食物库新增类目，测试会失败，逼作者决定它归哪一组 —— 而不是静默落进 basic。 */
const OUT_EAT_CATS = [
  "家常菜", "卤味", "沙县小吃", "黄焖鸡米饭", "麻辣烫",
  "米饭套餐", "兰州拉面", "炸鸡/小食", "煎饼/饼类",
];
function foodOrigin(f){
  if(!f || !f.name) return "basic";
  if(customNameSet().has(f.name)) return "custom";
  if(f.brand) return "brand";
  if(OUT_EAT_CATS.indexOf(f.category) >= 0 || /（估）/.test(f.name)) return "estimated";
  return "basic";
}
const ORIGIN_META = {
  brand:     { cls:"og-brand",  label:"官方",   tip:"品牌官方公布的数据" },
  estimated: { cls:"og-est",    label:"估算",   tip:"家常菜各家油盐差别很大，数值按常见做法估算" },
  custom:    { cls:"og-custom", label:"自定义", tip:"你自己录入的食物" },
};
/* 基础食材不挂徽章（鸡蛋/米饭这类数据稳定，人人都挂标签反而成了噪音） */
function originBadge(f){
  const o = foodOrigin(f);
  const m = ORIGIN_META[o];
  if(!m) return "";
  // 品牌食物在 tooltip 里带上具体品牌：光写「官方」用户不知道是哪家的官方
  const tip = (o === "brand" && f && f.brand) ? `${m.tip}（${f.brand}）` : m.tip;
  return `<span class="origin-tag ${m.cls}" title="${tip}">${m.label}</span>`;
}
/* 详情里的来源说明：徽章只有两个字，用户看不出「估算」到底意味着多少不确定性，
   所以选中某个食物、要拿它的数字做决定时，必须把口径讲清楚 */
const ORIGIN_NOTE = {
  brand:     `<b>官方数据</b>：品牌公布的营养信息，按「份」计算 —— 规格不同（去糖、加酱）会有出入，可用下面的热量微调修正。`,
  estimated: `<b>估算值</b>：家常菜/餐厅菜的油盐用量各家差别很大，这里按常见做法估。实际可能比这个高不少，心里留点余量。`,
  custom:    `<b>你自己录入的</b>：数值以你填写的为准。`,
  basic:     `<b>基础食材</b>：参考《中国食物成分表》等公开数据的常见范围，按每 100g 可食部计。同一食材会因品种、生熟、烹饪方式浮动，所以内置数据用区间而非单点值。`,
};
function originNote(f){
  const t = ORIGIN_NOTE[foodOrigin(f)];
  return t ? `<div class="origin-note">${t}</div>` : "";
}
/* 展示名：去掉名字尾巴上的「（估）」—— 那是数据层标记，在 UI 里由「估算」徽章承担，
   名字里再挂一遍等于同一件事说两遍。
   ⚠ 只用于显示！findFood / PORTIONS / localStorage 里用的都是原名，绝不能拿它去查 */
function showName(f){
  if(!f) return "";
  return String(f.name || "").replace(/（估）$/, "");
}
/* 按名字安全取展示名：食物被删/找不到时退回原名，不能显示空白 */
function showNameOf(name){
  const fd = findFood(name);
  return fd ? showName(fd) : String(name || "");
}
function foodKcal(f, grams){
  // 按份产品（店面品牌）：grams 参数传的是「份数」，直接乘单份营养值
  if(isServingFood(f)){
    const servings = grams;  // 此时 grams 语义为份数
    return {
      kcal: f.kcal * servings,
      protein: (f.protein==null?0:f.protein) * servings,
      carb: (f.carb==null?0:f.carb) * servings,
      fat: (f.fat==null?0:f.fat) * servings
    };
  }
  // 按每 100g 营养值，换算成实际克数的热量与三大营养素
  return {
    kcal: mid(f.kcal) * grams / 100,
    protein: mid(f.protein) * grams / 100,
    carb: mid(f.carb) * grams / 100,
    fat: mid(f.fat) * grams / 100
  };
}

/* ---- 去脂体重（瘦体重）----
   蛋白 / 脂肪按「瘦体重」而非总体重计算：同样 80kg，体脂 15% 与 35% 的肌肉量差 20%，
   按总体重给宏量会让高体脂者蛋白/脂肪被系统性高估（原实现 bodyFat 完全不参与，逐位相同）。
   缺省按 20% 体脂折算（w×0.8）—— 与既有典型值等价，保证未填体脂的用户输出不变。 */
function leanMass(profile){
  const w = profile.weight;
  const bf = parseFloat(profile.bodyFat);
  if(isFinite(bf) && bf > 0 && bf < 70) return w * (1 - bf/100);
  return w * 0.8;   // 缺省按 20% 体脂
}

/* ---- 计算目标营养素（复用一个纯净函数，供食谱匹配用） ---- */
function computeTarget(planId, profile){
  const w = profile.weight;
  const g = profile.gender, age = profile.age, h = profile.height;
  const bmr = 10*w + 6.25*h - 5*age + (g==="male"?5:-161);
  let carb=0, protein=0, fat=0, kcal=0;
  switch(planId){
    case "month3": case "carb-descend": {
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB[planId]||{})[tl] || 2.8;
      const lean = leanMass(profile);
      // 蛋白/脂肪按瘦体重：×1.875 / ×0.875 ≡ 原 ×1.5 / ×0.7 ÷ 0.8 —— 20% 体脂时与旧值逐位一致
      carb = w*carbK; protein = lean*1.875; fat = lean*0.875; kcal = carb*4+protein*4+fat*9; break;
    }
    case "triple-carb": {
      const tl = profile.actLevel || "mod";
      const carbK = (ACT_CARB[planId]||{})[tl] || 3.0;
      const lean = leanMass(profile);
      carb = w*carbK; protein = lean*2.0; fat = lean*1.0; kcal = carb*4+protein*4+fat*9; break;
    }
    case "five32": {
      const base = five32Base(profile);
      const act = profile.actLevel || "sed";
      const def = base==="big"?500:300;
      const actK = ACT_FACTOR[act] || 1.2;
      const tdee = bmr*actK; const intake = tdee-def;
      carb = intake*0.5/4; protein = intake*0.3/4; fat = intake*0.2/9; kcal = intake; break;
    }
    case "kai-carb-cycle": {
      const bt = segState.bodyType || "endo";
      const p = PLANS.find(x=>x.id==="kai-carb-cycle");
      const opt = p.inputs[0].options.find(o=>o.v===bt);
      const lean = leanMass(profile);
      // 蛋白/脂肪按瘦体重（脂肪系数 ÷0.8 折算，20% 体脂与旧值一致）；碳水仍按总体重（常规做法）
      carb = w*opt.carb; fat = lean*(opt.fat/0.8); protein = lean*1.25; kcal = carb*4+protein*4+fat*9; break;
    }
    case "dietary-guideline": {
      const act = profile.actLevel || "sed";
      const actK = ACT_FACTOR[act] || 1.2; const tdee = bmr*actK;
      kcal = tdee; carb = tdee*0.575/4; protein = tdee*0.125/4; fat = tdee*0.25/9; break;
    }
    case "zengji-yingyu": {
      const tl = profile.actLevel || "mod";
      const actK = ACT_FACTOR[tl] || 1.55; const tdee = bmr*actK;
      const bf = surplusForBodyFat(profile);
      const intake = tdee+bf.surplus;
      const lean = leanMass(profile);
      // 蛋白/脂肪按瘦体重；碳水改「残差」—— 与原 kcal 口径（tdee+surplus）统一。
      // 原实现两套口径互不引用（kcal 走 tdee+surplus、macro 走 w×系数），
      // 致 85.2% 的格子 carb*4+protein*4+fat*9 与声明 kcal 偏差 >5%（最大 +64.2%），
      // 随后靠 normalizeTarget 的残差反解把碳水悄悄改掉（62% 的格子碳水被改 >10%）。
      protein = lean*2.25; fat = lean*1.0; kcal = intake;
      carb = (intake - protein*4 - fat*9)/4; break;
    }
  }

  /* ── 生理下限校准（安全阀）─────────────────────────────
     依据：本函数原无任何下限 —— 现实体型（BMI 18.5–30）网格 19.8% 的格子给出 kcal < BMR；
     kai-carb-cycle 选内胚时 83.2% 击穿；dietary-guideline 蛋白低至 0.83 g/kg 体重；
     kai-carb-cycle 是减脂方案却恒为 1.0 g/kg 蛋白。
     顺序要点（**顺序本身就是正确性的一部分**）：
       先定「与热量无关」的下限（蛋白、脂肪的瘦体重部分）→ 再定热量与碳水 →
       最后用**最终** kcal 复算脂肪供能 15% 下限。
     ⚠ 原实现把 15% 判据放在定热量之前（用抬升前的 kcal），five32 这类被抬到 BMR 的方案
       会后手击穿 15%（实测 19 格，全部 female + 低体重/高龄）—— 故把 15% 复算挪到第 (4) 步。
     ⚠ 取舍 1：下限的差额「由谁吸收」按方案类型分两路（见 KCAL_DOMINANT）——
       热量主导型让碳水当残差；宏量主导型让热量跟着上去，不压缩方案自带的碳水 g/kg 承诺。
     ⚠ 取舍 2：dietary-guideline 的名义供能比（碳 57.5% / 蛋白 12.5% / 脂肪 25%）会被打破 ——
       实测蛋白供能最高 28.95%、68% 的格子越过自述的 10–15% 区间（碳水最低 46.05%）。
       根因是「绝对量下限优先于供能比」：低 TDEE 体格上，1.2 g/kg 体重的蛋白下限相对很小的
       总热量，占比必然高。**有意为之**，不是缺陷。 */
  // planGoal 是函数声明（已提升）→ 此处可直接调用；返回中文，经 GOAL_TYPE 白名单映射
  const _goal = planGoal(planId);
  const goalType = (GOAL_TYPE[_goal] || "lose");   // 未知标签回退最严格一侧
  const _lean = leanMass(profile);

  // 目标驱动缺口（仅减脂方案）：用户填了「目标体重 + 计划周数」时，
  // 用 (需减 kg × 7700) / (周数 × 7) 反推每日缺口，替代方案自带的隐性缺口。
  // 未填 / 填得不合理的用户完全不受影响。
  // ⚠ 只对**热量主导型**减脂方案生效（= five32），不是全部减脂方案 —— 两个硬原因：
  //   ① 宏量主导型（month3/carb-descend/triple-carb/kai）第 (3) 步会 `kcal = C*4+P*4+F*9`
  //      覆盖这里的值，写了也白写；
  //   ② 更糟的是，覆盖前那句 `if(kcal < bmr)` 会**读到被本块抬高/压低的 kcal** 而误判，
  //      从而抑制掉「抬碳水到 BMR」的兜底 —— 实测有目标时击穿 ① 共 417 格
  //      （month3 69 / carb-descend 99 / triple-carb 79 / kai 170，例：男 18y/155/45/mod
  //      目标 37kg/16 周 → kai 给出 1012 kcal 而 BMR = 1333.75）。
  //   ③ 语义上也应当如此：宏量主导型的「隐性缺口」写在碳水 g/kg 系数里，改它等于改写
  //      用户可感知的「碳水 2.5g/kg」承诺 —— 与上一轮「保碳水承诺、让热量让步」的取舍冲突。
  if(goalType === "lose" && KCAL_DOMINANT[planId]){
    const _tw = parseFloat(profile.targetWeight), _wk = parseFloat(profile.targetWeeks);
    if(isFinite(_tw) && isFinite(_wk) && _wk > 0 && _tw > 0 && _tw < w){
      const _deficit = (w - _tw) * 7700 / (_wk * 7);
      const _tdee = bmr * (ACT_FACTOR[profile.actLevel] || 1.55);
      kcal = _tdee - _deficit;
    }
  }

  // (1) 蛋白下限：日常健康 1.5 / 减脂·增肌 2.0 g/kg 瘦体重
  protein = Math.max(protein, _lean * (goalType === "health" ? 1.5 : 2.0));

  // (2) 脂肪下限的「瘦体重部分」（0.5 g/kg 瘦体重）—— 与热量无关，可先定；
  //     供能 15% 的部分必须用最终 kcal，放到第 (4) 步
  fat = Math.max(fat, _lean * 0.5);

  // (3) 热量下限 + 碳水收尾 —— 按方案类型分两路
  if(KCAL_DOMINANT[planId]){
    // 热量主导型：kcal 是方案定义，碳水当残差吸收差额
    if(!(kcal > 0) || kcal < bmr) kcal = bmr;
    carb = (kcal - protein*4 - fat*9) / 4;
    if(carb < 100){ carb = 100; kcal = carb*4 + protein*4 + fat*9; }
  }else{
    // 宏量主导型：三大宏量 g/kg 是方案定义，热量随之推导。
    // ⚠ BMR 硬约束优先于「碳水 g/kg 承诺」：蛋白/脂肪已在下限，要补到 BMR 只能抬碳水，
    //   极端体型（如 month3 45kg 高活动）碳水会从 3.5 抬到 4.37 g/kg —— 有意为之。
    if(kcal < bmr){
      const carbNeeded = (bmr - protein*4 - fat*9) / 4;
      if(carb < carbNeeded) carb = carbNeeded;
    }
    if(carb < 100) carb = 100;
    kcal = carb*4 + protein*4 + fat*9;
  }

  // (4) 脂肪供能下限复算 —— 必须用**最终** kcal（第 (3) 步收尾之后的值）。
  //     ⚠ 这就是本轮修复的要点：原实现用抬升前的 kcal 算 15%，kcal 被抬到 BMR 后
  //       fat*9 相对新 kcal 就不足 15% 了（five32 实测 19 格，全部 female + 低体重/高龄）。
  //     ⚠ 抬脂肪会连锁改变 kcal（宏量主导型）或碳水（热量主导型），且碳水跌破 100 时
  //       又会把 kcal 抬回去 —— 所以这里是「不动点迭代 + 按最终 kcal 严格校验」：
  //       · 宏量主导型：不动点 fat*9 = 0.15*(K0 + fat*9) ⟺ fat = K0/51，一步到位；
  //       · 最后按 ULP 级抬 fat 兜底 —— 解析解与 kcal*0.15 在 IEEE 下仍可能差 1 ULP。
  if(fat*9 < kcal*0.15){
    const K0 = carb*4 + protein*4;   // 本步不改碳水，K0 是常量
    for(let i=0;i<32;i++){
      if(KCAL_DOMINANT[planId]){
        fat = Math.max(fat, kcal*0.15/9);              // 热量已锁定 → 反解脂肪
        carb = (kcal - protein*4 - fat*9)/4;           // 差额由碳水残差吸收
        if(carb < 100){ carb = 100; kcal = carb*4 + protein*4 + fat*9; }
      }else{
        fat = Math.max(fat, K0/51);                    // 宏量主导型的不动点闭式解
        kcal = K0 + fat*9;
      }
      if(fat*9 >= kcal*0.15) break;                    // 用**最终** kcal 严格判，成立才退出
      fat += Math.abs(fat) * Number.EPSILON;           // 浮点兜底：ULP 级（~1e-16 g，生理上无意义）
    }
  }

  return { carb, protein, fat, kcal };
}
